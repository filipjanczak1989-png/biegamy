<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BiegaMy">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="BiegaMy">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<title>Łączenie z intervals.icu · BiegaMy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sb.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
  html,body{ margin:0; height:100%; background:var(--bg,#07070a); color:var(--fg,#f0ede8); font-family:'Inter',system-ui,sans-serif; }
  .wrap{ min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .card{ width:100%; max-width:360px; background:var(--card,rgba(255,255,255,0.04)); border:1px solid var(--border,rgba(255,255,255,0.1)); border-radius:18px; padding:28px 24px; text-align:center; }
  .icu-logo{ font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent,#e8561e); margin-bottom:18px; }
  .spinner{ width:34px; height:34px; border:3px solid rgba(255,255,255,0.12); border-top-color:var(--accent,#e8561e); border-radius:50%; margin:6px auto 16px; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .icon{ font-size:34px; margin-bottom:12px; line-height:1; }
  .msg{ font-size:15px; font-weight:600; margin-bottom:6px; }
  .sub{ font-size:12px; color:var(--muted,rgba(240,237,232,0.55)); font-family:'DM Mono',monospace; line-height:1.5; }
  .btn{ display:inline-block; margin-top:18px; background:var(--accent,#e8561e); color:#fff; text-decoration:none; border-radius:12px; padding:12px 22px; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; }
  .kod-gra{ margin-top:16px; padding:10px 12px; border:1px dashed var(--accent,#e8561e); border-radius:12px; font-family:'DM Mono',monospace; font-size:11px; color:var(--fg,#f0ede8); line-height:1.5; }
  .kod-gra b{ color:var(--accent,#e8561e); letter-spacing:0.08em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icu-logo">BiegaMy × intervals.icu</div>
    <div id="cb-body">
      <div class="spinner"></div>
      <div class="msg">Łączenie…</div>
      <div class="sub">chwila, autoryzujemy dostęp</div>
    </div>
  </div>
</div>
<script>
(async function(){
  const bodyEl = document.getElementById('cb-body');
  const esc = window.escapeHtml || (s => String(s));
  const show = (icon, msg, sub, withBtn) => {
    bodyEl.innerHTML =
      (icon ? '<div class="icon">' + icon + '</div>' : '') +
      '<div class="msg">' + esc(msg) + '</div>' +
      (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
      (withBtn ? '<a class="btn" href="profil.html?open=icu">Wróć do profilu</a>' : '');
  };
  // Pomost v1 appka→Bieguś: kod bonusowy za podłączenie zegarka (KODY_BONUS.ZEGAREK w grze, +75 piór)
  const KOD_GRA = '<div class="kod-gra">🎁 Bonus w <b>Biegusiu</b> odblokowany: <b>+75 🪶</b> czeka w grze! (na innym urządzeniu: kod <b>ZEGAREK</b>)</div>';

  const params = new URLSearchParams(location.search);
  const code  = params.get('code');
  const state = params.get('state');
  const oauthErr = params.get('error');

  // 1) user odmówił / błąd po stronie intervals
  if (oauthErr || !code) {
    show('✕', 'Autoryzacja anulowana', oauthErr ? ('intervals.icu: ' + oauthErr) : 'brak kodu autoryzacji', true);
    return;
  }

  // 2) BRAMKA CSRF — state musi zgadzać się z nonce zapisanym przed przekierowaniem (sessionStorage, one-shot)
  const savedState = sessionStorage.getItem('icu_oauth_state');
  sessionStorage.removeItem('icu_oauth_state');   // jednorazowy — zużyty niezależnie od wyniku
  if (!state || !savedState || state !== savedState) {
    // BEZPIECZEŃSTWO BEZ ZMIAN — dalej twardy blok + return. Zmienia się TYLKO treść komunikatu:
    // pod Google Translate origin się zmienia i state znika → to nie atak, tylko tłumaczenie. Czytelny komunikat zamiast strasznego „CSRF".
    var viaTranslate = location.hostname.indexOf('translate.goog') !== -1
      || (document.referrer || '').indexOf('translate.goog') !== -1;
    if (viaTranslate) {
      show('🌐', 'Tłumaczenie przerwało łączenie', 'Google Translate zmienił adres strony i połączenie nie doszło. Otwórz BiegaMy bez tłumaczenia i połącz ponownie z profilu.', true);
    } else {
      show('🛑', 'Błąd bezpieczeństwa', 'nieprawidłowy parametr state (CSRF) — spróbuj połączyć ponownie z profilu', true);
    }
    return;
  }

  // W2b: dokąd wrócić po sukcesie — znacznik z WATCH.odpalOAuth(returnTo), one-shot.
  // default = profil.html (zero regresji dla dotychczasowego flow); tylko ścieżki względne (anty open-redirect).
  const savedReturn = sessionStorage.getItem('icu_oauth_return');
  sessionStorage.removeItem('icu_oauth_return');
  const returnDest = (savedReturn && !savedReturn.includes(':') && !savedReturn.startsWith('//'))
    ? savedReturn : 'profil.html?open=icu';

  // 3) musisz być zalogowany w BiegaMy (EF wiąże token z Twoją sesją)
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch(e){}
  if (!session) {
    show('🔒', 'Zaloguj się najpierw', 'otwórz BiegaMy, zaloguj się i połącz intervals.icu z profilu', true);
    return;
  }

  // 4) exchange — callback wysyła TYLKO code; EF (intervals-oauth) rozwiązuje athletę z JWT (nie ufa clientowi), wymienia code→token, zapisuje server-side
  try {
    const res = await fetch((window.SB_FN_URL || 'https://afqojgkaveykxbltxzwm.supabase.co/functions/v1') + '/intervals-oauth', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },   // ZERO apikey (CORS)
      body: JSON.stringify({ code: code })
    });
    const data = await res.json().catch(() => null);
    if (res.ok && data && data.ok) {
      if (data.activities_count === 0) {
        // Sukces, ale intervals PUSTY → Garmin niepodłączony. Ton POZYTYWNY (✅, NIE błąd), bez auto-redirectu.
        // Instrukcja podłączenia Garmina żyje w profil.html?open=icu (WATCH.helpHtml) — reuse przez link (opcja B).
        bodyEl.innerHTML =
          '<div class="icon">✅</div>' +
          '<div class="msg">Połączono! Jeszcze jeden krok</div>' +
          '<div class="sub">Twój zegarek jest połączony, ale intervals.icu nie widzi jeszcze treningów. Podłącz swój zegarek w intervals.icu, żeby biegi zaczęły wpadać do BiegaMy.</div>' +
          '<a class="btn" href="profil.html?open=icu">Zobacz jak podłączyć zegarek</a>' + KOD_GRA;
        try{localStorage.setItem('biegus_bonus_zegarek','1');}catch(e){}
      } else {
        // count>0 → treningi są; count null/undefined (EF call padł, nieznane) → nie strasz. Oba: normalny sukces + redirect.
        const sub = (data.activities_count > 0) ? 'Twoje treningi zaczną wpadać — przekierowuję…' : 'przekierowuję…';
        show('✅', 'Połączono z intervals.icu', sub, false);
        try{localStorage.setItem('biegus_bonus_zegarek','1');}catch(e){}
        bodyEl.insertAdjacentHTML('beforeend', KOD_GRA);   // kod widoczny zanim przekieruje
        setTimeout(() => { location.replace(returnDest); }, 3500);
      }
    } else if (data && data.error === 'already_linked') {
      show('✕', 'To konto intervals jest już podłączone', 'do zawodnika: ' + (data.owner || '?') + '. Wyloguj się z tego konta na intervals.icu i połącz swoje.', true);
    } else {
      show('✕', 'Nie udało się połączyć', (data && data.error) ? ('błąd: ' + data.error) : ('kod ' + res.status), true);
    }
  } catch(e) {
    show('✕', 'Nie udało się połączyć', 'błąd sieci: ' + e.message, true);
  }
})();
</script>
</body>
</html>
