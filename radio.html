<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0c0c10">
<title>Radio · BIEGAMY</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c10; --card:#13131a; --card2:#1a1a22;
  --fg:#f0ede8; --muted:rgba(240,237,232,0.55); --border:rgba(255,255,255,0.08);
  --accent:#e8561e; --accent2:#FF6B2C; --green:#3db870;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
body{padding:0 0 200px;min-height:100vh;}
.rad-hdr{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border);}
.rad-hdr a{background:rgba(255,255,255,0.07);border:none;color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;}
.rad-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.04em;}
.rad-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:14px 16px;}
.rad-tab{flex:1;background:transparent;color:var(--muted);border:none;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:11px 4px;cursor:pointer;}
.rad-tab.on{background:rgba(232,86,30,0.12);color:var(--accent);}
.rad-tab + .rad-tab{border-left:1px solid var(--border);}
.rad-wrap{padding:0 16px;}
.rad-empty{text-align:center;color:var(--muted);font-size:13px;font-family:'Inter',sans-serif;padding:48px 20px;line-height:1.5;}
.rad-card{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:10px;}
.rad-cover{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:22px;}
.rad-meta{flex:1;min-width:0;}
.rad-tt{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rad-ar{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rad-play{background:var(--accent);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;}
.rad-like{background:rgba(255,255,255,0.06);border:none;color:var(--muted);border-radius:15px;height:30px;padding:0 9px;font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;gap:3px;font-family:'DM Mono',monospace;}
.rad-like.on{color:var(--accent);background:rgba(232,86,30,0.12);}
.rad-rank{width:24px;flex-shrink:0;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);}
.rad-newpl{display:block;width:100%;background:rgba(255,255,255,0.06);border:1px dashed rgba(232,86,30,0.45);color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:12px;}
/* Player bar */
#rad-player{position:fixed;left:0;right:0;bottom:0;background:rgba(16,14,22,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);display:none;z-index:60;}
#rad-video{width:100%;max-height:200px;border-radius:12px;background:#000;display:none;margin-bottom:8px;}
.rad-np{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
#rad-np-cover{width:40px;height:40px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,0.06);flex-shrink:0;}
#rad-np-ph{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,0.06);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
#rad-np-title{font-family:'Bebas Neue',sans-serif;font-size:17px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#rad-loop-btn{background:rgba(255,255,255,0.08);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;flex-shrink:0;opacity:0.4;}
.rad-nav-btn{background:rgba(255,255,255,0.08);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;flex-shrink:0;}
#rad-audio{width:100%;}
</style>
</head>
<body>
<div class="rad-hdr">
  <a href="zawodnik.html" title="Wróć">‹</a>
  <div class="rad-title">📻 Radio BiegaMy</div>
</div>

<div class="rad-tabs">
  <button class="rad-tab on" id="rtab-katalog" onclick="radioTab('katalog')">🎵 Katalog</button>
  <button class="rad-tab" id="rtab-przeboje" onclick="radioTab('przeboje')">🏆 Przeboje</button>
  <button class="rad-tab" id="rtab-playlisty" onclick="radioTab('playlisty')">📂 Playlisty</button>
</div>

<div class="rad-wrap">
  <div id="radio-catalog"><div class="rad-empty">Ładowanie…</div></div>
  <div id="radio-top" style="display:none;"></div>
  <div id="radio-playlists" style="display:none;"></div>
</div>

<!-- Player bar -->
<div id="rad-player">
  <video id="rad-video" controls playsinline preload="none"></video>
  <div class="rad-np">
    <img id="rad-np-cover" alt="" style="display:none;" onerror="this.style.display='none';var p=document.getElementById('rad-np-ph');if(p)p.style.display='flex';">
    <div id="rad-np-ph">🎵</div>
    <div id="rad-np-title" style="flex:1;min-width:0;">—</div>
    <button class="rad-nav-btn" onclick="radioPrev()" title="Poprzedni">⏮</button>
    <button class="rad-nav-btn" onclick="radioNext()" title="Następny">⏭</button>
    <button id="rad-loop-btn" onclick="radioToggleLoop()" title="Powtarzanie">↻</button>
    <button onclick="radioClosePlayer()" style="background:rgba(255,255,255,0.08);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0;">✕</button>
  </div>
  <audio id="rad-audio" controls preload="none"></audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<script>
let _radioUid = null;
let _radioTracks = [];
let _radioQueue = [];      // kontekst odtwarzania (kolejka track-obiektów)
let _radioIdx = -1;        // indeks aktualnego w _radioQueue
let _radioLoop = 'off';    // 'off' | 'all' | 'one'
let _radioCurrentPlaylist = null;  // {id,name} gdy otwarty widok playlisty (do re-renderu)
let _radioPlaylistTracks = [];     // kawałki otwartej playlisty (źródło kolejki)
let _radioLikedSet = new Set();    // track_id polubione przez usera
let _radioTopTracks = [];          // kawałki zakładki Przeboje (źródło kolejki)
let _radioPlayTimer = null;        // timer 5s do zliczenia odtworzenia
let _radioPlaylistRows = [];       // wiersze radio_playlist_tracks (id+position) — do reorderu

async function radioInit(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { setTimeout(async () => {
    const { data: { session: s2 } } = await sb.auth.getSession();
    if (!s2) { window.location.href = 'index.html'; return; }
    _radioUid = s2.user.id; radioLoad();
  }, 1000); return; }
  _radioUid = session.user.id;
  radioLoad();
}

// 'ended' raz: loop 'one' → powtórz ten sam, inaczej następny (radioNext respektuje loop 'all').
// play/pause: synchronizuj mediaSession.playbackState — Android Chrome utrzymuje audio
// w tle TYLKO przy żywej sesji ('playing'); bez tego pauzuje przy zgaszonym ekranie.
(function(){
  const aud = document.getElementById('rad-audio');
  if (!aud) return;
  aud.addEventListener('ended', function(){
    if (_radioLoop === 'one') { radioPlayAt(_radioIdx); return; }
    radioNext();
  });
  aud.addEventListener('play', function(){
    if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = 'playing'; } catch(e){} }
  });
  aud.addEventListener('pause', function(){
    if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = 'paused'; } catch(e){} }
  });
})();

async function radioLoad(){
  await loadLikes();
  await Promise.all([loadCatalog(), loadPlaylists()]);
}

async function loadLikes(){
  _radioLikedSet = new Set();
  const { data } = await sb.from('radio_likes').select('track_id').eq('user_id', _radioUid);
  (data || []).forEach(function(r){ _radioLikedSet.add(r.track_id); });
}

function radioFmtDur(sec){
  sec = parseInt(sec, 10) || 0;
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// Wspólny budowniczy karty kawałka (katalog + przeboje). playOnclick = treść onclick przycisku ▶.
function radioCardHtml(t, playOnclick, rank){
  const cover = window.safeUrlAttr ? window.safeUrlAttr(window.RADIO.coverUrl(t)) : '';
  const coverHtml = cover
    ? '<img class="rad-cover" src="' + cover + '" alt="" onerror="this.outerHTML=\'<div class=&quot;rad-cover&quot;>🎵</div>\'">'
    : '<div class="rad-cover">🎵</div>';
  const dur = t.duration_sec ? (' · ' + radioFmtDur(t.duration_sec)) : '';
  const liked = _radioLikedSet.has(t.id);
  const rankHtml = rank ? ('<div class="rad-rank">' + rank + '</div>') : '';
  return '<div class="rad-card">' + rankHtml + coverHtml
    + '<div class="rad-meta"><div class="rad-tt">' + escapeHtml(t.title || t.slug) + '</div>'
    + '<div class="rad-ar">' + (t.artist ? escapeHtml(t.artist) : '—') + dur + ' · ▶ ' + (t.play_count || 0) + '</div></div>'
    + '<button class="rad-like' + (liked ? ' on' : '') + '" onclick="radioToggleLike(\'' + t.id + '\',this)" title="Polub">' + (liked ? '♥' : '♡') + ' <span>' + (t.like_count || 0) + '</span></button>'
    + '<button class="rad-nav-btn" onclick="radioAddToPlaylistPicker(\'' + t.id + '\')" title="Dodaj do playlisty">➕</button>'
    + '<button class="rad-play" onclick="' + playOnclick + '">▶</button></div>';
}

async function radioToggleLike(trackId, btn){
  const liked = _radioLikedSet.has(trackId);
  if (liked){
    const { error } = await sb.from('radio_likes').delete().eq('track_id', trackId).eq('user_id', _radioUid);
    if (error){ alert('Błąd: ' + error.message); return; }
    _radioLikedSet.delete(trackId);
  } else {
    const { error } = await sb.from('radio_likes').insert({ track_id: trackId, user_id: _radioUid });
    if (error && error.code !== '23505'){ alert('Błąd: ' + error.message); return; }
    _radioLikedSet.add(trackId);
  }
  const nowLiked = _radioLikedSet.has(trackId);
  const span = btn.querySelector('span');
  let n = span ? (parseInt(span.textContent, 10) || 0) : 0;
  n += nowLiked ? 1 : -1; if (n < 0) n = 0;
  btn.innerHTML = (nowLiked ? '♥' : '♡') + ' <span>' + n + '</span>';
  btn.classList.toggle('on', nowLiked);
}

async function loadTop(){
  const el = document.getElementById('radio-top');
  if (!window.RADIO){ el.innerHTML = '<div class="rad-empty">Odśwież aplikację.</div>'; return; }
  const { data, error } = await sb.from('radio_top').select('*')
    .order('like_count', { ascending: false })
    .order('play_count', { ascending: false })
    .order('title', { ascending: true });
  if (error){ el.innerHTML = '<div class="rad-empty">Błąd ładowania.</div>'; return; }
  _radioTopTracks = data || [];
  if (!_radioTopTracks.length){ el.innerHTML = '<div class="rad-empty">Brak danych.</div>'; return; }
  el.innerHTML = _radioTopTracks.map(function(t, idx){
    return radioCardHtml(t, 'radioPlayTopAt(' + idx + ')', idx + 1);
  }).join('');
}

function radioPlayTopAt(idx){
  if (!_radioTopTracks.length) return;
  _radioQueue = _radioTopTracks.slice();
  radioPlayAt(idx);
}

async function loadCatalog(){
  const el = document.getElementById('radio-catalog');
  if (!window.RADIO) { el.innerHTML = '<div class="rad-empty">Moduł radia nie załadował się 🔄<br>Odśwież aplikację (zamknij i otwórz / przeciągnij w dół).</div>'; return; }
  const { data, error } = await sb.from('radio_top').select('*').order('created_at', { ascending: true });
  if (error) { el.innerHTML = '<div class="rad-empty">Błąd ładowania katalogu.</div>'; return; }
  _radioTracks = data || [];
  if (!_radioTracks.length) { el.innerHTML = '<div class="rad-empty">Biblioteka jest pusta 🎵<br>Trener jeszcze nie wgrał żadnych utworów.</div>'; return; }
  el.innerHTML = _radioTracks.map(function(t){
    return radioCardHtml(t, "radioPlay('" + t.id + "')");
  }).join('');
}

async function loadPlaylists(){
  const el = document.getElementById('radio-playlists');
  const { data, error } = await sb.from('radio_playlists').select('*').eq('owner_id', _radioUid).order('created_at', { ascending: true });
  let html = '<button class="rad-newpl" onclick="radioNewPlaylist()">➕ Nowa playlista</button>';
  if (error) { el.innerHTML = html + '<div class="rad-empty">Błąd ładowania playlist.</div>'; return; }
  const pls = data || [];
  if (!pls.length) { html += '<div class="rad-empty">Nie masz jeszcze playlist.<br>Stwórz pierwszą i dodawaj utwory z katalogu.</div>'; }
  else {
    html += pls.map(function(p){
      return '<div class="rad-card" onclick="radioOpenPlaylist(\'' + p.id + '\')" style="cursor:pointer;">'
        + '<div class="rad-cover">📂</div>'
        + '<div class="rad-meta"><div class="rad-tt">' + escapeHtml(p.name) + '</div><div class="rad-ar">playlista</div></div>'
        + '<span style="color:var(--muted);font-size:18px;flex-shrink:0;">›</span></div>';
    }).join('');
  }
  el.innerHTML = html;
}

function radioTab(name){
  const panels = { katalog: 'radio-catalog', przeboje: 'radio-top', playlisty: 'radio-playlists' };
  Object.keys(panels).forEach(function(t){
    const btn = document.getElementById('rtab-' + t);
    if (btn) btn.classList.toggle('on', t === name);
    const panel = document.getElementById(panels[t]);
    if (panel) panel.style.display = (t === name) ? 'block' : 'none';
  });
  if (name === 'przeboje') loadTop();   // odśwież ranking przy wejściu
}

// Klik w katalogu: kolejka = cały katalog, start od klikniętego.
function radioPlay(trackId){
  const i = _radioTracks.findIndex(function(x){ return x.id === trackId; });
  if (i < 0) return;
  _radioQueue = _radioTracks.slice();
  radioPlayAt(i);
}

// Rdzeń D1: dźwięk ZAWSZE przez <audio src=mp4> (ścieżka audio z mp4) — NIE <video>.
// To zapewnia granie przy zgaszonym ekranie / w tle na iOS. Wideo całkowicie schowane.
function radioPlayAt(i){
  if (!window.RADIO) { alert('Odśwież aplikację — moduł radia nie załadował się.'); return; }
  if (i < 0 || i >= _radioQueue.length) return;
  const t = _radioQueue[i];
  if (!t) return;
  const url = window.safeUrlAttr ? window.safeUrlAttr(window.RADIO.mediaUrl(t)) : '';
  if (!url) return;
  _radioIdx = i;

  const player = document.getElementById('rad-player');
  const vid = document.getElementById('rad-video');
  const aud = document.getElementById('rad-audio');
  const cover = window.safeUrlAttr ? window.safeUrlAttr(window.RADIO.coverUrl(t)) : '';

  document.getElementById('rad-np-title').textContent = (t.title || t.slug) + (t.artist ? ' · ' + t.artist : '');
  // Cover: pokaż gdy jest, placeholder gdy null (struktura gotowa na cover_slug dograny później).
  const npCover = document.getElementById('rad-np-cover');
  const npPh = document.getElementById('rad-np-ph');
  if (cover) { npCover.src = cover; npCover.style.display = ''; if (npPh) npPh.style.display = 'none'; }
  else { npCover.removeAttribute('src'); npCover.style.display = 'none'; if (npPh) npPh.style.display = 'flex'; }

  // D1: wideo nieużywane jako źródło dźwięku — zatrzymaj i schowaj całkowicie.
  try { vid.pause(); } catch(e){}
  vid.removeAttribute('src'); vid.style.display = 'none';

  aud.src = url;                 // <-- mp4; <audio> gra ścieżkę dźwiękową (klucz iOS)
  aud.style.display = 'block';
  player.style.display = 'block';
  aud.play().catch(function(){});

  // Zlicz odtworzenie po 5s ciągłego grania (Filip: próg 5s). Globalny licznik (bez per-user dedupe).
  if (_radioPlayTimer) clearTimeout(_radioPlayTimer);
  _radioPlayTimer = setTimeout(function(){
    if (aud.paused) return;
    sb.rpc('increment_play', { p_track_id: t.id });
    t.play_count = (t.play_count || 0) + 1;
  }, 5000);

  radioUpdateMediaSession(t, cover);
}

function radioNext(){
  if (!_radioQueue.length) return;
  if (_radioIdx + 1 < _radioQueue.length) radioPlayAt(_radioIdx + 1);
  else if (_radioLoop === 'all') radioPlayAt(0);   // zawijanie na koniec kolejki
}

function radioPrev(){
  if (!_radioQueue.length) return;
  const aud = document.getElementById('rad-audio');
  if (aud.currentTime > 3) { aud.currentTime = 0; return; }  // >3s → restart bieżącego
  if (_radioIdx - 1 >= 0) radioPlayAt(_radioIdx - 1);
  else if (_radioLoop === 'all') radioPlayAt(_radioQueue.length - 1);
}

function radioToggleLoop(){
  _radioLoop = _radioLoop === 'off' ? 'all' : _radioLoop === 'all' ? 'one' : 'off';
  const b = document.getElementById('rad-loop-btn');
  if (!b) return;
  b.textContent = _radioLoop === 'one' ? '↻¹' : '↻';
  b.style.opacity = _radioLoop === 'off' ? '0.4' : '1';
  b.title = _radioLoop === 'off' ? 'Powtarzanie: wył.' : _radioLoop === 'all' ? 'Powtarzaj kolejkę' : 'Powtarzaj utwór';
}

function radioUpdateMediaSession(t, cover){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title || t.slug || 'BiegaMy Radio',
      artist: t.artist || 'BiegaMy',
      album: 'BiegaMy Radio',
      artwork: cover ? [{ src: cover, sizes: '512x512', type: 'image/webp' }] : []
    });
    const aud = document.getElementById('rad-audio');
    navigator.mediaSession.setActionHandler('play', function(){ aud.play().catch(function(){}); });
    navigator.mediaSession.setActionHandler('pause', function(){ aud.pause(); });
    navigator.mediaSession.setActionHandler('nexttrack', radioNext);
    navigator.mediaSession.setActionHandler('previoustrack', radioPrev);
    navigator.mediaSession.setActionHandler('seekto', function(d){
      if (d.fastSeek && 'fastSeek' in aud) { aud.fastSeek(d.seekTime); return; }
      aud.currentTime = d.seekTime;
    });
  } catch(e){}
}

function radioClosePlayer(){
  const vid = document.getElementById('rad-video'), aud = document.getElementById('rad-audio');
  try { vid.pause(); aud.pause(); } catch(e){}
  vid.removeAttribute('src'); aud.removeAttribute('src');
  document.getElementById('rad-player').style.display = 'none';
  _radioQueue = []; _radioIdx = -1;
  if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; } catch(e){} }
}

async function radioNewPlaylist(){
  const name = (prompt('Nazwa playlisty:') || '').trim();
  if (!name) return;
  const { error } = await sb.from('radio_playlists').insert({ owner_id: _radioUid, name: name });
  if (error) { alert('Błąd: ' + error.message); return; }
  loadPlaylists();
}

// Widok pojedynczej playlisty (zastępuje listę w #radio-playlists; powrót = loadPlaylists).
async function radioOpenPlaylist(playlistId){
  const { data: pl } = await sb.from('radio_playlists').select('*').eq('id', playlistId).maybeSingle();
  if (!pl) return;
  _radioCurrentPlaylist = { id: pl.id, name: pl.name };
  const { data: rows, error } = await sb.from('radio_playlist_tracks')
    .select('id, position, track:radio_tracks(*)')
    .eq('playlist_id', playlistId)
    .order('position', { ascending: true });
  const el = document.getElementById('radio-playlists');
  let html = '<button class="rad-newpl" style="border-style:solid;" onclick="loadPlaylists()">‹ Wróć do playlist</button>'
    + '<div style="font-family:Bebas Neue,sans-serif;font-size:22px;margin:2px 0 12px;">' + escapeHtml(pl.name) + '</div>';
  if (error) { el.innerHTML = html + '<div class="rad-empty">Błąd ładowania.</div>'; return; }
  const items = (rows || []).filter(function(r){ return r.track; });   // odfiltruj osierocone (track usunięty z katalogu)
  _radioPlaylistTracks = items.map(function(r){ return r.track; });
  _radioPlaylistRows = items;
  if (!items.length) { html += '<div class="rad-empty">Pusta playlista.<br>Dodaj kawałki z katalogu (➕).</div>'; }
  else {
    html += items.map(function(r, idx){
      const t = r.track;
      const up = idx > 0 ? '<button class="rad-nav-btn" onclick="radioMoveInPlaylist(' + idx + ',-1)" title="W górę">↑</button>' : '';
      const down = idx < items.length - 1 ? '<button class="rad-nav-btn" onclick="radioMoveInPlaylist(' + idx + ',1)" title="W dół">↓</button>' : '';
      return '<div class="rad-card"><div class="rad-cover">🎵</div>'
        + '<div class="rad-meta"><div class="rad-tt">' + escapeHtml(t.title || t.slug) + '</div>'
        + '<div class="rad-ar">' + (t.artist ? escapeHtml(t.artist) : '—') + '</div></div>'
        + up + down
        + '<button class="rad-nav-btn" onclick="radioPlayPlaylistAt(' + idx + ')" title="Odtwórz">▶</button>'
        + '<button class="rad-nav-btn" onclick="radioRemoveFromPlaylist(\'' + r.id + '\')" title="Usuń z playlisty">🗑</button>'
        + '</div>';
    }).join('');
  }
  el.innerHTML = html;
}

// Granie z playlisty: kolejka = ta playlista (next/prev w jej obrębie).
function radioPlayPlaylistAt(idx){
  if (!_radioPlaylistTracks.length) return;
  _radioQueue = _radioPlaylistTracks.slice();
  radioPlayAt(idx);
}

async function radioRemoveFromPlaylist(rowId){
  const { error } = await sb.from('radio_playlist_tracks').delete().eq('id', rowId);
  if (error) { alert('Błąd: ' + error.message); return; }
  if (_radioCurrentPlaylist) radioOpenPlaylist(_radioCurrentPlaylist.id);   // re-render
}

// Reorder: lokalny swap z sąsiadem + przeliczenie position=1..N (odporne na null/duplikaty pozycji).
async function radioMoveInPlaylist(idx, dir){
  const rows = _radioPlaylistRows;
  const j = idx + dir;
  if (!rows || j < 0 || j >= rows.length) return;
  const arr = rows.slice();
  const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
  const res = await Promise.all(arr.map(function(r, i){
    return sb.from('radio_playlist_tracks').update({ position: i + 1 }).eq('id', r.id);
  }));
  if (res.some(function(x){ return x.error; })) { alert('Błąd zmiany kolejności.'); }
  if (_radioCurrentPlaylist) radioOpenPlaylist(_radioCurrentPlaylist.id);   // re-render
}

// Dodawanie z katalogu: picker playlist usera → insert (position=max+1), graceful przy duplikacie.
async function radioAddToPlaylistPicker(trackId){
  const { data: pls } = await sb.from('radio_playlists').select('*').eq('owner_id', _radioUid).order('created_at', { ascending: true });
  if (!pls || !pls.length) { if (confirm('Nie masz playlist. Utworzyć nową?')) await radioNewPlaylist(); return; }
  const ov = document.createElement('div');
  ov.id = 'rad-pick-ov';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;';
  ov.onclick = function(e){ if (e.target === ov) ov.remove(); };
  ov.innerHTML = '<div style="background:var(--bg);border-top:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:70vh;overflow-y:auto;padding:18px;">'
    + '<div style="font-family:Bebas Neue,sans-serif;font-size:20px;margin-bottom:12px;">Dodaj do playlisty</div>'
    + pls.map(function(p){ return '<div class="rad-card" style="cursor:pointer;" onclick="radioAddTrackToPlaylist(\'' + p.id + '\',\'' + trackId + '\')"><div class="rad-cover">📂</div><div class="rad-meta"><div class="rad-tt">' + escapeHtml(p.name) + '</div></div></div>'; }).join('')
    + '</div>';
  document.body.appendChild(ov);
}

async function radioAddTrackToPlaylist(playlistId, trackId){
  const { data: ex } = await sb.from('radio_playlist_tracks').select('position').eq('playlist_id', playlistId).order('position', { ascending: false }).limit(1);
  const nextPos = (ex && ex.length ? (ex[0].position || 0) : 0) + 1;
  const { error } = await sb.from('radio_playlist_tracks').insert({ playlist_id: playlistId, track_id: trackId, position: nextPos });
  const ov = document.getElementById('rad-pick-ov'); if (ov) ov.remove();
  if (error) { alert(error.code === '23505' ? 'Ten kawałek już jest w tej playliście.' : 'Błąd: ' + error.message); return; }
  alert('Dodano do playlisty ✓');
}

radioInit();
</script>
