<style>
:root{
  --bg:#0c0c10; --card:#13131a; --card2:#1a1a22;
  --fg:#f0ede8; --muted:rgba(240,237,232,0.55); --border:rgba(255,255,255,0.08);
  --accent:#e8561e; --accent2:#FF6B2C; --green:#3db870;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
body{padding:0 0 200px;min-height:100vh;}
.rad-hdr{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border);}
.rad-hdr a{background:rgba(255,255,255,0.07);border:none;color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;}
.rad-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.04em;}
.rad-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:14px 16px;}
.rad-tab{flex:1;background:transparent;color:var(--muted);border:none;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:11px 4px;cursor:pointer;}
.rad-tab.on{background:rgba(var(--accent-rgb),0.12);color:var(--accent);}
.rad-tab + .rad-tab{border-left:1px solid var(--border);}
.rad-wrap{padding:0 16px;}
.rad-empty{text-align:center;color:var(--muted);font-size:13px;font-family:'Inter',sans-serif;padding:48px 20px;line-height:1.5;}
.rad-card{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:10px;}
.rad-cover{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:22px;}
.rad-meta{flex:1;min-width:0;}
.rad-tt{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rad-ar{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rad-play{background:rgba(255,255,255,0.08);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.rad-ic{width:20px;height:20px;display:block;pointer-events:none;}
.rad-play .rad-ic{width:22px;height:22px;}
.rad-like .rad-ic{width:18px;height:18px;opacity:0.4;transition:opacity 0.15s;}
.rad-like.on .rad-ic{opacity:1;}
.rad-ic-tab{width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:3px;}
.rad-ic-title{width:26px;height:26px;display:inline-block;vertical-align:-5px;margin-right:4px;}
.rad-like{background:rgba(255,255,255,0.06);border:none;color:var(--muted);border-radius:15px;height:30px;padding:0 9px;font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;gap:3px;font-family:'DM Mono',monospace;}
.rad-like.on{color:var(--accent);background:rgba(var(--accent-rgb),0.12);}
.rad-rank{width:24px;flex-shrink:0;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);}
.rad-open{display:flex;gap:12px;align-items:center;flex:1;min-width:0;cursor:pointer;}
.rad-newpl{display:block;width:100%;background:rgba(255,255,255,0.06);border:1px dashed rgba(var(--accent-rgb),0.45);color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:12px;}
/* Player bar */
#rad-player{position:fixed;left:0;right:0;bottom:0;background:rgba(16,14,22,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);display:none;z-index:60;}
#rad-video{width:100%;max-height:200px;border-radius:12px;background:#000;display:none;margin-bottom:8px;}
.rad-np{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
#rad-np-cover{width:40px;height:40px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,0.06);flex-shrink:0;}
#rad-np-ph{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,0.06);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
#rad-np-title{font-family:'Bebas Neue',sans-serif;font-size:17px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#rad-loop-btn{background:rgba(255,255,255,0.08);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;flex-shrink:0;opacity:0.4;position:relative;display:flex;align-items:center;justify-content:center;}
.rad-ic-cover{width:30px;height:30px;}
.rad-ic-inline{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:6px;}
#rad-loop-one{position:absolute;top:1px;right:3px;font-size:8px;font-weight:700;color:var(--accent);line-height:1;}
.rad-nav-btn{background:rgba(255,255,255,0.08);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;flex-shrink:0;}
#rad-audio{width:100%;}
</style>

<div class="rad-hdr">
  <a href="zawodnik.html" title="Wróć">‹</a>
  <div class="rad-title"><img class="rad-ic-title" data-ic="icon-radio-radio.webp" alt="">Radio BiegaMy</div>
</div>

<div class="rad-tabs">
  <button class="rad-tab on" id="rtab-katalog" onclick="radioTab('katalog')"><img class="rad-ic-tab" data-ic="icon-radio-note.webp" alt="">Katalog</button>
  <button class="rad-tab" id="rtab-przeboje" onclick="radioTab('przeboje')"><img class="rad-ic-tab" data-ic="icon-radio-trophy.webp" alt="">Przeboje</button>
  <button class="rad-tab" id="rtab-playlisty" onclick="radioTab('playlisty')"><img class="rad-ic-tab" data-ic="icon-radio-playlist.webp" alt="">Playlisty</button>
</div>

<div class="rad-wrap">
  <!-- Panel uploadu — TYLKO trener (odsłaniany w radioCheckCoach) -->
  <div id="rad-upload-panel" style="display:none;margin-bottom:12px;">
    <button class="rad-newpl" onclick="radioToggleUploadForm()"><img class="rad-ic-inline" data-ic="icon-radio-add.webp" alt="">Wgraj kawałek</button>
    <div id="rad-upload-form" style="display:none;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;">
      <input type="file" id="rad-up-file" accept="audio/mpeg,.mp3" onchange="radioUploadPick(this)" style="width:100%;font-size:12px;color:var(--muted);margin-bottom:8px;">
      <input type="text" id="rad-up-title" placeholder="Tytuł" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:9px 11px;font-size:14px;margin-bottom:8px;outline:none;">
      <input type="text" id="rad-up-artist" value="BiegaMy" placeholder="Artysta" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:9px 11px;font-size:14px;margin-bottom:8px;outline:none;">
      <div style="display:flex;align-items:center;gap:10px;">
        <button onclick="radioDoUpload()" style="background:var(--accent);border:none;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;">Wgraj</button>
        <div id="rad-up-status" style="font-size:11px;color:var(--muted);flex:1;min-width:0;"></div>
      </div>
    </div>
  </div>
  <div id="radio-catalog"><div class="rad-empty">Ładowanie…</div></div>
  <div id="radio-top" style="display:none;"></div>
  <div id="radio-playlists" style="display:none;"></div>
</div>

<!-- Player bar -->
<div id="rad-player">
  <video id="rad-video" controls playsinline preload="none"></video>
  <div class="rad-np">
    <img id="rad-np-cover" alt="" style="display:none;" onerror="this.style.display='none';var p=document.getElementById('rad-np-ph');if(p)p.style.display='flex';">
    <div id="rad-np-ph"><img class="rad-ic-cover" data-ic="icon-radio-note.webp" alt=""></div>
    <div id="rad-np-title" style="flex:1;min-width:0;">—</div>
    <button class="rad-nav-btn" onclick="radioPrev()" title="Poprzedni"><img class="rad-ic" data-ic="icon-radio-prev.webp" alt=""></button>
    <button class="rad-nav-btn" onclick="radioNext()" title="Następny"><img class="rad-ic" data-ic="icon-radio-next.webp" alt=""></button>
    <button id="rad-loop-btn" onclick="radioToggleLoop()" title="Powtarzanie"><img class="rad-ic" data-ic="icon-radio-loop.webp" alt=""><sup id="rad-loop-one" style="display:none;">1</sup></button>
    <button onclick="radioClosePlayer()" style="background:rgba(255,255,255,0.08);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0;">✕</button>
  </div>
  <audio id="rad-audio" controls preload="none"></audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<script>
let _radioUid = null;
let _radioTracks = [];
let _radioQueue = [];      // kontekst odtwarzania (kolejka track-obiektów)
let _radioIdx = -1;        // indeks aktualnego w _radioQueue
let _radioLoop = 'off';    // 'off' | 'all' | 'one'
let _radioCurrentPlaylist = null;  // {id,name} gdy otwarty widok playlisty (do re-renderu)
let _radioPlaylistTracks = [];     // kawałki otwartej playlisty (źródło kolejki)
let _radioLikedSet = new Set();    // track_id polubione przez usera
let _radioTopTracks = [];          // kawałki zakładki Przeboje (źródło kolejki)
let _radioPlayTimer = null;        // timer 5s do zliczenia odtworzenia
let _radioIsCoach = false;         // trener? (moderacja: usuwa każdy komentarz)
let _radioPlaylistRows = [];       // wiersze radio_playlist_tracks (id+position) — do reorderu

async function radioInit(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { setTimeout(async () => {
    const { data: { session: s2 } } = await sb.auth.getSession();
    if (!s2) { window.location.href = 'index.html'; return; }
    _radioUid = s2.user.id; radioLoad();
  }, 1000); return; }
  _radioUid = session.user.id;
  radioLoad();
}

// 'ended' raz: loop 'one' → powtórz ten sam, inaczej następny (radioNext respektuje loop 'all').
// play/pause: synchronizuj mediaSession.playbackState — Android Chrome utrzymuje audio
// w tle TYLKO przy żywej sesji ('playing'); bez tego pauzuje przy zgaszonym ekranie.
(function(){
  // ikony statyczne (header/tab) — src przez assetUrl (single-source)
  document.querySelectorAll('img[data-ic]').forEach(function(el){ if (window.assetUrl) el.src = window.assetUrl(el.getAttribute('data-ic')); });
  const aud = document.getElementById('rad-audio');
  if (!aud) return;
  aud.addEventListener('ended', function(){
    if (_radioLoop === 'one') { radioPlayAt(_radioIdx); return; }
    radioNext();
  });
  aud.addEventListener('play', function(){
    if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = 'playing'; } catch(e){} }
  });
  aud.addEventListener('pause', function(){
    if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = 'paused'; } catch(e){} }
  });
})();

async function radioLoad(){
  await Promise.all([loadLikes(), radioCheckCoach()]);
  await Promise.all([loadCatalog(), loadPlaylists()]);
}

async function loadLikes(){
  _radioLikedSet = new Set();
  const { data } = await sb.from('radio_likes').select('track_id').eq('user_id', _radioUid);
  (data || []).forEach(function(r){ _radioLikedSet.add(r.track_id); });
}

async function radioCheckCoach(){
  const { data } = await sb.from('coaches').select('id').eq('id', _radioUid).maybeSingle();
  _radioIsCoach = !!data;
  if (_radioIsCoach){ const p = document.getElementById('rad-upload-panel'); if (p) p.style.display = 'block'; }
}

// ── UPLOAD KAWAŁKA (panel trenera) ─────────────────────────────────
function radioToggleUploadForm(){
  const el = document.getElementById('rad-upload-form');
  if (el) el.style.display = (el.style.display === 'none') ? 'block' : 'none';
}

function radioUploadPick(input){
  const f = input.files && input.files[0]; if (!f) return;
  const ti = document.getElementById('rad-up-title');
  if (ti && !ti.value) ti.value = f.name.replace(/\.mp3$/i, '');
}

async function radioIsMp3(file){
  const b = new Uint8Array(await file.slice(0, 4).arrayBuffer());
  const id3 = (b[0] === 0x49 && b[1] === 0x44 && b[2] === 0x33);            // "ID3"
  const mpeg = (b[0] === 0xFF && (b[1] & 0xE0) === 0xE0);                   // ramka MPEG
  return id3 || mpeg;
}

function radioSlugify(name){
  return name.replace(/\.mp3$/i, '')
    .replace(/[łŁ]/g, 'l')                               // ł nie rozkłada się przez NFD
    .normalize('NFD').replace(/[̀-ͯ]/g, '')   // ą ę ó ś ż ź ć ń → ascii
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').replace(/-{2,}/g, '-');
}

async function radioExtractApic(file){
  const buf = new Uint8Array(await file.slice(0, 524288).arrayBuffer());
  let apic = -1;
  for (let i = 0; i < buf.length - 4; i++){ if (buf[i]===0x41 && buf[i+1]===0x50 && buf[i+2]===0x49 && buf[i+3]===0x43){ apic = i; break; } }
  if (apic < 0) return null;
  let j = -1;
  for (let i = apic; i < buf.length - 2; i++){ if (buf[i]===0xFF && buf[i+1]===0xD8 && buf[i+2]===0xFF){ j = i; break; } }
  if (j < 0) return null;
  let e = -1;
  for (let i = j + 2; i < buf.length - 1; i++){ if (buf[i]===0xFF && buf[i+1]===0xD9){ e = i + 2; break; } }
  if (e < 0) return null;
  return new Blob([buf.slice(j, e)], { type: 'image/jpeg' });
}

function radioJpegToWebp(jpegBlob){
  return new Promise(function(resolve){
    const img = new Image(); const url = URL.createObjectURL(jpegBlob);
    img.onload = function(){
      try {
        const c = document.createElement('canvas'); c.width = img.naturalWidth || 360; c.height = img.naturalHeight || 360;
        c.getContext('2d').drawImage(img, 0, 0);
        c.toBlob(function(b){ URL.revokeObjectURL(url); resolve(b); }, 'image/webp', 0.8);
      } catch(e){ URL.revokeObjectURL(url); resolve(null); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

function radioAudioDuration(file){
  return new Promise(function(resolve){
    const a = document.createElement('audio'); const url = URL.createObjectURL(file);
    a.preload = 'metadata';
    a.onloadedmetadata = function(){ const d = a.duration; URL.revokeObjectURL(url); resolve(isFinite(d) ? Math.round(d) : null); };
    a.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
    a.src = url;
  });
}

async function radioDoUpload(){
  const fi = document.getElementById('rad-up-file');
  const f = fi && fi.files && fi.files[0];
  if (!f) { alert('Wybierz plik MP3.'); return; }
  if (!(await radioIsMp3(f))) { alert('Tylko pliki MP3 (audio).'); return; }
  if (f.size > 20 * 1024 * 1024) { alert('Plik za duży (max 20 MB).'); return; }
  const slug = radioSlugify(f.name);
  if (!slug) { alert('Nie udało się utworzyć nazwy z pliku.'); return; }
  const title = (document.getElementById('rad-up-title').value || '').trim() || f.name.replace(/\.mp3$/i, '');
  const artist = (document.getElementById('rad-up-artist').value || '').trim() || 'BiegaMy';
  const st = document.getElementById('rad-up-status');

  const { data: ex } = await sb.from('radio_tracks').select('id').eq('slug', slug).maybeSingle();
  if (ex) { alert('Kawałek "' + slug + '" już istnieje — zmień nazwę pliku.'); return; }

  st.textContent = 'Wgrywanie pliku…';
  const up = await window.storageUploadRetry('radio-audio', slug + '.mp3', f, { contentType: 'audio/mpeg', upsert: false });
  if (up && up.error) { st.textContent = ''; alert('Błąd wgrywania: ' + up.error.message); return; }

  // okładka z APIC (best-effort)
  let cover_slug = null;
  try {
    const jpeg = await radioExtractApic(f);
    if (jpeg) {
      let blob = await radioJpegToWebp(jpeg), ctype = 'image/webp';
      if (!blob || blob.type !== 'image/webp') { blob = jpeg; ctype = 'image/jpeg'; }   // fallback
      const cu = await window.storageUploadRetry('radio-audio', 'cover-' + slug + '.webp', blob, { contentType: ctype, upsert: true });
      if (!(cu && cu.error)) cover_slug = 'cover-' + slug;
    }
  } catch(e){}

  let duration_sec = null;
  try { duration_sec = await radioAudioDuration(f); } catch(e){}

  st.textContent = 'Zapisywanie…';
  const { error } = await sb.from('radio_tracks').insert({
    slug: slug, title: title, artist: artist, media_ext: 'mp3', is_video: false,
    duration_sec: duration_sec, cover_slug: cover_slug, coach_id: _radioUid
  });
  if (error) {
    sb.storage.from('radio-audio').remove([slug + '.mp3', 'cover-' + slug + '.webp']).catch(function(){});
    st.textContent = ''; alert('Błąd zapisu: ' + error.message); return;
  }
  st.textContent = 'Dodano ✓';
  fi.value = ''; document.getElementById('rad-up-title').value = '';
  loadCatalog();
}

function radioFmtDur(sec){
  sec = parseInt(sec, 10) || 0;
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// Wspólny budowniczy karty kawałka (katalog + przeboje). playOnclick = treść onclick przycisku ▶.
function radioCardHtml(t, playOnclick, rank){
  const cover = window.safeUrlAttr ? window.safeUrlAttr(window.RADIO.coverUrl(t)) : '';
  const coverHtml = cover
    ? '<img class="rad-cover" src="' + cover + '" alt="" onerror="this.outerHTML=\'<div class=&quot;rad-cover&quot;>🎵</div>\'">'
    : '<div class="rad-cover"><img class="rad-ic-cover" src="' + window.assetUrl('icon-radio-note.webp') + '"></div>';
  const dur = t.duration_sec ? (' · ' + radioFmtDur(t.duration_sec)) : '';
  const liked = _radioLikedSet.has(t.id);
  const rankHtml = rank ? ('<div class="rad-rank">' + rank + '</div>') : '';
  return '<div class="rad-card">' + rankHtml
    + '<div class="rad-open" onclick="radioOpenTrack(\'' + t.id + '\')">' + coverHtml
    + '<div class="rad-meta"><div class="rad-tt">' + escapeHtml(t.title || t.slug) + '</div>'
    + '<div class="rad-ar">' + (t.artist ? escapeHtml(t.artist) : '—') + dur + ' · ▶ ' + (t.play_count || 0) + ' · 💬 ' + (t.comment_count || 0) + '</div></div></div>'
    + '<button class="rad-like' + (liked ? ' on' : '') + '" onclick="radioToggleLike(\'' + t.id + '\',this)" title="Polub"><img class="rad-ic" src="' + window.assetUrl('icon-radio-like.webp') + '"> <span>' + (t.like_count || 0) + '</span></button>'
    + '<button class="rad-nav-btn" onclick="radioAddToPlaylistPicker(\'' + t.id + '\')" title="Dodaj do playlisty"><img class="rad-ic" src="' + window.assetUrl('icon-radio-add.webp') + '"></button>'
    + '<button class="rad-play" onclick="' + playOnclick + '"><img class="rad-ic" src="' + window.assetUrl('icon-radio-play.webp') + '"></button></div>';
}

async function radioToggleLike(trackId, btn){
  const liked = _radioLikedSet.has(trackId);
  if (liked){
    const { error } = await sb.from('radio_likes').delete().eq('track_id', trackId).eq('user_id', _radioUid);
    if (error){ alert('Błąd: ' + error.message); return; }
    _radioLikedSet.delete(trackId);
  } else {
    const { error } = await sb.from('radio_likes').insert({ track_id: trackId, user_id: _radioUid });
    if (error && error.code !== '23505'){ alert('Błąd: ' + error.message); return; }
    _radioLikedSet.add(trackId);
  }
  const nowLiked = _radioLikedSet.has(trackId);
  const span = btn.querySelector('span');
  let n = span ? (parseInt(span.textContent, 10) || 0) : 0;
  n += nowLiked ? 1 : -1; if (n < 0) n = 0;
  if (span) span.textContent = n;
  btn.classList.toggle('on', nowLiked);
}

async function loadTop(){
  const el = document.getElementById('radio-top');
  if (!window.RADIO){ el.innerHTML = '<div class="rad-empty">Odśwież aplikację.</div>'; return; }
  const { data, error } = await sb.from('radio_top').select('*')
    .order('play_count', { ascending: false })
    .order('like_count', { ascending: false })
    .order('title', { ascending: true });
  if (error){ el.innerHTML = '<div class="rad-empty">Błąd ładowania.</div>'; return; }
  _radioTopTracks = data || [];
  if (!_radioTopTracks.length){ el.innerHTML = '<div class="rad-empty">Brak danych.</div>'; return; }
  el.innerHTML = _radioTopTracks.map(function(t, idx){
    return radioCardHtml(t, 'radioPlayTopAt(' + idx + ')', idx + 1);
  }).join('');
}

function radioPlayTopAt(idx){
  if (!_radioTopTracks.length) return;
  _radioQueue = _radioTopTracks.slice();
  radioPlayAt(idx);
}

// ── WIDOK SZCZEGÓŁÓW KAWAŁKA + KOMENTARZE ──────────────────────────
async function radioOpenTrack(trackId){
  let t = _radioTracks.find(function(x){ return x.id === trackId; })
       || _radioTopTracks.find(function(x){ return x.id === trackId; });
  if (!t){ const { data } = await sb.from('radio_top').select('*').eq('id', trackId).maybeSingle(); t = data; }
  if (!t) return;
  const cover = window.safeUrlAttr ? window.safeUrlAttr(window.RADIO.coverUrl(t)) : '';
  const liked = _radioLikedSet.has(t.id);
  const coverBig = cover
    ? '<img src="' + cover + '" alt="" style="width:100%;max-width:300px;aspect-ratio:1;border-radius:18px;object-fit:cover;display:block;margin:8px auto;" onerror="this.style.display=\'none\'">'
    : '<div style="width:300px;max-width:80%;aspect-ratio:1;border-radius:18px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:64px;margin:8px auto;"><img src="' + window.assetUrl('icon-radio-note.webp') + '" style="width:96px;height:96px;"></div>';
  const ov = document.createElement('div');
  ov.id = 'rad-track-ov';
  ov.style.cssText = 'position:fixed;inset:0;z-index:150;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;';
  ov.innerHTML =
    '<div style="padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 120px);max-width:560px;margin:0 auto;">'
    + '<button onclick="radioCloseTrack()" style="background:rgba(255,255,255,0.07);border:none;color:var(--fg);border-radius:10px;padding:8px 14px;font-family:DM Mono,monospace;font-size:12px;cursor:pointer;">‹ Wróć</button>'
    + coverBig
    + '<div style="font-family:Bebas Neue,sans-serif;font-size:28px;text-align:center;letter-spacing:0.02em;">' + escapeHtml(t.title || t.slug) + '</div>'
    + '<div style="text-align:center;color:var(--muted);font-size:12px;font-family:DM Mono,monospace;margin-top:2px;">' + (t.artist ? escapeHtml(t.artist) : '—') + ' · ' + radioFmtDur(t.duration_sec) + ' · ▶ ' + (t.play_count || 0) + '</div>'
    + '<div style="display:flex;justify-content:center;gap:12px;margin:14px 0 4px;">'
      + '<button class="rad-play" onclick="radioPlay(\'' + t.id + '\')" title="Odtwórz"><img class="rad-ic" src="' + window.assetUrl('icon-radio-play.webp') + '"></button>'
      + '<button class="rad-like' + (liked ? ' on' : '') + '" onclick="radioToggleLike(\'' + t.id + '\',this)" title="Polub"><img class="rad-ic" src="' + window.assetUrl('icon-radio-like.webp') + '"> <span>' + (t.like_count || 0) + '</span></button>'
      + '<button class="rad-nav-btn" onclick="radioAddToPlaylistPicker(\'' + t.id + '\')" title="Dodaj do playlisty"><img class="rad-ic" src="' + window.assetUrl('icon-radio-add.webp') + '"></button>'
    + '</div>'
    + (_radioIsCoach ? '<div style="text-align:center;margin:12px 0 0;"><button onclick="radioDeleteTrack(\'' + t.id + '\')" style="background:rgba(224,80,80,0.12);border:1px solid rgba(224,80,80,0.4);color:#e05050;border-radius:10px;padding:8px 16px;font-size:12px;font-family:DM Mono,monospace;cursor:pointer;"><img class="rad-ic-inline" src="' + window.assetUrl('icon-radio-trash.webp') + '">Usuń kawałek</button></div>' : '')
    + '<div style="font-family:Bebas Neue,sans-serif;font-size:18px;margin:20px 0 4px;">Komentarze</div>'
    + '<div id="rad-comments-list"><div class="rad-empty">Ładowanie…</div></div>'
    + '<div style="display:flex;gap:8px;margin-top:10px;align-items:flex-end;">'
      + '<textarea id="rad-comment-input" maxlength="500" rows="2" placeholder="Dodaj komentarz…" style="flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:9px 12px;font-size:14px;font-family:DM Sans,sans-serif;resize:vertical;outline:none;"></textarea>'
      + '<button class="rad-play" onclick="radioAddComment(\'' + t.id + '\')" title="Wyślij">➤</button>'
    + '</div>'
    + '</div>';
  document.body.appendChild(ov);
  loadTrackComments(t.id);
}

function radioCloseTrack(){
  const o = document.getElementById('rad-track-ov');
  if (o) o.remove();
}

// Usuwanie kawałka (tylko trener). DB DELETE (RLS coach) → CASCADE czyści łapki/komentarze/playlisty.
async function radioDeleteTrack(trackId){
  const t = _radioTracks.find(function(x){ return x.id === trackId; })
         || _radioTopTracks.find(function(x){ return x.id === trackId; });
  if (!t) return;
  if (!confirm('Usunąć „' + (t.title || t.slug) + '" na zawsze?\nZniknie z katalogu, playlist, łapek i komentarzy.')) return;
  const { error } = await sb.from('radio_tracks').delete().eq('id', trackId);
  if (error) { alert('Błąd usuwania: ' + error.message); return; }
  // pliki best-effort (osierocone w buckecie są nieszkodliwe)
  const files = [t.slug + '.' + (t.media_ext || 'mp3')];
  if (t.cover_slug) files.push(t.cover_slug + '.webp');
  sb.storage.from('radio-audio').remove(files).catch(function(){});
  radioCloseTrack();
  loadCatalog();
  const top = document.getElementById('radio-top');
  if (top && top.style.display !== 'none') loadTop();
}

async function loadTrackComments(trackId){
  const el = document.getElementById('rad-comments-list');
  if (!el) return;
  const { data, error } = await sb.from('radio_comments_view').select('*').eq('track_id', trackId).order('created_at', { ascending: true });
  if (error){ el.innerHTML = '<div class="rad-empty">Błąd ładowania komentarzy.</div>'; return; }
  const rows = data || [];
  if (!rows.length){ el.innerHTML = '<div class="rad-empty" style="padding:18px;">Brak komentarzy. Bądź pierwszy!</div>'; return; }
  el.innerHTML = rows.map(function(c){
    const canDel = (c.user_id === _radioUid) || _radioIsCoach;
    const av = (c.author_avatar && window.safeUrlAttr) ? window.safeUrlAttr(c.author_avatar) : '';
    const avatar = av
      ? '<img src="' + av + '" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;" onerror="this.style.visibility=\'hidden\'">'
      : '<div style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;">' + escapeHtml((c.author_name || '?').slice(0,1).toUpperCase()) + '</div>';
    const coachTag = c.author_is_coach ? ' <span style="color:var(--accent);font-size:9px;font-family:DM Mono,monospace;">TRENER</span>' : '';
    const del = canDel ? '<button onclick="radioDeleteComment(\'' + c.id + '\',\'' + trackId + '\')" title="Usuń" style="background:none;border:none;color:var(--muted);cursor:pointer;flex-shrink:0;font-size:14px;"><img src="' + window.assetUrl('icon-radio-trash.webp') + '" style="width:16px;height:16px;"></button>' : '';
    return '<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">'
      + avatar
      + '<div style="flex:1;min-width:0;"><div style="font-size:12px;font-weight:600;">' + escapeHtml(c.author_name) + coachTag + '</div>'
      + '<div style="font-size:13px;color:var(--fg);white-space:pre-wrap;word-break:break-word;line-height:1.4;">' + escapeHtml(c.body) + '</div></div>'
      + del + '</div>';
  }).join('');
}

async function radioAddComment(trackId){
  const inp = document.getElementById('rad-comment-input');
  if (!inp) return;
  const body = (inp.value || '').trim();
  if (!body) return;
  if (body.length > 500){ alert('Komentarz za długi (max 500 znaków).'); return; }
  const { error } = await sb.from('radio_comments').insert({ track_id: trackId, user_id: _radioUid, body: body });
  if (error){ alert('Błąd: ' + error.message); return; }
  inp.value = '';
  loadTrackComments(trackId);
  radioBumpCommentCount(trackId, 1);
}

async function radioDeleteComment(commentId, trackId){
  if (!confirm('Usunąć komentarz?')) return;
  const { error } = await sb.from('radio_comments').delete().eq('id', commentId);
  if (error){ alert('Błąd: ' + error.message); return; }
  loadTrackComments(trackId);
  radioBumpCommentCount(trackId, -1);
}

// Podbij cache comment_count (karta pokaże aktualną liczbę przy następnym renderze).
function radioBumpCommentCount(trackId, delta){
  [_radioTracks, _radioTopTracks].forEach(function(arr){
    const t = arr.find(function(x){ return x.id === trackId; });
    if (t){ t.comment_count = Math.max(0, (t.comment_count || 0) + delta); }
  });
}

async function loadCatalog(){
  const el = document.getElementById('radio-catalog');
  if (!window.RADIO) { el.innerHTML = '<div class="rad-empty">Moduł radia nie załadował się 🔄<br>Odśwież aplikację (zamknij i otwórz / przeciągnij w dół).</div>'; return; }
  const { data, error } = await sb.from('radio_top').select('*').order('created_at', { ascending: true });
  if (error) { el.innerHTML = '<div class="rad-empty">Błąd ładowania katalogu.</div>'; return; }
  _radioTracks = data || [];
  if (!_radioTracks.length) { el.innerHTML = '<div class="rad-empty">Biblioteka jest pusta 🎵<br>Trener jeszcze nie wgrał żadnych utworów.</div>'; return; }
  el.innerHTML = _radioTracks.map(function(t){
    return radioCardHtml(t, "radioPlay('" + t.id + "')");
  }).join('');
}

async function loadPlaylists(){
  const el = document.getElementById('radio-playlists');
  const { data, error } = await sb.from('radio_playlists').select('*').eq('owner_id', _radioUid).order('created_at', { ascending: true });
  let html = '<button class="rad-newpl" onclick="radioNewPlaylist()"><img class="rad-ic-inline" src="' + window.assetUrl('icon-radio-add.webp') + '">Nowa playlista</button>';
  if (error) { el.innerHTML = html + '<div class="rad-empty">Błąd ładowania playlist.</div>'; return; }
  const pls = data || [];
  if (!pls.length) { html += '<div class="rad-empty">Nie masz jeszcze playlist.<br>Stwórz pierwszą i dodawaj utwory z katalogu.</div>'; }
  else {
    html += pls.map(function(p){
      return '<div class="rad-card" onclick="radioOpenPlaylist(\'' + p.id + '\')" style="cursor:pointer;">'
        + '<div class="rad-cover"><img class="rad-ic-cover" src="' + window.assetUrl('icon-radio-playlist.webp') + '"></div>'
        + '<div class="rad-meta"><div class="rad-tt">' + escapeHtml(p.name) + '</div><div class="rad-ar">playlista</div></div>'
        + '<span style="color:var(--muted);font-size:18px;flex-shrink:0;">›</span></div>';
    }).join('');
  }
  el.innerHTML = html;
}

function radioTab(name){
  const panels = { katalog: 'radio-catalog', przeboje: 'radio-top', playlisty: 'radio-playlists' };
  Object.keys(panels).forEach(function(t){
    const btn = document.getElementById('rtab-' + t);
    if (btn) btn.classList.toggle('on', t === name);
    const panel = document.getElementById(panels[t]);
    if (panel) panel.style.display = (t === name) ? 'block' : 'none';
  });
  if (name === 'przeboje') loadTop();   // odśwież ranking przy wejściu
}

// Klik w katalogu: kolejka = cały katalog, start od klikniętego.
function radioPlay(trackId){
  const i = _radioTracks.findIndex(function(x){ return x.id === trackId; });
  if (i < 0) return;
  _radioQueue = _radioTracks.slice();
  radioPlayAt(i);
}

// Rdzeń D1: dźwięk ZAWSZE przez <audio src=mp4> (ścieżka audio z mp4) — NIE <video>.
// To zapewnia granie przy zgaszonym ekranie / w tle na iOS. Wideo całkowicie schowane.
function radioPlayAt(i){
  if (!window.RADIO) { alert('Odśwież aplikację — moduł radia nie załadował się.'); return; }
  if (i < 0 || i >= _radioQueue.length) return;
  const t = _radioQueue[i];
  if (!t) return;
  const url = window.safeUrlAttr ? window.safeUrlAttr(window.RADIO.mediaUrl(t)) : '';
  if (!url) return;
  _radioIdx = i;

  const player = document.getElementById('rad-player');
  const vid = document.getElementById('rad-video');
  const aud = document.getElementById('rad-audio');
  const cover = window.safeUrlAttr ? window.safeUrlAttr(window.RADIO.coverUrl(t)) : '';

  document.getElementById('rad-np-title').textContent = (t.title || t.slug) + (t.artist ? ' · ' + t.artist : '');
  // Cover: pokaż gdy jest, placeholder gdy null (struktura gotowa na cover_slug dograny później).
  const npCover = document.getElementById('rad-np-cover');
  const npPh = document.getElementById('rad-np-ph');
  if (cover) { npCover.src = cover; npCover.style.display = ''; if (npPh) npPh.style.display = 'none'; }
  else { npCover.removeAttribute('src'); npCover.style.display = 'none'; if (npPh) npPh.style.display = 'flex'; }

  // D1: wideo nieużywane jako źródło dźwięku — zatrzymaj i schowaj całkowicie.
  try { vid.pause(); } catch(e){}
  vid.removeAttribute('src'); vid.style.display = 'none';

  aud.src = url;                 // <-- mp4; <audio> gra ścieżkę dźwiękową (klucz iOS)
  aud.style.display = 'block';
  player.style.display = 'block';
  aud.play().catch(function(){});

  // Zlicz odtworzenie po 5s ciągłego grania (Filip: próg 5s). Globalny licznik (bez per-user dedupe).
  if (_radioPlayTimer) clearTimeout(_radioPlayTimer);
  _radioPlayTimer = setTimeout(function(){
    if (aud.paused) return;
    sb.rpc('increment_play', { p_track_id: t.id }).then(function(res){
      if (res && res.error) {
        console.warn('[radio] increment_play błąd:', res.error.code, res.error.message);
        if (!window._radioPlayErrShown) { window._radioPlayErrShown = true; alert('Licznik odtworzeń — błąd: ' + res.error.message); }
        return;
      }
      t.play_count = (t.play_count || 0) + 1;   // bump cache dopiero po sukcesie
    });
  }, 5000);

  radioUpdateMediaSession(t, cover);
}

function radioNext(){
  if (!_radioQueue.length) return;
  if (_radioIdx + 1 < _radioQueue.length) radioPlayAt(_radioIdx + 1);
  else if (_radioLoop === 'all') radioPlayAt(0);   // zawijanie na koniec kolejki
}

function radioPrev(){
  if (!_radioQueue.length) return;
  const aud = document.getElementById('rad-audio');
  if (aud.currentTime > 3) { aud.currentTime = 0; return; }  // >3s → restart bieżącego
  if (_radioIdx - 1 >= 0) radioPlayAt(_radioIdx - 1);
  else if (_radioLoop === 'all') radioPlayAt(_radioQueue.length - 1);
}

function radioToggleLoop(){
  _radioLoop = _radioLoop === 'off' ? 'all' : _radioLoop === 'all' ? 'one' : 'off';
  const b = document.getElementById('rad-loop-btn');
  if (!b) return;
  const _lo = document.getElementById('rad-loop-one'); if (_lo) _lo.style.display = (_radioLoop === 'one') ? 'inline' : 'none';
  b.style.opacity = _radioLoop === 'off' ? '0.4' : '1';
  b.title = _radioLoop === 'off' ? 'Powtarzanie: wył.' : _radioLoop === 'all' ? 'Powtarzaj kolejkę' : 'Powtarzaj utwór';
}

function radioUpdateMediaSession(t, cover){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title || t.slug || 'BiegaMy Radio',
      artist: t.artist || 'BiegaMy',
      album: 'BiegaMy Radio',
      artwork: cover ? [{ src: cover, sizes: '512x512', type: 'image/webp' }] : []
    });
    const aud = document.getElementById('rad-audio');
    navigator.mediaSession.setActionHandler('play', function(){ aud.play().catch(function(){}); });
    navigator.mediaSession.setActionHandler('pause', function(){ aud.pause(); });
    navigator.mediaSession.setActionHandler('nexttrack', radioNext);
    navigator.mediaSession.setActionHandler('previoustrack', radioPrev);
    navigator.mediaSession.setActionHandler('seekto', function(d){
      if (d.fastSeek && 'fastSeek' in aud) { aud.fastSeek(d.seekTime); return; }
      aud.currentTime = d.seekTime;
    });
  } catch(e){}
}

function radioClosePlayer(){
  const vid = document.getElementById('rad-video'), aud = document.getElementById('rad-audio');
  try { vid.pause(); aud.pause(); } catch(e){}
  vid.removeAttribute('src'); aud.removeAttribute('src');
  document.getElementById('rad-player').style.display = 'none';
  _radioQueue = []; _radioIdx = -1;
  if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; } catch(e){} }
}

async function radioNewPlaylist(){
  const name = (prompt('Nazwa playlisty:') || '').trim();
  if (!name) return;
  const { error } = await sb.from('radio_playlists').insert({ owner_id: _radioUid, name: name });
  if (error) { alert('Błąd: ' + error.message); return; }
  loadPlaylists();
}

// Widok pojedynczej playlisty (zastępuje listę w #radio-playlists; powrót = loadPlaylists).
async function radioOpenPlaylist(playlistId){
  const { data: pl } = await sb.from('radio_playlists').select('*').eq('id', playlistId).maybeSingle();
  if (!pl) return;
  _radioCurrentPlaylist = { id: pl.id, name: pl.name };
  const { data: rows, error } = await sb.from('radio_playlist_tracks')
    .select('id, position, track:radio_tracks(*)')
    .eq('playlist_id', playlistId)
    .order('position', { ascending: true });
  const el = document.getElementById('radio-playlists');
  let html = '<button class="rad-newpl" style="border-style:solid;" onclick="loadPlaylists()">‹ Wróć do playlist</button>'
    + '<div style="font-family:Bebas Neue,sans-serif;font-size:22px;margin:2px 0 12px;">' + escapeHtml(pl.name) + '</div>';
  if (error) { el.innerHTML = html + '<div class="rad-empty">Błąd ładowania.</div>'; return; }
  const items = (rows || []).filter(function(r){ return r.track; });   // odfiltruj osierocone (track usunięty z katalogu)
  _radioPlaylistTracks = items.map(function(r){ return r.track; });
  _radioPlaylistRows = items;
  if (!items.length) { html += '<div class="rad-empty">Pusta playlista.<br>Dodaj kawałki z katalogu (➕).</div>'; }
  else {
    html += items.map(function(r, idx){
      const t = r.track;
      const up = idx > 0 ? '<button class="rad-nav-btn" onclick="radioMoveInPlaylist(' + idx + ',-1)" title="W górę">↑</button>' : '';
      const down = idx < items.length - 1 ? '<button class="rad-nav-btn" onclick="radioMoveInPlaylist(' + idx + ',1)" title="W dół">↓</button>' : '';
      return '<div class="rad-card"><div class="rad-cover"><img class="rad-ic-cover" src="' + window.assetUrl('icon-radio-note.webp') + '"></div>'
        + '<div class="rad-meta"><div class="rad-tt">' + escapeHtml(t.title || t.slug) + '</div>'
        + '<div class="rad-ar">' + (t.artist ? escapeHtml(t.artist) : '—') + '</div></div>'
        + up + down
        + '<button class="rad-nav-btn" onclick="radioPlayPlaylistAt(' + idx + ')" title="Odtwórz"><img class="rad-ic" src="' + window.assetUrl('icon-radio-play.webp') + '"></button>'
        + '<button class="rad-nav-btn" onclick="radioRemoveFromPlaylist(\'' + r.id + '\')" title="Usuń z playlisty"><img class="rad-ic" src="' + window.assetUrl('icon-radio-trash.webp') + '"></button>'
        + '</div>';
    }).join('');
  }
  el.innerHTML = html;
}

// Granie z playlisty: kolejka = ta playlista (next/prev w jej obrębie).
function radioPlayPlaylistAt(idx){
  if (!_radioPlaylistTracks.length) return;
  _radioQueue = _radioPlaylistTracks.slice();
  radioPlayAt(idx);
}

async function radioRemoveFromPlaylist(rowId){
  const { error } = await sb.from('radio_playlist_tracks').delete().eq('id', rowId);
  if (error) { alert('Błąd: ' + error.message); return; }
  if (_radioCurrentPlaylist) radioOpenPlaylist(_radioCurrentPlaylist.id);   // re-render
}

// Reorder: lokalny swap z sąsiadem + przeliczenie position=1..N (odporne na null/duplikaty pozycji).
async function radioMoveInPlaylist(idx, dir){
  const rows = _radioPlaylistRows;
  const j = idx + dir;
  if (!rows || j < 0 || j >= rows.length) return;
  const arr = rows.slice();
  const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
  const res = await Promise.all(arr.map(function(r, i){
    return sb.from('radio_playlist_tracks').update({ position: i + 1 }).eq('id', r.id);
  }));
  if (res.some(function(x){ return x.error; })) { alert('Błąd zmiany kolejności.'); }
  if (_radioCurrentPlaylist) radioOpenPlaylist(_radioCurrentPlaylist.id);   // re-render
}

// Dodawanie z katalogu: picker playlist usera → insert (position=max+1), graceful przy duplikacie.
async function radioAddToPlaylistPicker(trackId){
  const { data: pls } = await sb.from('radio_playlists').select('*').eq('owner_id', _radioUid).order('created_at', { ascending: true });
  if (!pls || !pls.length) { if (confirm('Nie masz playlist. Utworzyć nową?')) await radioNewPlaylist(); return; }
  const ov = document.createElement('div');
  ov.id = 'rad-pick-ov';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;';
  ov.onclick = function(e){ if (e.target === ov) ov.remove(); };
  ov.innerHTML = '<div style="background:var(--bg);border-top:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:70vh;overflow-y:auto;padding:18px;">'
    + '<div style="font-family:Bebas Neue,sans-serif;font-size:20px;margin-bottom:12px;">Dodaj do playlisty</div>'
    + pls.map(function(p){ return '<div class="rad-card" style="cursor:pointer;" onclick="radioAddTrackToPlaylist(\'' + p.id + '\',\'' + trackId + '\')"><div class="rad-cover"><img class="rad-ic-cover" src="' + window.assetUrl('icon-radio-playlist.webp') + '"></div><div class="rad-meta"><div class="rad-tt">' + escapeHtml(p.name) + '</div></div></div>'; }).join('')
    + '</div>';
  document.body.appendChild(ov);
}

async function radioAddTrackToPlaylist(playlistId, trackId){
  const { data: ex } = await sb.from('radio_playlist_tracks').select('position').eq('playlist_id', playlistId).order('position', { ascending: false }).limit(1);
  const nextPos = (ex && ex.length ? (ex[0].position || 0) : 0) + 1;
  const { error } = await sb.from('radio_playlist_tracks').insert({ playlist_id: playlistId, track_id: trackId, position: nextPos });
  const ov = document.getElementById('rad-pick-ov'); if (ov) ov.remove();
  if (error) { alert(error.code === '23505' ? 'Ten kawałek już jest w tej playliście.' : 'Błąd: ' + error.message); return; }
  alert('Dodano do playlisty ✓');
}

radioInit();
</script>
