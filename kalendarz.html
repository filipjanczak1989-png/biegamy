<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiegaMy — Kalendarz</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --surface: #16161a;
  --surface2: #1e1e24;
  --border: #2a2a32;
  --accent: #d4501a;
  --accent2: #f06030;
  --fg: #f0ede8;
  --muted: #66636e;
  --muted2: #44424a;
  --green: #3db870;
  --yellow: #e8b840;
  --red: #e05050;
  --blue: #5090e0;
  --purple: #9a6fe8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'DM Mono',monospace;}body{padding-bottom:72px;}

/* SHELL */
.shell{display:flex;flex-direction:column;min-height:100vh;}

/* NAV */
nav{
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  flex-shrink:0;
}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.05em;text-decoration:none;color:var(--fg);}
.nav-logo span{color:var(--accent);}
.nav-links{display:flex;gap:2px;}
.nav-link{
  font-size:10px;letter-spacing:0.15em;text-transform:uppercase;
  padding:7px 14px;text-decoration:none;color:var(--muted);
  border:1px solid transparent;transition:all 0.15s;
}
.nav-link:hover{color:var(--fg);border-color:var(--border);}
.nav-link.active{color:var(--fg);border-color:var(--accent);background:rgba(212,80,26,0.08);}
.nav-right{display:flex;align-items:center;gap:12px;}
.athlete-select{
  background:var(--surface2);border:1px solid var(--border);color:var(--fg);
  font-family:'DM Mono',monospace;font-size:11px;padding:6px 10px;cursor:pointer;outline:none;
}
.athlete-select option{background:var(--surface);}
.btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;padding:7px 14px;border:none;cursor:pointer;transition:all 0.15s;}
.btn-primary{background:var(--accent);color:var(--fg);}
.btn-primary:hover{background:#e8621a;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--muted);color:var(--fg);}

/* CALENDAR TOOLBAR */
.cal-toolbar{
  display:flex;align-items:center;gap:12px;
  padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);
}
.week-nav{display:flex;align-items:center;gap:8px;}
.week-nav-btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  width:30px;height:30px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;
}
.week-nav-btn:hover{border-color:var(--accent);color:var(--fg);}
.week-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.03em;min-width:220px;}
.today-btn{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 12px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;}
.today-btn:hover{border-color:var(--accent);color:var(--fg);}
.toolbar-spacer{flex:1;}
.week-km-badge{font-size:10px;color:var(--muted);letter-spacing:0.1em;}
.week-km-badge span{color:var(--accent);font-size:14px;font-family:'Bebas Neue',sans-serif;}

/* WEEK GRID */
.week-wrap{
  display:grid;
  grid-template-rows:auto auto;
  overflow-x:auto;
  flex:1;
}
.week-header{
  display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.day-header{
  padding:12px 16px;border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:2px;
}
.day-header:last-child{border-right:none;}
.day-header.today{background:rgba(212,80,26,0.06);}
.day-name{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);}
.day-num{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:var(--fg);}
.day-header.today .day-num{color:var(--accent);}
.day-total{font-size:10px;color:var(--muted);}
.day-total span{color:var(--green);}

/* DAY COLUMNS */
.week-body{
  display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));
  overflow-y:visible;
}
.day-col{
  border-right:1px solid var(--border);padding:12px;
  display:flex;flex-direction:column;gap:8px;
  min-height:300px;position:relative;
  transition:background 0.15s;
}
.day-col:last-child{border-right:none;}
.day-col.today{background:rgba(212,80,26,0.03);}
.day-col.drop-target{background:rgba(212,80,26,0.08);border-color:var(--accent);}

/* TRAINING CARDS */
.training-card{
  border:1px solid var(--border);padding:10px 12px;
  cursor:pointer;position:relative;
  transition:all 0.2s;
  animation:cardIn 0.2s ease forwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.training-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.4);}
.training-card.dragging{opacity:0.35;transform:scale(0.96);}
.day-col.drag-over{background:rgba(212,80,26,0.1);outline:2px dashed var(--accent);}
.training-card.done{border-left:3px solid var(--green);}
.training-card.missed{border-left:3px solid var(--accent);opacity:0.6;}
.training-card.rest-card{border-style:dashed;opacity:0.5;}

.card-type{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:5px;}
.card-type.spokojny{color:#5a9fe8;}
.card-type.interwaly{color:#e8c84a;}
.card-type.tempo{color:#d4501a;}
.card-type.wybieganie{color:#9a6fe8;}
.card-type.regeneracja{color:#4caf78;}
.card-type.odpoczynek{color:var(--muted);}
.card-type.start{color:var(--green);}
.card-type.zastepczy{color:#e8b840;}

.card-main{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:var(--fg);margin-bottom:4px;}
.card-pace{font-size:10px;color:var(--muted);margin-bottom:6px;}
.card-desc{font-size:10px;color:rgba(240,236,228,0.6);line-height:1.6;font-family:'DM Sans',sans-serif;font-style:italic;}
.card-status{
  display:inline-flex;align-items:center;gap:4px;
  font-size:9px;letter-spacing:0.1em;text-transform:uppercase;
  margin-top:8px;padding:3px 8px;border:1px solid var(--border);color:var(--muted);
}
.card-status.done{border-color:var(--green);color:var(--green);}
.card-status.missed{border-color:var(--accent);color:var(--accent);}
.card-delete{
  position:absolute;top:6px;right:6px;
  width:18px;height:18px;border:none;background:transparent;
  color:var(--muted);cursor:pointer;font-size:12px;opacity:0;transition:opacity 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.training-card:hover .card-delete{opacity:1;}
.card-delete:hover{color:var(--accent);}
.card-copy{
  position:absolute;top:6px;right:26px;
  width:18px;height:18px;border:none;background:transparent;
  color:var(--muted);cursor:pointer;font-size:13px;opacity:0;transition:opacity 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.training-card:hover .card-copy{opacity:1;}
.card-copy:hover{color:var(--blue);}
.card-approve{
  margin-top:8px;width:100%;background:rgba(61,184,112,0.12);border:1px solid rgba(61,184,112,0.35);
  color:var(--green);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;
  text-transform:uppercase;padding:6px;cursor:pointer;transition:all 0.15s;border-radius:4px;
}
.card-approve:hover{background:rgba(61,184,112,0.25);}

/* ADD TRAINING PLACEHOLDER */
.add-training-btn{
  border:1px dashed var(--border);padding:10px;text-align:center;
  color:var(--muted);cursor:pointer;font-size:10px;letter-spacing:0.1em;
  transition:all 0.15s;text-transform:uppercase;
}
.add-training-btn:hover{border-color:var(--accent);color:var(--accent);}

/* MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:50;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--surface);border:1px solid var(--border);width:480px;max-width:90vw;
  max-height:88vh;overflow-y:auto;
  transform:translateY(8px);transition:transform 0.2s;
}
.modal-bg.open .modal{transform:translateY(0);}
.modal-header{
  padding:18px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.03em;}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;transition:color 0.15s;}
.modal-close:hover{color:var(--fg);}
.modal-body{padding:20px 24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

/* FORM */
.field{margin-bottom:14px;}
.field label{display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);
  font-family:'DM Mono',monospace;font-size:12px;padding:9px 12px;outline:none;transition:border-color 0.15s;
}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field select{cursor:pointer;}
.field select option{background:var(--surface);}
.field textarea{resize:vertical;min-height:70px;line-height:1.6;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* TYPE PILLS */
.type-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.type-pill{
  font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:5px 10px;
  border:1px solid var(--border);cursor:pointer;transition:all 0.15s;color:var(--muted);
  background:transparent;font-family:'DM Mono',monospace;
}
.type-pill:hover{border-color:var(--muted);color:var(--fg);}
.type-pill.sel{color:var(--fg);}
.type-pill.sel.spokojny-p{border-color:var(--blue);background:rgba(90,159,232,0.15);color:var(--blue);}
.type-pill.sel.interwaly-p{border-color:var(--yellow);background:rgba(232,200,74,0.15);color:var(--yellow);}
.type-pill.sel.tempo-p{border-color:var(--accent);background:rgba(212,80,26,0.15);color:var(--accent);}
.type-pill.sel.wybieganie-p{border-color:var(--purple);background:rgba(154,111,232,0.15);color:var(--purple);}
.type-pill.sel.regeneracja-p{border-color:var(--green);background:rgba(76,175,120,0.15);color:var(--green);}
.type-pill.sel.odpoczynek-p{border-color:var(--muted);background:rgba(106,101,96,0.15);}
.type-pill.sel.start-p{border-color:var(--green);background:rgba(61,184,112,0.15);color:var(--green);}
.type-pill.sel.zastepczy-p{border-color:#e8b840;background:rgba(232,184,64,0.15);color:#e8b840;}

/* NOTIF */
.notif{
  position:fixed;bottom:24px;right:24px;
  background:var(--green);color:#0a1a0f;
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;
  padding:12px 20px;transform:translateY(80px);opacity:0;transition:all 0.3s;z-index:200;
}
.notif.show{transform:translateY(0);opacity:1;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(22,22,26,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 0 20px;z-index:100;}
.nav-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer;text-decoration:none;}
.nav-lbl{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;}
.nav-it.active .nav-lbl,.nav-it.active svg{color:var(--accent);stroke:var(--accent);}
/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);}

/* ── MOBILE VIEW — PREMIUM ─────────────────────────────────────── */
.view-switcher{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;}
.view-btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:5px 12px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;transition:all 0.15s;}
.view-btn.active{background:var(--accent);color:var(--fg);}

#mobile-view{display:none;padding:0 0 120px;}

/* Day accordion */
.mobile-day{background:transparent;margin:0 16px 10px;border-radius:16px;overflow:hidden;border:1px solid var(--border);transition:border-color 0.2s;}
.mobile-day.open{border-color:var(--accent);}
.mobile-day-header{display:flex;align-items:center;padding:16px;cursor:pointer;gap:14px;background:var(--surface);transition:background 0.15s;}
.mobile-day-header:active{background:var(--surface2);}
.mobile-day-header.today{background:rgba(212,80,26,0.08);}
.mday-abbr{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.05em;color:var(--muted);flex-shrink:0;gap:1px;}
.mday-abbr-day{font-size:8px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);}
.mday-abbr-num{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;color:var(--fg);}
.mobile-day-header.today .mday-abbr{background:var(--accent);}
.mobile-day-header.today .mday-abbr-day{color:rgba(240,237,232,0.7);}
.mobile-day-header.today .mday-abbr-num{color:var(--fg);}
.mday-info{flex:1;min-width:0;}
.mday-month{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:2px;}
.mday-types{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.mday-type-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.mday-km-wrap{text-align:right;flex-shrink:0;}
.mday-km{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);line-height:1;}
.mday-km-lbl{font-size:8px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:0.1em;}
.mday-chevron{color:var(--muted2);font-size:12px;flex-shrink:0;transition:transform 0.25s;margin-left:4px;}
.mobile-day.open .mday-chevron{transform:rotate(180deg);color:var(--accent);}
.mobile-day-body{display:none;background:var(--surface);border-top:1px solid var(--border);padding:12px 14px 14px;}
.mobile-day.open .mobile-day-body{display:block;animation:slideDown 0.2s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

/* Training cards premium */
.mtraining{border-radius:12px;padding:14px 16px 14px 20px;margin-bottom:8px;position:relative;overflow:hidden;border:1px solid transparent;transition:border-color 0.15s;}
.mtraining:last-child{margin-bottom:0;}
.mtraining::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0;}
.mtraining.spokojny{background:rgba(80,144,224,0.08);border-color:rgba(80,144,224,0.15);}
.mtraining.spokojny::before{background:linear-gradient(180deg,#5090e0,#3070c0);}
.mtraining.interwaly{background:rgba(232,184,64,0.08);border-color:rgba(232,184,64,0.15);}
.mtraining.interwaly::before{background:linear-gradient(180deg,#e8b840,#d4a020);}
.mtraining.tempo{background:rgba(212,80,26,0.08);border-color:rgba(212,80,26,0.15);}
.mtraining.tempo::before{background:linear-gradient(180deg,#d4501a,#f06030);}
.mtraining.wybieganie{background:rgba(154,111,232,0.08);border-color:rgba(154,111,232,0.15);}
.mtraining.wybieganie::before{background:linear-gradient(180deg,#9a6fe8,#7a4fc8);}
.mtraining.regeneracja{background:rgba(61,184,112,0.08);border-color:rgba(61,184,112,0.15);}
.mtraining.regeneracja::before{background:linear-gradient(180deg,#3db870,#2a9a58);}
.mtraining.odpoczynek{background:rgba(68,66,74,0.3);border-color:rgba(68,66,74,0.4);}
.mtraining.odpoczynek::before{background:var(--muted2);}
.mtraining.start{background:rgba(61,184,112,0.12);border-color:rgba(61,184,112,0.3);}
.mtraining.start::before{background:linear-gradient(180deg,#3db870,#2a9a58);}
.mtraining.zastepczy{background:rgba(232,184,64,0.08);border-color:rgba(232,184,64,0.15);}
.mtraining.zastepczy::before{background:linear-gradient(180deg,#e8b840,#d4a020);}
.mtraining-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.mtraining-type-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;font-family:'DM Mono',monospace;}
.mtraining.spokojny .mtraining-type-label{color:#5090e0;}
.mtraining.interwaly .mtraining-type-label{color:#e8b840;}
.mtraining.tempo .mtraining-type-label{color:#d4501a;}
.mtraining.wybieganie .mtraining-type-label{color:#9a6fe8;}
.mtraining.regeneracja .mtraining-type-label{color:#3db870;}
.mtraining.odpoczynek .mtraining-type-label{color:var(--muted);}
.mtraining.start .mtraining-type-label{color:#3db870;}
.mtraining-dist{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;color:var(--fg);}
.mtraining-dist span{font-size:16px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:300;margin-left:2px;}
.mtraining-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.mchip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.06);border-radius:6px;padding:3px 8px;font-size:11px;font-family:'DM Mono',monospace;color:var(--fg);}
.mtraining-desc{font-size:12px;color:rgba(240,237,232,0.6);line-height:1.7;margin-top:8px;font-family:'DM Sans',sans-serif;font-weight:300;border-top:1px solid rgba(255,255,255,0.06);padding-top:8px;}
.mtraining-status{display:inline-flex;align-items:center;gap:5px;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;margin-top:8px;padding:4px 10px;border-radius:20px;font-family:'DM Mono',monospace;}
.mtraining-status.done{background:rgba(61,184,112,0.15);color:#3db870;}
.mtraining-status.missed{background:rgba(212,80,26,0.15);color:var(--accent);}
.mtraining-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.mtraining-btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;padding:6px 12px;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all 0.15s;}
.mtraining-btn:hover{border-color:var(--accent);color:var(--accent);}
.mtraining-btn.approve{border-color:rgba(61,184,112,0.4);color:#3db870;background:rgba(61,184,112,0.08);}
.mtraining-btn.del{border-color:rgba(224,80,80,0.3);color:var(--red);}

.mobile-sticky-btn{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:400px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--fg);border:none;border-radius:50px;padding:17px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;z-index:40;box-shadow:0 6px 24px rgba(212,80,26,0.45);transition:all 0.2s;}
.mobile-sticky-btn:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 8px 32px rgba(212,80,26,0.55);}
.mday-log-thumbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;}
.mday-log-thumbs img{width:calc(50% - 2px);max-height:90px;object-fit:cover;border-radius:8px;cursor:pointer;}
.m-add-btn{width:100%;padding:12px;border-radius:10px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;margin-top:8px;transition:all 0.15s;}
.m-add-btn:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
<div class="shell">

<!-- NAV -->
<nav>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const typeColors = {
  'Bieg spokojny':'spokojny','Interwały':'interwaly','Tempo':'tempo',
  'Wybieganie':'wybieganie','Regeneracja':'regeneracja','Odpoczynek':'odpoczynek',
  'Start':'start','Zastępczy':'zastepczy'
};

let trainings = {}; // dane z Supabase

const monthNames = ['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Paź','Lis','Gru'];
const dayNames = ['Pn','Wt','Śr','Cz','Pt','Sb','Nd'];

let currentWeekStart = getWeekStart(new Date()); // aktualny tydzień
let editingDate = null;
let editingIndex = null;
let selectedType = 'Bieg spokojny';
let selectedTypeCls = 'spokojny';

// ── WEEK HELPERS ──────────────────────────────────────────────────────────────
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0) ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function dateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const days = Array.from({length:7},(_,i) => addDays(currentWeekStart,i));
  const today = new Date(); today.setHours(0,0,0,0);

  // Week label
  const s = days[0], e = days[6];
  document.getElementById('week-label').textContent =
    `${s.getDate()} ${monthNames[s.getMonth()]} — ${e.getDate()} ${monthNames[e.getMonth()]} ${e.getFullYear()}`;

  // Total km
  let totalKm = 0;
  days.forEach(d => {
    const ts = trainings[dateStr(d)] || [];
    ts.forEach(t => totalKm += (t.dist||0));
  });
  document.getElementById('week-total-km').textContent = totalKm.toFixed(0);

  // Header
  document.getElementById('week-header').innerHTML = days.map(d => {
    const ds = dateStr(d);
    const isToday = d.getTime() === today.getTime();
    const ts = trainings[ds] || [];
    const km = ts.reduce((s,t)=>s+(t.dist||0),0);
    return `<div class="day-header ${isToday?'today':''}">
      <div class="day-name">${dayNames[d.getDay()===0?6:d.getDay()-1]}</div>
      <div class="day-num">${d.getDate()} ${monthNames[d.getMonth()]}</div>
      ${km>0?`<div class="day-total"><span>${km} km</span></div>`:'<div class="day-total">Odpoczynek</div>'}
    </div>`;
  }).join('');

  // Body
  document.getElementById('week-body').innerHTML = days.map(d => {
    const ds = dateStr(d);
    const isToday = d.getTime() === today.getTime();
    const ts = trainings[ds] || [];

    // Sprawdź czy to dzień startu — dla trenera tylko gdy wybrany zawodnik
    const showRace = _urlRole === 'athlete' || window._calSelectedAthleteId;
    const raceGoalForDay = showRace && window._goals && window._goals.find(g => g.date === ds);
    const raceCard = raceGoalForDay ? `<div style="background:linear-gradient(135deg,rgba(61,184,112,0.18),rgba(61,184,112,0.08));border:2px solid rgba(61,184,112,0.6);border-radius:8px;padding:10px 12px;margin-bottom:4px;cursor:pointer;" onclick="openGoalModal('${raceGoalForDay.id}')">
      <div style="font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--green);font-family:'DM Mono',monospace;margin-bottom:4px;">🏁 CEL STARTOWY</div>
      <div style="font-size:14px;font-weight:700;color:var(--fg);">${raceGoalForDay.name}</div>
      <div style="font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:3px;">kliknij aby edytować</div>
    </div>` : '';

    const cards = ts.map((t,i) => {
      const tc = typeColors[t.type] || 'spokojny';
      const statusCls = t.status==='done'?'done':t.status==='missed'?'missed':'';
      const statusLabel = t.status==='done'?'✓ Wykonany':t.status==='missed'?'✗ Nie wykonany':'';

      return `<div class="training-card ${statusCls} ${t.type==='Odpoczynek'?'rest-card':''}"
                   draggable="true"
                   ondragstart="dragStart(event,'${ds}',${i})"
                   ondragend="dragEnd(event)"
                   onclick="openModal('${ds}',${i})">
        <button class="card-delete" onclick="deleteTraining(event,'${ds}',${i})">✕</button>
        ${_urlRole==='coach'?`<button class="card-copy" onclick="openCopyModalFromCard(event,'${ds}',${i})" title="Kopiuj do zawodnika">⧉</button>`:''}
        <div class="card-type ${tc}">${t.type.toUpperCase()}</div>
        ${t.dist>0?`<div class="card-main">${t.dist} km</div>`:'<div class="card-main" style="font-size:16px;color:var(--muted);">—</div>'}
        ${(t.pace||t.hr)?`<div class="card-pace">${t.pace?t.pace+'/km':''} ${t.hr?'· ♥ '+t.hr:''}${t.time?'· '+t.time+' min':''}</div>`:''}
        ${t.desc?`<div class="card-desc">${t.desc}</div>`:''}
        ${statusLabel?`<div class="card-status ${t.status}">${statusLabel}</div>`:''}
        ${t.status!=='done'&&t.type!=='Odpoczynek'?`<button class="card-approve" onclick="approveTraining(event,'${ds}',${i},${JSON.stringify(t._id||null)})">✓ Zatwierdź</button>`:''}
      </div>`;
    }).join('');

    // Miniatury z logów dla tego dnia
    const dayLogs = (window._calLogs && window._calLogs[ds]) || [];
    const logThumbs = dayLogs.filter(l => l.attachment_url).map(l => {
      return l.attachment_url.split(',').map(url =>
        `<img src="${url}" style="width:calc(50% - 2px);max-height:80px;object-fit:cover;border-radius:4px;cursor:pointer;" onclick="window.open('${url}','_blank')" onerror="this.style.display='none'">`
      ).join('');
    }).join('');
    const logThumbsHtml = logThumbs ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;padding:6px;background:rgba(61,184,112,0.05);border:1px solid rgba(61,184,112,0.15);border-radius:6px;">${logThumbs}</div>` : '';

    return `<div class="day-col ${isToday?'today':''}"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="dragDrop(event,'${ds}')">
      ${raceCard}
      ${cards}
      ${logThumbsHtml}
      <div class="add-training-btn" onclick="openModal('${ds}',null)">+ Dodaj trening</div>
    </div>`;
  }).join('');
  // Jeśli aktywny widok mobilny — odśwież też
  if (typeof _calView !== 'undefined' && _calView === 'mobile') renderMobile();
}

  const fLogStrava = document.getElementById('f-log-strava');

  const fLogLabel = document.getElementById('f-log-files-label');
  if(fLogDist) fLogDist.value='';
  if(fLogPace) fLogPace.value='';
  if(fLogStrava) fLogStrava.value='';
  if(fLogFiles) fLogFiles.value='';

  if(ds) {

    document.getElementById('modal-date-label').textContent = '';

    editingDate = today;
    const fp = document.getElementById('f-date-picker');
    if(fp){ fp.style.display='block'; fp.value=today; }

    document.getElementById('modal-date-label').textContent =
      d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  if(idx !== null && ds && trainings[ds] && trainings[ds][idx]) {
    const t = trainings[ds][idx];
    document.getElementById('modal-title').textContent = 'Edytuj trening';

    selectedType = t.type;
    selectedTypeCls = typeColors[t.type] || 'spokojny';
    document.querySelectorAll('.type-pill').forEach(p=>{
      p.className='type-pill';
      const map={Spokojny:'spokojny-p',Interwały:'interwaly-p',Tempo:'tempo-p',Wybieganie:'wybieganie-p',Regeneracja:'regeneracja-p',Odpoczynek:'odpoczynek-p','🏁 Start':'start-p','🔄 Zastępczy':'zastepczy-p'};
      if(p.textContent.trim()===t.type.replace('Bieg spokojny','Spokojny').replace('Interwały','Interwały')) {
        p.className=`type-pill sel ${map[p.textContent.trim()]||'spokojny-p'}`;

    document.getElementById('modal-title').textContent = 'Nowy trening';

  if (_urlRole === 'coach') {

    smartSuggest(athleteId, selectedType, idx !== null);

async function saveTraining() {
  const dist = parseFloat(document.getElementById('f-dist').value)||0;
  const time = parseInt(document.getElementById('f-time').value)||0;
  const paceElS = document.getElementById('f-pace');
  const pace = paceElS.value || paceElS.dataset.suggested || '';
  const distElS = document.getElementById('f-dist');
  if (!distElS.value && distElS.dataset.suggested) distElS.value = distElS.dataset.suggested;
  const hr = document.getElementById('f-hr').value;
  const desc = document.getElementById('f-desc').value;
  const status = document.getElementById('f-status').value;

  if(!editingDate) { notify('Brak daty'); return; }

  const { data: { session } } = await _sbKal.auth.getSession();

  // ── TRENER: zapisz/zaktualizuj w Supabase ───────────────────────
  if (session && _urlRole === 'coach') {
    const athleteId = window._calSelectedAthleteId || null;
    const existingTraining = editingIndex !== null && trainings[editingDate] && trainings[editingDate][editingIndex];
    const dbId = existingTraining?._id || null;

    if (dbId) {
      const { error: updErr } = await _sbKal.from('trainings').update({
        type: selectedType, distance_km: dist||null, duration_min: time||null,
        pace: pace||null, heart_rate: hr||null, description: desc||null, status
      }).eq('id', dbId);
      if (updErr) { notify('Błąd zapisu: ' + updErr.message); return; }
    } else {
      // Sprawdź czy mamy wybrane zawodnika — jeśli nie, zapytaj
      const selEl = document.getElementById('athlete-select');
      const selVal = selEl ? selEl.value : '';
      const finalAthleteId = athleteId || selVal || null;
      if (!finalAthleteId && _urlRole === 'coach') {
        notify('Wybierz zawodnika w prawym górnym rogu');
        return;
      }
      const { error: insErr } = await _sbKal.from('trainings').insert({
        coach_id: session.user.id,
        athlete_id: finalAthleteId,
        date: editingDate,
        type: selectedType,
        distance_km: dist||null,
        duration_min: time||null,
        pace: pace||null,
        heart_rate: hr||null,
        description: desc||null,
        status
      });
      if (insErr) { notify('Błąd: ' + insErr.message); return; }
    }
    closeModal();
    await loadTrainingsFromDB();
    notify(dbId ? 'Trening zaktualizowany ✓' : `Dodano: ${selectedType}${dist>0?' · '+dist+' km':''}`);
    return;
  }

  // ── ZAWODNIK: lokalne + opcjonalnie log ──────────────────────────
  const t = {type:selectedType,dist,time,pace,hr,desc,status};
  if(!trainings[editingDate]) trainings[editingDate]=[];
  if(editingIndex!==null && editingIndex>=0) {
    trainings[editingDate][editingIndex] = t;
    notify('Trening zaktualizowany ✓');
  } else {
    trainings[editingDate].push(t);
    notify(`Dodano: ${selectedType}${dist>0?' · '+dist+' km':''}`);
  }

  // Jeśli status=done i jesteśmy w widoku zawodnika — zapisz log do Supabase
  if (status === 'done' && _urlRole === 'athlete' && typeof _sbKal !== 'undefined') {
    const { data: { session } } = await _sbKal.auth.getSession();
    if (session) {
      const { data: ath } = await _sbKal.from('athletes').select('id').eq('user_id', session.user.id).maybeSingle();
      if (ath) {
        // Upload zdjęć
        const logFiles = document.getElementById('f-log-files');
        const logStrava = document.getElementById('f-log-strava')?.value || null;
        const logDist = parseFloat(document.getElementById('f-log-dist')?.value) || dist || null;
        const logPace = document.getElementById('f-log-pace')?.value || pace || null;
        let attachmentUrl = null;

        if (logFiles && logFiles.files.length > 0) {
          const urls = [];
          const base = Date.now();
          for (let fi = 0; fi < logFiles.files.length; fi++) {
            const file = logFiles.files[fi];
            const path = ath.id + '/log_' + base + '_' + fi + '_' + Math.random().toString(36).slice(2) + '.' + file.name.split('.').pop();
            const { error: upErr } = await _sbKal.storage.from('training-screenshots').upload(path, file, {upsert:true, contentType: file.type});
            if (!upErr) {
              const { data: urlData } = _sbKal.storage.from('training-screenshots').getPublicUrl(path);
              urls.push(urlData.publicUrl);
            }
          }
          if (urls.length) attachmentUrl = urls.join(',');
        }

        const logComment = document.getElementById('f-comment')?.value || null;
        await _sbKal.from('training_logs').insert({
          athlete_id: ath.id,
          training_type: selectedType,
          distance_km: logDist,
          pace: logPace,
          strava_link: logStrava,
          attachment_url: attachmentUrl,
          comment: logComment,
          logged_at: new Date().toISOString()
        });
        notify('Log zapisany ✓');
      }
    }
  }

  closeModal();
  render();
}

async function approveTraining(e, ds, idx, dbId) {
  e.stopPropagation();
  if (!trainings[ds] || !trainings[ds][idx]) return;
  trainings[ds][idx].status = 'done';
  
  // Zapisz do Supabase jeśli mamy id
  if (dbId && typeof _sbKal !== 'undefined') {
    await _sbKal.from('trainings').update({status:'done'}).eq('id', dbId);
  }
  
  render();
  notify('Trening zatwierdzony ✓');
}

async function deleteTraining(e, ds, idx) {
  e.stopPropagation();
  if(!confirm('Usunąć ten trening?')) return;
  const t = trainings[ds] && trainings[ds][idx];
  const dbId = t ? t._id : null;
  // Najpierw usuń z DB, potem odśwież — unikamy race condition
  if (dbId) {
    const { error } = await _sbKal.from('trainings').delete().eq('id', dbId);
    if (error) { notify('Błąd usuwania: ' + error.message); return; }
  }
  // Przeładuj z bazy — świeży stan po DELETE
  await loadTrainingsFromDB();
  notify('Trening usunięty');
}

// ── LOAD TRAININGS FROM DB ────────────────────────────────────────
async function loadTrainingsFromDB() {
  const { data: { session } } = await _sbKal.auth.getSession();
  if (!session) return;

  let query = _sbKal.from('trainings').select('*');

  if (_urlRole === 'athlete') {
    // Zawodnik — tylko swoje treningi
    const { data: ath } = await _sbKal.from('athletes')
      .select('id').eq('user_id', session.user.id).maybeSingle();
    if (!ath) return;
    query = query.eq('athlete_id', ath.id);
  } else {
    // Trener — treningi wybranego lub wszystkich zawodników
    if (window._calSelectedAthleteId) {
      query = query.eq('athlete_id', window._calSelectedAthleteId);
    } else {
      query = query.eq('coach_id', session.user.id);
    }
  }

  const { data, error } = await query.order('date');
  if (error || !data) return;

  // Wyczyść stare dane i załaduj świeże z bazy
  trainings = {};
  data.forEach(t => {
    const ds = t.date;
    if (!trainings[ds]) trainings[ds] = [];
    // Sprawdź czy już nie ma tego treningu
    const exists = trainings[ds].some(x => x._id === t.id);
    if (!exists) {
      trainings[ds].push({
        _id: t.id,
        type: t.type || 'Spokojny',
        dist: parseFloat(t.distance_km) || 0,
        time: t.duration_min || 0,
        pace: t.pace || '',
        hr: t.heart_rate || '',
        desc: t.description || '',
        status: t.status || 'planned'
      });
    }
  });

  // Załaduj logi dla tych samych zawodników
  let logsQuery = _sbKal.from('training_logs').select('athlete_id, logged_at, attachment_url, distance_km, pace, feel').order('logged_at');
  if (_urlRole === 'athlete') {
    const { data: ath2 } = await _sbKal.from('athletes').select('id').eq('user_id', session.user.id).maybeSingle();
    if (ath2) logsQuery = logsQuery.eq('athlete_id', ath2.id);
  } else if (window._calSelectedAthleteId) {
    logsQuery = logsQuery.eq('athlete_id', window._calSelectedAthleteId);
  }
  const { data: logsData } = await logsQuery;
  window._calLogs = {};
  (logsData || []).forEach(l => {
    const ds = l.logged_at ? l.logged_at.split('T')[0] : null;
    if (!ds) return;
    if (!window._calLogs[ds]) window._calLogs[ds] = [];
    window._calLogs[ds].push(l);
  });

  render();
}


// ── SMART SUGGEST ─────────────────────────────────────────────────
// Konwertuje tempo "M:SS" na sekundy/km
function paceToSec(pace) {
  if (!pace) return null;
  const s = String(pace).trim();
  const parts = s.split(':');
  if (parts.length === 2) return parseInt(parts[0]) * 60 + parseInt(parts[1]);
  return null;
}
// Konwertuje sekundy/km na "M:SS"
function secToPace(sec) {
  if (!sec || sec <= 0) return null;
  const m = Math.floor(sec / 60);
  const s = String(Math.round(sec % 60)).padStart(2, '0');
  return m + ':' + s;
}
// Parsuje PB "H:MM:SS" lub "M:SS" na sekundy
function pbToSec(pb) {
  if (!pb) return null;
  const parts = String(pb).trim().split(':').map(Number);
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return null;
}

// Strefy tempa z PB (uproszczony model Danielsa)
function zonesFromPB(pbSec, distKm) {
  if (!pbSec || !distKm) return null;
  // Przelicz na tempo (sec/km) dla maratonu jako baza
  let marPaceSec;
  if (distKm === 42.195) marPaceSec = pbSec / 42.195;
  else if (distKm === 21.0975) marPaceSec = pbSec / 21.0975 * 1.08;
  else if (distKm === 10) marPaceSec = pbSec / 10 * 1.18;
  else if (distKm === 5) marPaceSec = pbSec / 5 * 1.28;
  else return null;
  return {
    'Bieg spokojny':  secToPace(marPaceSec * 1.20),
    'Wybieganie':     secToPace(marPaceSec * 1.15),
    'Regeneracja':    secToPace(marPaceSec * 1.30),
    'Tempo':          secToPace(marPaceSec * 0.97),
    'Interwały':      secToPace(marPaceSec * 0.88),
    'Start':          secToPace(marPaceSec * 1.00),
  };
}

// Mediana tablicy liczb
function median(arr) {
  if (!arr.length) return null;
  const s = [...arr].sort((a,b) => a-b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
}

async function smartSuggest(athleteId, trainingType, isEdit) {
  // Nie nadpisuj pól jeśli to edycja istniejącego treningu
  if (isEdit) return;

  const distEl = document.getElementById('f-dist');
  const paceEl = document.getElementById('f-pace');
  const hrEl   = document.getElementById('f-hr');
  const hint   = document.getElementById('smart-hint');
  if (hint) hint.textContent = '';

  let suggestedPace = null;
  let suggestedDist = null;
  let source = '';

  // ── Krok 1: Logi z ostatnich 8 tygodni ───────────────────────────
  if (athleteId) {
    const since = new Date();
    since.setDate(since.getDate() - 56);
    const { data: logs } = await _sbKal
      .from('training_logs')
      .select('training_type, distance_km, pace')
      .eq('athlete_id', athleteId)
      .gte('logged_at', since.toISOString())
      .order('logged_at', { ascending: false });

    if (logs && logs.length) {
      // Filtruj po typie — normalizuj nazwy
      const typeMap = {
        'Bieg spokojny': ['Bieg spokojny','Spokojny','spokojny','easy'],
        'Interwały':     ['Interwały','Interwaly','interval'],
        'Tempo':         ['Tempo','tempo'],
        'Wybieganie':    ['Wybieganie','wybieganie','long'],
        'Regeneracja':   ['Regeneracja','regeneracja','recovery'],
        'Start':         ['Start','start','race'],
      };
      const aliases = typeMap[trainingType] || [trainingType];
      const matching = logs.filter(l =>
        aliases.some(a => (l.training_type||'').toLowerCase().includes(a.toLowerCase()))
      );

      if (matching.length >= 2) {
        const paces = matching.map(l => paceToSec(l.pace)).filter(Boolean);
        const dists = matching.map(l => parseFloat(l.distance_km)).filter(d => d > 0);
        if (paces.length >= 2) {
          suggestedPace = secToPace(median(paces));
          source = 'logów';
        }
        if (dists.length >= 2) {
          suggestedDist = Math.round(median(dists) * 2) / 2; // zaokrągl do 0.5
        }
      }
    }
  }

  // ── Krok 2: Fallback z PB zawodnika ──────────────────────────────
  if (!suggestedPace && athleteId) {
    const { data: ath } = await _sbKal
      .from('athletes')
      .select('pb_marathon, pb_half, pb_10k, pb_5k')
      .eq('id', athleteId)
      .maybeSingle();

    if (ath) {
      // Użyj najlepszego dostępnego PB
      const candidates = [
        { pb: pbToSec(ath.pb_marathon), km: 42.195 },
        { pb: pbToSec(ath.pb_half),     km: 21.0975 },
        { pb: pbToSec(ath.pb_10k),      km: 10 },
        { pb: pbToSec(ath.pb_5k),       km: 5 },
      ].filter(c => c.pb);
      if (candidates.length) {
        const best = candidates[0];
        const zones = zonesFromPB(best.pb, best.km);
        if (zones && zones[trainingType]) {
          suggestedPace = zones[trainingType];
          source = 'PB';
        }
      }
    }
  }

  // ── Wstaw sugestie tylko do pustych pól ──────────────────────────
  if (suggestedPace && !paceEl.value) {
    paceEl.placeholder = suggestedPace + ' (sugestia)';
    paceEl.dataset.suggested = suggestedPace;
  }
  if (suggestedDist && !distEl.value) {
    distEl.placeholder = suggestedDist + ' km (sugestia)';
    distEl.dataset.suggested = suggestedDist;
  }
  if (hint && source) {
    hint.textContent = '💡 Sugestia na podstawie ' + source + ' zawodnika';
    hint.style.display = 'block';
  }
}

async function loadGoals() {
  const { data: { session } } = await _sbKal.auth.getSession();
  if (!session) return;
  let query = _sbKal.from('athletes').select('id, full_name, goal, target_date');
  if (_urlRole === 'athlete') {

    // Trener — tylko wybrany zawodnik

  } else {
    // Trener — wszyscy, ale w kalendarzu pokaż tylko najbliższy
    query = query.eq('coach_id', session.user.id).not('target_date', 'is', null);
  }
  const { data } = await query;
  window._goals = (data || []).filter(a => a.target_date && a.goal).map(a => ({
    id: a.id, name: a.goal || 'Start', date: a.target_date, athlete_name: a.full_name || ''
  }));
  window._raceDates = window._goals.map(g => ({ date: g.date, name: (_urlRole==='coach'&&g.athlete_name?g.athlete_name+': ':'')+g.name }));
  renderGoals();
  render();

function renderGoals() {
  const list = document.getElementById('nav-goals-list');
  if (!list) return;
  if (!window._goals.length) {
    list.innerHTML = '<span style="font-size:10px;color:var(--muted2);font-family:DM Mono,monospace;letter-spacing:0.05em;">Brak celów</span>';
    return;
  }
  // Trener bez wybranego zawodnika — tylko 1 najbliższy cel
  let goalsToRender = window._goals;
  if (_urlRole === 'coach' && !window._calSelectedAthleteId) {
    const now2 = new Date();
    const future = window._goals.filter(g => new Date(g.date+'T12:00:00') >= now2);
    future.sort((a,b) => a.date.localeCompare(b.date));
    goalsToRender = future.length ? [future[0]] : window._goals.slice(-1);
  }

  list.innerHTML = goalsToRender.map(g => {
    const d = new Date(g.date + 'T12:00:00');
    const now = new Date();
    const days = Math.round((d - now) / 86400000);
    const daysStr = days > 0 ? days + 'd' : days === 0 ? 'Dziś!' : 'po terminie';
    const isClose = days >= 0 && days <= 21;
    const isVeryClose = days >= 0 && days <= 7;
    const borderColor = isVeryClose ? 'rgba(232,184,64,0.8)' : isClose ? 'rgba(61,184,112,0.7)' : 'rgba(61,184,112,0.3)';
    const bg = isVeryClose ? 'rgba(232,184,64,0.12)' : 'rgba(61,184,112,0.08)';
    const dayColor = isVeryClose ? 'var(--yellow)' : isClose ? 'var(--green)' : 'var(--muted)';
    const athleteStr = (_urlRole === 'coach' && g.athlete_name) ? `<span style="font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${g.athlete_name.split(' ')[0]}</span>` : '';
    return `<div style="display:inline-flex;align-items:center;gap:6px;background:${bg};border:1px solid ${borderColor};border-radius:6px;padding:6px 10px;cursor:pointer;transition:all 0.15s;" onclick="openGoalModal('${g.id}')" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='${borderColor}'">
      <span style="font-size:13px;">🏁</span>
      ${athleteStr}
      <span style="font-size:11px;font-weight:600;color:var(--fg);">${g.name}</span>
      <span style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;">${d.toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}</span>
      <span style="font-size:10px;font-weight:600;color:${dayColor};font-family:'DM Mono',monospace;background:${dayColor.replace('var(--','rgba(').replace(')',',0.12)')};padding:1px 5px;border-radius:3px;">${daysStr}</span>
    </div>`;
  }).join('');
}

async function runOCR(input) {
  if (!input.files.length) return;
  const files = input.files;
  const file = files[0];
  // Miniatury
  const thumbsEl = document.getElementById('ocr-thumbs');
  thumbsEl.innerHTML = '';
  Array.from(files).forEach(f => {
    const url = URL.createObjectURL(f);
    thumbsEl.innerHTML += `<img src="${url}" style="width:calc(50% - 3px);max-height:120px;object-fit:cover;border-radius:8px;">`;
  });
  document.getElementById('ocr-file-label').textContent = files.length === 1 ? '✓ ' + file.name : '✓ ' + files.length + ' pliki';
  document.getElementById('ocr-upload-area').style.background = 'rgba(61,184,112,0.08)';
  document.getElementById('ocr-upload-area').style.borderColor = 'var(--green)';
  document.getElementById('ocr-spinner').style.display = 'block';
  // Konwertuj do base64
  const base64 = await new Promise(res => {
    const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(file);
  });
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 300,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: file.type || 'image/jpeg', data: base64 } },
          { type: 'text', text: 'To jest screen z aplikacji Garmin, Strava lub podobnej. Odczytaj dane treningowe i zwróć TYLKO JSON bez żadnego opisu ani backtick. Format: {"distance_km": liczba_lub_null, "duration": "H:MM:SS_lub_null", "pace": "M:SS_lub_null", "heart_rate": liczba_lub_null}' }
        ]}]
      })
    });
    const json = await resp.json();
    const text = (json.content?.[0]?.text || '').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);
    if (parsed.distance_km) document.getElementById('lm-dist').value = parsed.distance_km;
    if (parsed.duration) document.getElementById('lm-time').value = parsed.duration;
    if (parsed.pace) document.getElementById('lm-pace').value = parsed.pace;
    if (parsed.heart_rate) document.getElementById('lm-hr').value = parsed.heart_rate;
    notify('Dane odczytane ✓ — sprawdź i potwierdź');
  } catch(err) {
    notify('Nie udało się odczytać — uzupełnij ręcznie');
  }
  document.getElementById('ocr-spinner').style.display = 'none';
}

let _dragDs = null, _dragIdx = null;

function dragStart(e, ds, idx) {
  _dragDs = ds; _dragIdx = idx;
  setTimeout(() => e.target.classList.add('dragging'), 0);
  e.dataTransfer.effectAllowed = 'move';
}
function dragEnd(e) {
  e.target.classList.remove('dragging');
}
async function dragDrop(e, targetDs) {
  e.preventDefault();
  document.querySelectorAll('.day-col').forEach(c => c.classList.remove('drag-over'));
  if (!_dragDs || _dragIdx === null || _dragDs === targetDs) { _dragDs=null; _dragIdx=null; return; }
  const t = trainings[_dragDs] && trainings[_dragDs][_dragIdx];
  if (!t) return;
  const dbId = t._id;
  if (dbId) {
    const { error } = await _sbKal.from('trainings').update({ date: targetDs }).eq('id', dbId);
    if (error) { notify('Błąd: ' + error.message); _dragDs=null; _dragIdx=null; return; }
  }
  if (!trainings[targetDs]) trainings[targetDs] = [];
  trainings[targetDs].push({...t});
  trainings[_dragDs].splice(_dragIdx, 1);
  if (!trainings[_dragDs].length) delete trainings[_dragDs];
  _dragDs = null; _dragIdx = null;
  render();
  notify('Trening przeniesiony ✓');
}

  'Bieg spokojny':'spokojny','Spokojny':'spokojny',
  'Interwały':'interwaly','Tempo':'tempo',
  'Wybieganie':'wybieganie','Regeneracja':'regeneracja',
  'Odpoczynek':'odpoczynek','Start':'start','Zastępczy':'zastepczy'
};

function renderMobile() {
  const el = document.getElementById('mobile-view');
  if (!el) return;
  const days = Array.from({length:7},(_,i) => addDays(currentWeekStart,i));
  const today = new Date(); today.setHours(0,0,0,0);

  const typeColorMap = {
    'spokojny':'#5090e0','interwaly':'#e8b840','tempo':'#d4501a',
    'wybieganie':'#9a6fe8','regeneracja':'#3db870','start':'#3db870',
    'zastepczy':'#e8b840','odpoczynek':'var(--muted2)'
  };

  el.innerHTML = days.map(d => {
    const ds = dateStr(d);
    const isToday = d.getTime() === today.getTime();
    const ts = trainings[ds] || [];
    const km = ts.reduce((s,t)=>s+(t.dist||0),0);
    const dayN = dayNames[d.getDay()===0?6:d.getDay()-1];
    const sessionCount = ts.length;

    // Dots — typy treningów w nagłówku
    const raceDot = raceGoal ? `<div style="width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(61,184,112,0.6);"></div>` : '';
    const typeDots = ts.filter(t=>t.type!=='Odpoczynek').map(t => {
      const tc = _mTypeColors[t.type] || 'spokojny';
      const col = typeColorMap[tc] || '#5090e0';
      return `<div class="mday-type-dot" style="background:${col};"></div>`;
    }).join('');

    // Race goal
    const showRace = _urlRole === 'athlete' || window._calSelectedAthleteId;
    const raceGoal = showRace && window._goals && window._goals.find(g => g.date === ds);
    const raceHtml = raceGoal ? `<div style="background:linear-gradient(135deg,rgba(61,184,112,0.15),rgba(61,184,112,0.05));border:1px solid rgba(61,184,112,0.4);border-radius:10px;padding:10px 14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:10px;" onclick="openGoalModal('${raceGoal.id}')">
      <span style="font-size:18px;">🏁</span>
      <div><div style="font-size:12px;font-weight:600;color:var(--green);">${raceGoal.name}</div><div style="font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:1px;">kliknij aby edytować</div></div>
    </div>` : '';

    // Training cards — premium
    const cardsHtml = ts.map((t, i) => {
      const tc = _mTypeColors[t.type] || 'spokojny';
      const col = typeColorMap[tc] || '#5090e0';
      
      // Chips z metadanymi
      const chips = [
        t.pace ? `<span class="mchip">⚡ ${t.pace}/km</span>` : '',
        t.hr   ? `<span class="mchip">♥ ${t.hr}</span>` : '',
        t.time ? `<span class="mchip">⏱ ${t.time} min</span>` : '',
      ].filter(Boolean).join('');

      const statusHtml = t.status==='done'
        ? '<div class="mtraining-status done" style="display:inline-flex;align-items:center;gap:5px;background:rgba(61,184,112,0.15);color:var(--green);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;font-family:DM Mono,monospace;margin-top:6px;">✓ Wykonany</div>'
        : t.status==='missed' ? '<div class="mtraining-status missed" style="display:inline-flex;align-items:center;gap:5px;background:rgba(224,80,80,0.12);color:var(--red);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;font-family:DM Mono,monospace;margin-top:6px;">✗ Nie wykonany</div>' : '';

      const approveHtml = (t.status!=='done' && t.type!=='Odpoczynek')
        ? `<button class="mtraining-btn approve" onclick="event.stopPropagation();approveTraining(event,'${ds}',${i},${JSON.stringify(t._id||null)})">✓ Zatwierdź</button>` : '';
      const editHtml = `<button class="mtraining-btn" onclick="event.stopPropagation();openModal('${ds}',${i})">✏ Edytuj</button>`;
      const copyHtml = _urlRole==='coach' ? `<button class="mtraining-btn" onclick="event.stopPropagation();openCopyModalFromCard(event,'${ds}',${i})">⧉ Kopiuj</button>` : '';
      const delHtml  = `<button class="mtraining-btn del" onclick="event.stopPropagation();deleteTraining(event,'${ds}',${i})">✕</button>`;

      return `<div class="mtraining ${tc}">
        <div class="mtraining-header">
          <div class="mtraining-type-label">${t.type.toUpperCase()}</div>
          ${statusHtml}
        </div>
        ${t.dist>0?`<div class="mtraining-dist">${t.dist}<span>km</span></div>`:''}
        ${chips?`<div class="mtraining-chips">${chips}</div>`:''}
        ${t.desc?`<div class="mtraining-desc">${t.desc}</div>`:''}
        <div class="mtraining-actions">${editHtml}${approveHtml}${copyHtml}${delHtml}</div>
      </div>`;
    }).join('');

    // Log thumbnails
    const dayLogs = (window._calLogs && window._calLogs[ds]) || [];
    const thumbsHtml = dayLogs.filter(l=>l.attachment_url).length > 0
      ? `<div class="mday-log-thumbs">${dayLogs.filter(l=>l.attachment_url).flatMap(l=>l.attachment_url.split(',')).map(url=>`<img src="${url}" onclick="window.open('${url}','_blank')" onerror="this.style.display='none'">`).join('')}</div>` : '';

    // Dominujący typ dnia (dla koloru akcentu)
    const dominantType = ts.filter(t=>t.type!=='Odpoczynek')[0]?.type || '';
    const dayAccent = {
      'Spokojny':'rgba(78,140,214,0.08)', 'Bieg spokojny':'rgba(78,140,214,0.08)',
      'Interwały':'rgba(232,184,64,0.08)', 'Tempo':'rgba(232,86,30,0.08)',
      'Wybieganie':'rgba(138,98,216,0.08)', 'Regeneracja':'rgba(61,184,112,0.08)'
    }[dominantType] || '';
    const dayBorderAccent = {
      'Spokojny':'rgba(78,140,214,0.2)', 'Bieg spokojny':'rgba(78,140,214,0.2)',
      'Interwały':'rgba(232,184,64,0.2)', 'Tempo':'rgba(232,86,30,0.2)',
      'Wybieganie':'rgba(138,98,216,0.2)', 'Regeneracja':'rgba(61,184,112,0.2)'
    }[dominantType] || (raceGoal?'rgba(61,184,112,0.35)':'rgba(255,255,255,0.06)');

    return `<div class="mobile-day${isToday?' open':''}" id="mday-${ds}" style="${dayAccent?'background:'+dayAccent+';':''};border-color:${dayBorderAccent}${isToday?';border-color:rgba(232,86,30,0.5)':''}">
      <div class="mobile-day-header${isToday?' today':''}" onclick="toggleMobileDay('${ds}')">
        <div class="mday-abbr">
          <div class="mday-abbr-day">${dayN}</div>
          <div class="mday-abbr-num">${d.getDate()}</div>
        </div>
        <div class="mday-info">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1;color:${isToday?'var(--accent)':'var(--fg)'};">${monthNames[d.getMonth()].toUpperCase()}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
            ${raceDot}${typeDots}
            ${raceGoal ? `<span style="font-size:9px;color:var(--green);font-family:'DM Mono',monospace;letter-spacing:0.08em;font-weight:700;">🏁 DZIEŃ STARTU</span>` : sessionCount===0?`<span style="font-size:9px;color:var(--muted2);font-family:'DM Mono',monospace;letter-spacing:0.08em;">ODPOCZYNEK</span>`:`<span style="font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;">${sessionCount} ${sessionCount===1?'trening':'treningi'}</span>`}
          </div>
        </div>
        ${km>0?`<div class="mday-km-wrap"><div class="mday-km">${km.toFixed(0)}</div><div class="mday-km-lbl">km</div></div>`:''}
        <div class="mday-chevron">›</div>
      </div>
      <div class="mobile-day-body">
        ${raceHtml}
        ${cardsHtml}
        ${thumbsHtml}
        <button class="m-add-btn" onclick="openModal('${ds}',null)">+ Dodaj trening</button>
      </div>
    </div>`;
  }).join('');
}

function toggleMobileDay(ds) {
  const el = document.getElementById('mday-'+ds);
  if (!el) return;
  el.classList.toggle('open');
}

render();
loadAthletesSelect();
loadTrainingsFromDB();
loadGoals();
setTimeout(()=>setView(_calView),50);

if (_urlRole === 'athlete') {
  // Zawodnik — ukryj przyciski dodawania/usuwania
  window.addEventListener('load', () => {
    document.querySelectorAll('.card-delete, .card-approve, #btn-new-training').forEach(el => el.style.display = 'none');
  });
  // Zawodnik może przeglądać i dodawać własne treningi
}
</script>
