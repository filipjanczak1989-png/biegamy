<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiegaMy — Kalendarz</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--surface:#16161a;--surface2:#1e1e24;--border:#2a2a32;--accent:#d4501a;--accent2:#f06030;--fg:#f0ede8;--muted:#66636e;--muted2:#44424a;--green:#3db870;--yellow:#e8b840;--red:#e05050;--blue:#5090e0;--purple:#9a6fe8;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'DM Mono',monospace;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;flex-shrink:0;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.05em;text-decoration:none;color:var(--fg);}
.nav-logo span{color:var(--accent);}
.nav-links{display:flex;gap:2px;}
.nav-link{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;padding:6px 12px;text-decoration:none;color:var(--muted);border:1px solid transparent;transition:all 0.15s;border-radius:4px;}
.nav-link:hover{color:var(--fg);border-color:var(--border);}
.nav-link.active{color:var(--fg);border-color:var(--accent);background:rgba(212,80,26,0.08);}
.nav-right{display:flex;align-items:center;gap:8px;}
.athlete-select{background:var(--surface2);border:1px solid var(--border);color:var(--fg);font-family:'DM Mono',monospace;font-size:11px;padding:5px 8px;cursor:pointer;outline:none;border-radius:4px;}
.btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 12px;border:none;cursor:pointer;transition:all 0.15s;border-radius:4px;}
.btn-primary{background:var(--accent);color:var(--fg);}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--fg);color:var(--fg);}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.week-nav{display:flex;align-items:center;gap:6px;}
.wnav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;border-radius:4px;}
.wnav-btn:hover{border-color:var(--accent);color:var(--fg);}
.week-label{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.03em;min-width:200px;}
.today-btn{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:5px 10px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;border-radius:4px;}
.today-btn:hover{border-color:var(--accent);color:var(--fg);}
.spacer{flex:1;}
.week-stats{display:flex;gap:20px;}
.wstat{text-align:right;}
.wstat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);line-height:1;}
.wstat-lbl{font-size:8px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}

/* WEEK GRID */
.week-grid{display:flex;flex-direction:column;flex:1;overflow:hidden;}
.week-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-bottom:2px solid var(--border);flex-shrink:0;}
.dh{padding:10px 12px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px;}
.dh:last-child{border-right:none;}
.dh.today{background:rgba(212,80,26,0.05);}
.dh-name{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}
.dh-num{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;}
.dh.today .dh-num{color:var(--accent);}
.dh-km{font-size:10px;color:var(--green);font-weight:500;margin-top:1px;}
.dh-rest{font-size:10px;color:var(--muted2);margin-top:1px;}

/* DAY COLUMNS */
.week-body{display:grid;grid-template-columns:repeat(7,1fr);flex:1;overflow-y:auto;padding-bottom:56px;}
.day-col{border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:160px;}
.day-col:last-child{border-right:none;}
.day-col.today{background:rgba(212,80,26,0.02);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(22,22,26,0.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;height:56px;z-index:30;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;text-decoration:none;color:var(--muted);transition:color 0.15s;border:none;background:none;font-family:'DM Mono',monospace;padding:0;}
.bn-item:hover{color:var(--fg);}
.bn-item.active{color:var(--accent);}
.bn-lbl{font-size:8px;letter-spacing:0.1em;text-transform:uppercase;}

/* TRAINING CARDS */
.tcard{border-radius:6px;padding:10px 11px;cursor:pointer;position:relative;transition:all 0.18s;border:1px solid var(--border);background:var(--surface);}
.tcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.5);border-color:var(--accent);}
.tcard.done{border-left:3px solid var(--green);}
.tcard.missed{border-left:3px solid var(--red);opacity:0.65;}
.tcard.rest{opacity:0.35;border-style:dashed;background:transparent;}
.tcard.raceday{border-color:rgba(61,184,112,0.5);background:rgba(61,184,112,0.06);cursor:default;}

.tc-type{font-size:8px;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:4px;font-weight:600;}
.tc-type.sp{color:var(--blue);}
.tc-type.in{color:var(--yellow);}
.tc-type.te{color:var(--accent);}
.tc-type.wy{color:var(--purple);}
.tc-type.re{color:var(--green);}
.tc-type.od{color:var(--muted);}
.tc-type.race{color:var(--green);}

.tc-dist{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:var(--fg);}
.tc-dist span{font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:300;}
.tc-meta{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.5;}
.tc-desc{font-size:9px;color:rgba(240,236,228,0.5);margin-top:5px;line-height:1.55;font-family:'DM Sans',sans-serif;font-style:italic;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.tc-status{display:inline-flex;align-items:center;gap:3px;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;margin-top:7px;padding:2px 7px;border-radius:3px;}
.tc-status.done{background:rgba(61,184,112,0.12);color:var(--green);border:1px solid rgba(61,184,112,0.3);}
.tc-status.missed{background:rgba(224,80,80,0.1);color:var(--red);border:1px solid rgba(224,80,80,0.3);}
.tc-approve{margin-top:7px;width:100%;background:rgba(61,184,112,0.1);border:1px solid rgba(61,184,112,0.3);color:var(--green);font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.1em;text-transform:uppercase;padding:5px;cursor:pointer;transition:all 0.15s;border-radius:4px;}
.tc-approve:hover{background:rgba(61,184,112,0.2);}
.tc-del{position:absolute;top:5px;right:5px;width:16px;height:16px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;opacity:0;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;}
.tcard:hover .tc-del{opacity:1;}
.tc-del:hover{color:var(--red);}

/* ADD BTN */
.add-btn{border:1px dashed var(--border);padding:8px;text-align:center;color:var(--muted2);cursor:pointer;font-size:9px;letter-spacing:0.08em;transition:all 0.15s;text-transform:uppercase;border-radius:4px;}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(212,80,26,0.04);}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:500px;max-width:94vw;max-height:90vh;overflow-y:auto;transform:translateY(10px);transition:transform 0.2s;}
.modal-bg.open .modal{transform:translateY(0);}
.mhdr{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.mttl{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.03em;}
.mx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;}
.mx:hover{color:var(--fg);}
.mbody{padding:20px 22px;}
.mfoot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.mdate{font-size:10px;color:var(--accent);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'DM Mono',monospace;font-size:12px;padding:9px 11px;outline:none;transition:border-color 0.15s;border-radius:4px;}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field select{cursor:pointer;}
.field select option{background:var(--surface);}
.field textarea{resize:vertical;min-height:68px;line-height:1.6;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.auto-lbl{color:var(--accent);font-size:9px;margin-left:4px;}
.tpills{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.tpill{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);cursor:pointer;transition:all 0.15s;color:var(--muted);background:transparent;font-family:'DM Mono',monospace;border-radius:4px;}
.tpill:hover{border-color:var(--muted);color:var(--fg);}
.tpill.sel.sp{border-color:var(--blue);background:rgba(80,144,224,0.12);color:var(--blue);}
.tpill.sel.in{border-color:var(--yellow);background:rgba(232,184,64,0.12);color:var(--yellow);}
.tpill.sel.te{border-color:var(--accent);background:rgba(212,80,26,0.12);color:var(--accent);}
.tpill.sel.wy{border-color:var(--purple);background:rgba(154,111,232,0.12);color:var(--purple);}
.tpill.sel.re{border-color:var(--green);background:rgba(61,184,112,0.12);color:var(--green);}
.tpill.sel.od{border-color:var(--muted);background:rgba(102,99,110,0.12);}

/* NOTIF */
.notif{position:fixed;bottom:20px;right:20px;background:var(--green);color:#061a0e;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;padding:11px 18px;border-radius:6px;transform:translateY(60px);opacity:0;transition:all 0.28s;z-index:200;}
.notif.show{transform:translateY(0);opacity:1;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div class="shell">

<nav>
  <a href="#" class="nav-logo" id="nav-logo-back">Biega<span>My</span></a>
  <div class="nav-links">
    <a href="#" class="nav-link" onclick="goBack()">← Powrót</a>
    <a class="nav-link active" id="role-label">Kalendarz</a>
  </div>
  <div class="nav-right">
    <select id="cal-athlete-sel" class="athlete-select" style="display:none;"></select>
    <button class="btn btn-ghost" onclick="openGoalModal()" id="goal-btn" style="display:none;">🏁 Cel startowy</button>
    <button class="btn btn-primary" onclick="openModal(null)" id="add-training-btn">+ Nowy trening</button>
  </div>
</nav>

<div class="toolbar">
  <div class="week-nav">
    <button class="wnav-btn" onclick="changeWeek(-1)">‹</button>
    <div class="week-label" id="week-label"></div>
    <button class="wnav-btn" onclick="changeWeek(1)">›</button>
  </div>
  <button class="today-btn" onclick="goToday()">Dziś</button>
  <div class="spacer"></div>
  <div class="week-stats">
    <div class="wstat"><div class="wstat-val" id="week-km">0</div><div class="wstat-lbl">km tygodnia</div></div>
    <div class="wstat"><div class="wstat-val" id="week-sessions">0</div><div class="wstat-lbl">treningów</div></div>
  </div>
</div>

<div class="week-grid">
  <div class="week-head" id="week-head"></div>
  <div class="week-body" id="week-body"></div>
</div>
</div>

<!-- MODAL TRENING -->
<div class="modal-bg" id="modal-bg" onclick="closeMBg(event)">
  <div class="modal">
    <div class="mhdr">
      <div class="mttl" id="modal-ttl">Nowy trening</div>
      <button class="mx" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody">
      <div class="mdate" id="modal-date"></div>
      <div class="field">
        <label>Typ treningu</label>
        <div class="tpills">
          <button class="tpill sel sp" onclick="selType(this,'Bieg spokojny','sp')">🏃 Spokojny</button>
          <button class="tpill" onclick="selType(this,'Interwały','in')">⚡ Interwały</button>
          <button class="tpill" onclick="selType(this,'Tempo','te')">🔥 Tempo</button>
          <button class="tpill" onclick="selType(this,'Wybieganie','wy')">🛤 Wybieganie</button>
          <button class="tpill" onclick="selType(this,'Regeneracja','re')">💚 Regeneracja</button>
          <button class="tpill" onclick="selType(this,'Odpoczynek','od')">💤 Odpoczynek</button>
        </div>
      </div>
      <div class="frow">
        <div class="field"><label>Dystans (km)</label><input type="number" id="f-dist" placeholder="np. 12" min="0" step="0.5" oninput="kalCalcPace()"></div>
        <div class="field"><label>Czas <span class="auto-lbl" id="lbl-time"></span></label><input type="text" id="f-time" placeholder="1:04:00" maxlength="7" oninput="kalAutoColon(this);kalCalcPace()"></div>
      </div>
      <div class="frow">
        <div class="field"><label>Tempo /km <span class="auto-lbl" id="lbl-pace"></span></label><input type="text" id="f-pace" placeholder="5:20" maxlength="5" oninput="kalAutoColonPace(this);kalCalcTime()"></div>
        <div class="field">
          <label>Tętno (bpm) <span id="kal-zone-lbl" style="font-size:9px;margin-left:4px;"></span></label>
          <input type="text" id="f-hr" placeholder="140–155" oninput="kalUpdateZone()">
        </div>
      </div>
      <div class="field"><label>Opis / instrukcje</label><textarea id="f-desc" placeholder="np. 10 km w tętnie 140-150. Pierwsze 2 km rozgrzewka."></textarea></div>
      <div class="field" id="status-field"><label>Status</label><select id="f-status"><option value="planned">Zaplanowany</option><option value="done">Wykonany</option><option value="missed">Nie wykonany</option></select></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost" onclick="closeModal()">Anuluj</button>
      <button class="btn btn-primary" onclick="saveTraining()">Zapisz →</button>
    </div>
  </div>
</div>

<!-- MODAL CEL STARTOWY -->
<div id="goal-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100;display:none;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;width:420px;max-width:92vw;padding:24px;">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;margin-bottom:4px;">🏁 Cel startowy</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:18px;">Pojawi się w kalendarzu jako oznaczony dzień.</div>
    <div class="field"><label>Nazwa biegu</label><input type="text" id="goal-name" placeholder="np. Maraton Warszawski"></div>
    <div class="field" style="margin-bottom:20px;"><label>Data startu</label><input type="date" id="goal-date"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" onclick="closeGoalModal()" style="flex:1;">Anuluj</button>
      <button class="btn btn-primary" onclick="saveGoal()" style="flex:2;">Zapisz →</button>
    </div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── CORE DATA ─────────────────────────────────────────────────────
const typeColors={'Bieg spokojny':'sp','Interwały':'in','Tempo':'te','Wybieganie':'wy','Regeneracja':'re','Odpoczynek':'od'};
const typeLabels={'Bieg spokojny':'SPOKOJNY','Interwały':'INTERWAŁY','Tempo':'TEMPO','Wybieganie':'WYBIEGANIE','Regeneracja':'REGENERACJA','Odpoczynek':'ODPOCZYNEK'};
let trainings={};
const monthNames=['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Paź','Lis','Gru'];
const dayNames=['Pn','Wt','Śr','Cz','Pt','Sb','Nd'];
let currentWeekStart=getWeekStart(new Date());
let editingDate=null,editingIndex=null,selectedType='Bieg spokojny',selectedTypeCls='sp';

function getWeekStart(date){const d=new Date(date);const day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));d.setHours(0,0,0,0);return d;}
function dateStr(d){return d.toISOString().split('T')[0];}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d;}

// ── RENDER ────────────────────────────────────────────────────────
function render(){
  const days=Array.from({length:7},(_,i)=>addDays(currentWeekStart,i));
  const today=new Date();today.setHours(0,0,0,0);
  const s=days[0],e=days[6];
  document.getElementById('week-label').textContent=`${s.getDate()} ${monthNames[s.getMonth()]} — ${e.getDate()} ${monthNames[e.getMonth()]} ${e.getFullYear()}`;

  let totalKm=0,totalSessions=0;
  days.forEach(d=>{(trainings[dateStr(d)]||[]).forEach(t=>{totalKm+=(t.dist||0);if(t.type!=='Odpoczynek')totalSessions++;});});
  document.getElementById('week-km').textContent=totalKm.toFixed(0);
  document.getElementById('week-sessions').textContent=totalSessions;

  document.getElementById('week-head').innerHTML=days.map(d=>{
    const ds=dateStr(d),isToday=d.getTime()===today.getTime();
    const ts=trainings[ds]||[];
    const km=ts.reduce((s,t)=>s+(t.dist||0),0);
    const sessions=ts.filter(t=>t.type!=='Odpoczynek').length;
    return `<div class="dh ${isToday?'today':''}">
      <div class="dh-name">${dayNames[d.getDay()===0?6:d.getDay()-1]}</div>
      <div class="dh-num">${d.getDate()} ${monthNames[d.getMonth()]}</div>
      ${km>0?`<div class="dh-km">${km} km${sessions>1?' · '+sessions+'×':''}</div>`:'<div class="dh-rest">—</div>'}
    </div>`;
  }).join('');

  document.getElementById('week-body').innerHTML=days.map(d=>{
    const ds=dateStr(d),isToday=d.getTime()===today.getTime();
    const ts=trainings[ds]||[];
    const raceDay=window._raceDates&&window._raceDates.find(r=>r.date===ds);
    const raceHtml=raceDay?`<div class="tcard raceday">
      <div class="tc-type race">🏁 START</div>
      <div style="font-size:12px;font-weight:500;margin-top:3px;color:var(--green);">${raceDay.name||'Start'}</div>
    </div>`:'';
    const isAthlete = _urlRole === 'athlete';
    const cards=ts.map((t,i)=>{
      const cls=typeColors[t.type]||'sp';
      const lbl=typeLabels[t.type]||t.type.toUpperCase();
      const statusCls=t.status==='done'?'done':t.status==='missed'?'missed':'';
      const timeDisplay=t.time?(t.time.includes&&t.time.includes(':')?t.time:t.time+' min'):'';
      const meta=[t.pace?t.pace+'/km':'',timeDisplay,t.hr?'♥ '+t.hr:''].filter(Boolean).join(' · ');
      return `<div class="tcard ${statusCls} ${t.type==='Odpoczynek'?'rest':''}" onclick="openModal('${ds}',${i})">
        ${!isAthlete?`<button class="tc-del" onclick="deleteTraining(event,'${ds}',${i})">✕</button>`:''}
        <div class="tc-type ${cls}">${lbl}</div>
        ${t.dist>0?`<div class="tc-dist">${t.dist}<span> km</span></div>`:''}
        ${meta?`<div class="tc-meta">${meta}</div>`:''}
        ${t.desc?`<div class="tc-desc">${t.desc}</div>`:''}
        ${t.status==='done'?'<div class="tc-status done">✓ Wykonany</div>':t.status==='missed'?'<div class="tc-status missed">✗ Pominięty</div>':''}
        ${!isAthlete&&t.status!=='done'&&t.type!=='Odpoczynek'?`<button class="tc-approve" onclick="approveTraining(event,'${ds}',${i},${JSON.stringify(t._id||null)})">✓ Zatwierdź</button>`:''}
      </div>`;
    }).join('');
    const addLabel = isAthlete ? '+ Zaloguj wynik' : '+ Dodaj trening';
    return `<div class="day-col ${isToday?'today':''}">${raceHtml}${cards}<div class="add-btn" onclick="openModal('${ds}',null)">${addLabel}</div></div>`;
  }).join('');
}

// ── AUTO CALC ─────────────────────────────────────────────────────
function kalAutoColon(el){let v=el.value.replace(/[^0-9]/g,'');if(v.length>=2)v=v.slice(0,1)+':'+v.slice(1);if(v.length>=5)v=v.slice(0,4)+':'+v.slice(4);el.value=v.slice(0,7);}
function kalAutoColonPace(el){let v=el.value.replace(/[^0-9]/g,'');if(v.length>=2)v=v.slice(0,2)+':'+v.slice(2);el.value=v.slice(0,5);}
function kalCalcPace(){
  const dist=parseFloat(document.getElementById('f-dist').value);
  const tv=document.getElementById('f-time').value;
  const lbl=document.getElementById('lbl-pace');
  if(!dist||!tv||tv.length<4){if(lbl)lbl.textContent='';return;}
  const p=tv.split(':').map(Number);
  const secs=p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:0;
  if(!secs){if(lbl)lbl.textContent='';return;}
  const pps=secs/dist,pm=Math.floor(pps/60),ps=String(Math.round(pps%60)).padStart(2,'0');
  document.getElementById('f-pace').value=pm+':'+ps;
  if(lbl)lbl.textContent='← auto';
}
function kalCalcTime(){
  const dist=parseFloat(document.getElementById('f-dist').value);
  const pv=document.getElementById('f-pace').value;
  const lbl=document.getElementById('lbl-time');
  if(!dist||!pv||pv.length<3){if(lbl)lbl.textContent='';return;}
  const p=pv.split(':').map(Number);
  if(p.length<2){if(lbl)lbl.textContent='';return;}
  const totalSecs=Math.round((p[0]*60+(p[1]||0))*dist);
  const h=Math.floor(totalSecs/3600),m=String(Math.floor((totalSecs%3600)/60)).padStart(2,'0'),s=String(totalSecs%60).padStart(2,'0');
  document.getElementById('f-time').value=h+':'+m+':'+s;
  if(lbl)lbl.textContent='← auto';
}
function kalUpdateZone(){
  const hr=document.getElementById('f-hr').value;
  const lbl=document.getElementById('kal-zone-lbl');
  if(!lbl||!hr) return;
  const p=hr.split('-').map(Number);
  const avg=p.length===2?Math.round((p[0]+p[1])/2):parseInt(hr)||null;
  if(!avg){lbl.textContent='';return;}
  let zone,color;
  if(avg<115){zone='Z1';color='#5090e0';}
  else if(avg<135){zone='Z2';color='#3db870';}
  else if(avg<155){zone='Z3';color='#e8b840';}
  else if(avg<170){zone='Z4';color='#f06030';}
  else{zone='Z5 VO2max';color='#e05050';}
  lbl.textContent=zone;lbl.style.color=color;
}

function saveTraining(){

// Override save/delete z DB
const _origSave=saveTraining;
window.saveTraining=async function(){
  const {data:{session}}=await _sbKal.auth.getSession();
  if(!session){_origSave();return;}

  const dist=parseFloat(document.getElementById('f-dist').value)||0;
  const ts=document.getElementById('f-time').value.trim();
  let dur=null;
  if(ts){const p=ts.split(':').map(Number);if(p.length===3)dur=p[0]*60+p[1]+Math.round(p[2]/60);else if(p.length===2)dur=p[0]*60+p[1];}
  const pace=document.getElementById('f-pace').value;
  const hr=document.getElementById('f-hr').value;
  const desc=document.getElementById('f-desc').value;
  const status=document.getElementById('f-status').value;
  if(!editingDate){notify('Brak daty');return;}

  // ZAWODNIK — zapisz log treningu (widoczny u trenera)
  if(_urlRole==='athlete'){
    const {data:ath}=await _sbKal.from('athletes').select('id').eq('user_id',session.user.id).maybeSingle();
    if(!ath){notify('Brak profilu zawodnika');return;}
    if(!dist){notify('Podaj dystans');return;}
    const {error}=await _sbKal.from('training_logs').insert({
      athlete_id:ath.id,
      training_type:selectedType,
      distance_km:dist||null,
      duration:ts||null,
      pace:pace||null,
      heart_rate:parseInt(hr)||null,
      comment:desc||null,
      feel:'mid',
      logged_at:new Date().toISOString()
    });
    if(error){notify('Błąd: '+error.message);return;}
    notify('Log zapisany! Trener widzi Twój wynik ✓');
    _origSave();
    return;
  }

  // TRENER — zapisz/edytuj plan treningowy
  const dbId=editingIndex!==null?trainings[editingDate]?.[editingIndex]?._id:null;
  if(dbId){
    const {error}=await _sbKal.from('trainings').update({type:selectedType,distance_km:dist||null,duration_min:dur,pace:pace||null,heart_rate:hr||null,description:desc||null,status}).eq('id',dbId);
    if(error){notify('Błąd: '+error.message);return;}
    _origSave();return;
  }
  if(!_calSelectedAthleteId){notify('Wybierz zawodnika z listy');return;}
  const {error}=await _sbKal.from('trainings').insert({coach_id:session.user.id,athlete_id:_calSelectedAthleteId,date:editingDate,type:selectedType,distance_km:dist||null,duration_min:dur,pace:pace||null,heart_rate:hr||null,description:desc||null,status});
  if(error){notify('Błąd: '+error.message);return;}
  _origSave();
};
