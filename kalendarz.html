<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiegaMy — Kalendarz</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --surface: #16161a;
  --surface2: #1e1e24;
  --border: #2a2a32;
  --accent: #d4501a;
  --accent2: #f06030;
  --fg: #f0ede8;
  --muted: #66636e;
  --muted2: #44424a;
  --green: #3db870;
  --yellow: #e8b840;
  --red: #e05050;
  --blue: #5090e0;
  --purple: #9a6fe8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'DM Mono',monospace;}body{padding-bottom:72px;}

/* SHELL */
.shell{display:flex;flex-direction:column;min-height:100vh;}

/* NAV */
nav{
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  flex-shrink:0;
}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.05em;text-decoration:none;color:var(--fg);}
.nav-logo span{color:var(--accent);}
.nav-links{display:flex;gap:2px;}
.nav-link{
  font-size:10px;letter-spacing:0.15em;text-transform:uppercase;
  padding:7px 14px;text-decoration:none;color:var(--muted);
  border:1px solid transparent;transition:all 0.15s;
}
.nav-link:hover{color:var(--fg);border-color:var(--border);}
.nav-link.active{color:var(--fg);border-color:var(--accent);background:rgba(212,80,26,0.08);}
.nav-right{display:flex;align-items:center;gap:12px;}
.athlete-select{
  background:var(--surface2);border:1px solid var(--border);color:var(--fg);
  font-family:'DM Mono',monospace;font-size:11px;padding:6px 10px;cursor:pointer;outline:none;
}
.athlete-select option{background:var(--surface);}
.btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;padding:7px 14px;border:none;cursor:pointer;transition:all 0.15s;}
.btn-primary{background:var(--accent);color:var(--fg);}
.btn-primary:hover{background:#e8621a;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--muted);color:var(--fg);}

/* CALENDAR TOOLBAR */
.cal-toolbar{
  display:flex;align-items:center;gap:12px;
  padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);
}
.week-nav{display:flex;align-items:center;gap:8px;}
.week-nav-btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  width:30px;height:30px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;
}
.week-nav-btn:hover{border-color:var(--accent);color:var(--fg);}
.week-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.03em;min-width:220px;}
.today-btn{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 12px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;}
.today-btn:hover{border-color:var(--accent);color:var(--fg);}
.toolbar-spacer{flex:1;}
.week-km-badge{font-size:10px;color:var(--muted);letter-spacing:0.1em;}
.week-km-badge span{color:var(--accent);font-size:14px;font-family:'Bebas Neue',sans-serif;}

/* WEEK GRID */
.week-wrap{
  display:grid;
  grid-template-rows:auto auto;
  overflow-x:auto;
  flex:1;
}
.week-header{
  display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.day-header{
  padding:12px 16px;border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:2px;
}
.day-header:last-child{border-right:none;}
.day-header.today{background:rgba(212,80,26,0.06);}
.day-name{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);}
.day-num{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:var(--fg);}
.day-header.today .day-num{color:var(--accent);}
.day-total{font-size:10px;color:var(--muted);}
.day-total span{color:var(--green);}

/* DAY COLUMNS */
.week-body{
  display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));
  overflow-y:visible;
}
.day-col{
  border-right:1px solid var(--border);padding:12px;
  display:flex;flex-direction:column;gap:8px;
  min-height:300px;position:relative;
  transition:background 0.15s;
}
.day-col:last-child{border-right:none;}
.day-col.today{background:rgba(212,80,26,0.03);}
.day-col.drop-target{background:rgba(212,80,26,0.08);border-color:var(--accent);}

/* TRAINING CARDS */
.training-card{
  border:1px solid var(--border);padding:10px 12px;
  cursor:pointer;position:relative;
  transition:all 0.2s;
  animation:cardIn 0.2s ease forwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.training-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.4);}
.training-card.done{border-left:3px solid var(--green);}
.training-card.missed{border-left:3px solid var(--accent);opacity:0.6;}
.training-card.rest-card{border-style:dashed;opacity:0.5;}

.card-type{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:5px;}
.card-type.spokojny{color:#5a9fe8;}
.card-type.interwaly{color:#e8c84a;}
.card-type.tempo{color:#d4501a;}
.card-type.wybieganie{color:#9a6fe8;}
.card-type.regeneracja{color:#4caf78;}
.card-type.odpoczynek{color:var(--muted);}
.card-type.start{color:var(--green);}

.card-main{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:var(--fg);margin-bottom:4px;}
.card-pace{font-size:10px;color:var(--muted);margin-bottom:6px;}
.card-desc{font-size:10px;color:rgba(240,236,228,0.6);line-height:1.6;font-family:'DM Sans',sans-serif;font-style:italic;}
.card-status{
  display:inline-flex;align-items:center;gap:4px;
  font-size:9px;letter-spacing:0.1em;text-transform:uppercase;
  margin-top:8px;padding:3px 8px;border:1px solid var(--border);color:var(--muted);
}
.card-status.done{border-color:var(--green);color:var(--green);}
.card-status.missed{border-color:var(--accent);color:var(--accent);}
.card-delete{
  position:absolute;top:6px;right:6px;
  width:18px;height:18px;border:none;background:transparent;
  color:var(--muted);cursor:pointer;font-size:12px;opacity:0;transition:opacity 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.training-card:hover .card-delete{opacity:1;}
.card-delete:hover{color:var(--accent);}
.card-approve{
  margin-top:8px;width:100%;background:rgba(61,184,112,0.12);border:1px solid rgba(61,184,112,0.35);
  color:var(--green);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;
  text-transform:uppercase;padding:6px;cursor:pointer;transition:all 0.15s;border-radius:4px;
}
.card-approve:hover{background:rgba(61,184,112,0.25);}

/* ADD TRAINING PLACEHOLDER */
.add-training-btn{
  border:1px dashed var(--border);padding:10px;text-align:center;
  color:var(--muted);cursor:pointer;font-size:10px;letter-spacing:0.1em;
  transition:all 0.15s;text-transform:uppercase;
}
.add-training-btn:hover{border-color:var(--accent);color:var(--accent);}

/* MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:50;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--surface);border:1px solid var(--border);width:480px;max-width:90vw;
  max-height:88vh;overflow-y:auto;
  transform:translateY(8px);transition:transform 0.2s;
}
.modal-bg.open .modal{transform:translateY(0);}
.modal-header{
  padding:18px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.03em;}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;transition:color 0.15s;}
.modal-close:hover{color:var(--fg);}
.modal-body{padding:20px 24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

/* FORM */
.field{margin-bottom:14px;}
.field label{display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);
  font-family:'DM Mono',monospace;font-size:12px;padding:9px 12px;outline:none;transition:border-color 0.15s;
}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field select{cursor:pointer;}
.field select option{background:var(--surface);}
.field textarea{resize:vertical;min-height:70px;line-height:1.6;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* TYPE PILLS */
.type-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.type-pill{
  font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:5px 10px;
  border:1px solid var(--border);cursor:pointer;transition:all 0.15s;color:var(--muted);
  background:transparent;font-family:'DM Mono',monospace;
}
.type-pill:hover{border-color:var(--muted);color:var(--fg);}
.type-pill.sel{color:var(--fg);}
.type-pill.sel.spokojny-p{border-color:var(--blue);background:rgba(90,159,232,0.15);color:var(--blue);}
.type-pill.sel.interwaly-p{border-color:var(--yellow);background:rgba(232,200,74,0.15);color:var(--yellow);}
.type-pill.sel.tempo-p{border-color:var(--accent);background:rgba(212,80,26,0.15);color:var(--accent);}
.type-pill.sel.wybieganie-p{border-color:var(--purple);background:rgba(154,111,232,0.15);color:var(--purple);}
.type-pill.sel.regeneracja-p{border-color:var(--green);background:rgba(76,175,120,0.15);color:var(--green);}
.type-pill.sel.odpoczynek-p{border-color:var(--muted);background:rgba(106,101,96,0.15);}
.type-pill.sel.start-p{border-color:var(--green);background:rgba(61,184,112,0.15);color:var(--green);}

/* NOTIF */
.notif{
  position:fixed;bottom:24px;right:24px;
  background:var(--green);color:#0a1a0f;
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;
  padding:12px 20px;transform:translateY(80px);opacity:0;transition:all 0.3s;z-index:200;
}
.notif.show{transform:translateY(0);opacity:1;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(22,22,26,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 0 20px;z-index:100;}
.nav-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer;text-decoration:none;}
.nav-lbl{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;}
.nav-it.active .nav-lbl,.nav-it.active svg{color:var(--accent);stroke:var(--accent);}
/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);}
</style>
</head>
<body>
<div class="shell">

<!-- NAV -->
<nav>
  <a href="#" class="nav-logo" id="nav-logo-back">Biega<span>My</span></a>
  <div class="nav-links" style="display:flex;gap:4px;">
    <a href="#" class="nav-link" id="back-link" onclick="goBack()">← Powrót</a>
    <a href="kalendarz.html" class="nav-link active" id="role-label">Kalendarz</a>
  </div>
  <div class="nav-right" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <select class="athlete-select" id="athlete-select" style="display:none;" onchange="onAthleteChange(this.value)">
      <option value="">Wszyscy zawodnicy</option>
    </select>
    <!-- Cele startowe w nav -->
    <div id="nav-goals-wrap" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <div id="nav-goals-list" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
      <button onclick="openGoalModal()" style="background:transparent;border:1px dashed var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:5px 10px;cursor:pointer;white-space:nowrap;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">🏁 + Cel</button>
    </div>
    <button class="btn btn-primary" id="btn-new-training" onclick="openModal(null)">+ Nowy trening</button>
  </div>
</nav>

<!-- TOOLBAR -->
<div class="cal-toolbar">
  <div class="week-nav">
    <button class="week-nav-btn" onclick="changeWeek(-1)">‹</button>
    <div class="week-label" id="week-label">30 Mar — 5 Kwi 2026</div>
    <button class="week-nav-btn" onclick="changeWeek(1)">›</button>
  </div>
  <button class="today-btn" onclick="goToday()">Dziś</button>
  <div class="toolbar-spacer"></div>
  <div class="week-km-badge">Kilometraż tygodnia: <span id="week-total-km">0</span> km</div>
</div>


<!-- GOAL MODAL -->
<div id="goal-modal-bg" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;" onclick="if(event.target===this)closeGoalModal()">
  <div style="background:var(--surface);border:1px solid var(--border);width:380px;max-width:92vw;">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.03em;" id="goal-modal-title">Nowy cel startowy</div>
      <button onclick="closeGoalModal()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;">✕</button>
    </div>
    <div style="padding:20px;">
      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'DM Mono',monospace;">Nazwa startu</label>
        <input id="goal-name" type="text" placeholder="np. Maraton Warszawski 2026" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'DM Mono',monospace;font-size:12px;padding:9px 12px;outline:none;">
      </div>
      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'DM Mono',monospace;">Data startu</label>
        <input id="goal-date" type="date" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'DM Mono',monospace;font-size:12px;padding:9px 12px;outline:none;">
      </div>
      <div style="margin-bottom:4px;" id="goal-athlete-wrap">
        <label style="display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'DM Mono',monospace;">Zawodnik</label>
        <select id="goal-athlete" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'DM Mono',monospace;font-size:12px;padding:9px 12px;outline:none;cursor:pointer;">
          <option value="">— wybierz —</option>
        </select>
      </div>
    </div>
    <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;">
      <button onclick="closeGoalModal()" style="background:transparent;color:var(--muted);border:1px solid var(--border);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:8px 16px;cursor:pointer;">Anuluj</button>
      <button onclick="saveGoal()" style="background:var(--accent);color:var(--fg);border:none;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:8px 16px;cursor:pointer;">Zapisz</button>
    </div>
  </div>
</div>

<!-- LOG MODAL (zawodnik — OCR) -->
<div id="log-modal-bg" style="position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;" onclick="if(event.target===this)closeLogModal()">
  <div style="background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;transform:translateY(20px);transition:transform 0.2s;" id="log-modal-inner">
    <div style="width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;"></div>
    <div style="padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;" id="log-modal-title">Log treningu</div>
      <button onclick="closeLogModal()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;">✕</button>
    </div>
    <div style="padding:0 20px 24px;">
      <!-- Upload screena — NA GÓRZE, główny element -->
      <div id="ocr-upload-area" onclick="document.getElementById('ocr-file').click()" style="border:2px dashed var(--accent);border-radius:14px;padding:24px 16px;text-align:center;cursor:pointer;margin-bottom:16px;transition:all 0.15s;background:rgba(212,80,26,0.04);" onmouseover="this.style.background='rgba(212,80,26,0.08)'" onmouseout="this.style.background='rgba(212,80,26,0.04)'">
        <div style="font-size:32px;margin-bottom:6px;">📱</div>
        <div style="font-size:14px;font-weight:500;color:var(--fg);margin-bottom:4px;">Wgraj screen z Garmin / Strava</div>
        <div style="font-size:10px;color:var(--accent);font-family:'DM Mono',monospace;letter-spacing:0.08em;" id="ocr-file-label">AI odczyta dane automatycznie</div>
      </div>
      <div id="ocr-thumbs" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;"></div>
      <input type="file" id="ocr-file" accept="image/*" multiple style="display:none" onchange="runOCR(this)">
      <div id="ocr-spinner" style="display:none;text-align:center;padding:8px 0 12px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;">⏳ Analizuję screen...</div>

      <!-- Pola do potwierdzenia -->
      <div id="log-confirm-fields">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
          <div>
            <label style="display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-family:'DM Mono',monospace;">Dystans (km)</label>
            <input id="lm-dist" type="number" step="0.01" placeholder="—" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'DM Mono',monospace;font-size:13px;padding:9px 12px;outline:none;border-radius:4px;">
          </div>
          <div>
            <label style="display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-family:'DM Mono',monospace;">Czas</label>
            <input id="lm-time" type="text" placeholder="np. 1:02:30" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'DM Mono',monospace;font-size:13px;padding:9px 12px;outline:none;border-radius:4px;">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
          <div>
            <label style="display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-family:'DM Mono',monospace;">Tempo (min/km)</label>
            <input id="lm-pace" type="text" placeholder="np. 5:10" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'DM Mono',monospace;font-size:13px;padding:9px 12px;outline:none;border-radius:4px;">
          </div>
          <div>
            <label style="display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-family:'DM Mono',monospace;">Tętno śr. (bpm)</label>
            <input id="lm-hr" type="number" placeholder="—" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'DM Mono',monospace;font-size:13px;padding:9px 12px;outline:none;border-radius:4px;">
          </div>
        </div>
        <div style="margin-bottom:10px;">

          <textarea id="lm-comment" placeholder="Jak poszło?" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;outline:none;border-radius:4px;resize:none;height:70px;line-height:1.5;"></textarea>

            <button class="feel-log-btn" data-feel="bad" onclick="selectFeel(this)" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:all 0.15s;">😓<div style="font-size:9px;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace;">Ciężko</div></button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const typeColors = {
  'Bieg spokojny':'spokojny','Interwały':'interwaly','Tempo':'tempo',
  'Wybieganie':'wybieganie','Regeneracja':'regeneracja','Odpoczynek':'odpoczynek','Start':'start'
};

let trainings = {}; // dane z Supabase

const monthNames = ['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Paź','Lis','Gru'];
const dayNames = ['Pn','Wt','Śr','Cz','Pt','Sb','Nd'];

let currentWeekStart = getWeekStart(new Date()); // aktualny tydzień
let editingDate = null;
let editingIndex = null;
let selectedType = 'Bieg spokojny';
let selectedTypeCls = 'spokojny';

// ── WEEK HELPERS ──────────────────────────────────────────────────────────────
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0) ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function dateStr(date) {
  return date.toISOString().split('T')[0];
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const days = Array.from({length:7},(_,i) => addDays(currentWeekStart,i));
  const today = new Date(); today.setHours(0,0,0,0);

  // Week label
  const s = days[0], e = days[6];
  document.getElementById('week-label').textContent =
    `${s.getDate()} ${monthNames[s.getMonth()]} — ${e.getDate()} ${monthNames[e.getMonth()]} ${e.getFullYear()}`;

  // Total km
  let totalKm = 0;
  days.forEach(d => {
    const ts = trainings[dateStr(d)] || [];
    ts.forEach(t => totalKm += (t.dist||0));
  });
  document.getElementById('week-total-km').textContent = totalKm.toFixed(0);

  // Header
  document.getElementById('week-header').innerHTML = days.map(d => {
    const ds = dateStr(d);
    const isToday = d.getTime() === today.getTime();
    const ts = trainings[ds] || [];
    const km = ts.reduce((s,t)=>s+(t.dist||0),0);
    return `<div class="day-header ${isToday?'today':''}">
      <div class="day-name">${dayNames[d.getDay()===0?6:d.getDay()-1]}</div>
      <div class="day-num">${d.getDate()} ${monthNames[d.getMonth()]}</div>
      ${km>0?`<div class="day-total"><span>${km} km</span></div>`:'<div class="day-total">Odpoczynek</div>'}
    </div>`;
  }).join('');

  // Body
  document.getElementById('week-body').innerHTML = days.map(d => {
    const ds = dateStr(d);
    const isToday = d.getTime() === today.getTime();
    const ts = trainings[ds] || [];

    // Sprawdź czy to dzień startu
    const isRaceDay = window._raceDates && window._raceDates.some(r => r.date === ds);

    const raceCard = isRaceDay ? `<div style="background:rgba(61,184,112,0.12);border:1px solid rgba(61,184,112,0.4);border-radius:8px;padding:8px 10px;margin-bottom:4px;">
      <div style="font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--green);font-family:'DM Mono',monospace;margin-bottom:3px;">🏁 CEL STARTOWY</div>
      <div style="font-size:13px;font-weight:500;">${window._raceDates.find(r=>r.date===ds)?.name||'Start'}</div>
    </div>` : '';

    const cards = ts.map((t,i) => {
      const tc = typeColors[t.type] || 'spokojny';
      const statusCls = t.status==='done'?'done':t.status==='missed'?'missed':'';
      const statusLabel = t.status==='done'?'✓ Wykonany':t.status==='missed'?'✗ Nie wykonany':'';

      return `<div class="training-card ${statusCls} ${t.type==='Odpoczynek'?'rest-card':''}"
                   onclick="openModal('${ds}',${i})">
        <button class="card-delete" onclick="deleteTraining(event,'${ds}',${i})">✕</button>
        <div class="card-type ${tc}">${t.type.toUpperCase()}</div>
        ${t.dist>0?`<div class="card-main">${t.dist} km</div>`:'<div class="card-main" style="font-size:16px;color:var(--muted);">—</div>'}
        ${(t.pace||t.hr)?`<div class="card-pace">${t.pace?t.pace+'/km':''} ${t.hr?'· ♥ '+t.hr:''}${t.time?'· '+t.time+' min':''}</div>`:''}
        ${t.desc?`<div class="card-desc">${t.desc}</div>`:''}
        ${statusLabel?`<div class="card-status ${t.status}">${statusLabel}</div>`:''}
        ${t.status!=='done'&&t.type!=='Odpoczynek'?`<button class="card-approve" onclick="approveTraining(event,'${ds}',${i},${JSON.stringify(t._id||null)})">✓ Zatwierdź</button>`:''}
      </div>`;
    }).join('');

    // Miniatury z logów dla tego dnia
    const dayLogs = (window._calLogs && window._calLogs[ds]) || [];
    const logThumbs = dayLogs.filter(l => l.attachment_url).map(l => {
      return l.attachment_url.split(',').map(url =>
        `<img src="${url}" style="width:calc(50% - 2px);max-height:80px;object-fit:cover;border-radius:4px;cursor:pointer;" onclick="window.open('${url}','_blank')" onerror="this.style.display='none'">`
      ).join('');
    }).join('');
    const logThumbsHtml = logThumbs ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;padding:6px;background:rgba(61,184,112,0.05);border:1px solid rgba(61,184,112,0.15);border-radius:6px;">${logThumbs}</div>` : '';

    return `<div class="day-col ${isToday?'today':''}">
      ${raceCard}
      ${cards}
      ${logThumbsHtml}
      <div class="add-training-btn" onclick="openModal('${ds}',null)">+ Dodaj trening</div>
    </div>`;
  }).join('');
}

// ── WEEK NAV ──────────────────────────────────────────────────────────────────
function changeWeek(dir) {
  currentWeekStart = addDays(currentWeekStart, dir*7);
  render();
}
function goToday() {
  currentWeekStart = getWeekStart(new Date());
  render();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(ds, idx) {
  editingDate = ds;
  editingIndex = idx;

  // Reset form
  selectedType = 'Bieg spokojny';
  selectedTypeCls = 'spokojny';
  document.querySelectorAll('.type-pill').forEach(p=>{
    p.className='type-pill';
    if(p.textContent.trim()==='Spokojny') p.className='type-pill sel spokojny-p';
  });
  document.getElementById('f-dist').value='';
  document.getElementById('f-time').value='';
  document.getElementById('f-pace').value='';
  document.getElementById('f-hr').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-status').value='planned';
  document.getElementById('log-fields').style.display='none';
  const fComment = document.getElementById('f-comment');
  const fCommentWrap = document.getElementById('f-comment-wrap');
  if(fComment) fComment.value='';
  if(fCommentWrap) fCommentWrap.style.display = _urlRole === 'athlete' ? 'block' : 'none';
  const fDescEl = document.getElementById('f-desc');
  if(fDescEl) fDescEl.readOnly = _urlRole === 'athlete';
  if(fDescEl && _urlRole === 'athlete') { fDescEl.style.opacity='0.6'; fDescEl.style.cursor='default'; }
  const fLogDist = document.getElementById('f-log-dist');
  const fLogPace = document.getElementById('f-log-pace');
  const fLogStrava = document.getElementById('f-log-strava');
  const fLogFiles = document.getElementById('f-log-files');
  const fLogLabel = document.getElementById('f-log-files-label');
  if(fLogDist) fLogDist.value='';
  if(fLogPace) fLogPace.value='';
  if(fLogStrava) fLogStrava.value='';
  if(fLogFiles) fLogFiles.value='';
  if(fLogLabel) fLogLabel.textContent='📎 Dodaj zdjęcia';

  if(ds) {
    const d = new Date(ds + 'T12:00:00');
    document.getElementById('modal-date-label').textContent =
      d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const fp = document.getElementById('f-date-picker');
    if(fp){ fp.style.display='none'; fp.value=''; }
  } else {
    document.getElementById('modal-date-label').textContent = '';
    const today = new Date().toISOString().split('T')[0];
    editingDate = today;
    const fp = document.getElementById('f-date-picker');
    if(fp){ fp.style.display='block'; fp.value=today; }
    const d = new Date(today + 'T12:00:00');
    document.getElementById('modal-date-label').textContent =
      d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }

  if(idx !== null && ds && trainings[ds] && trainings[ds][idx]) {
    const t = trainings[ds][idx];
    document.getElementById('modal-title').textContent = 'Edytuj trening';
    selectedType = t.type;
    selectedTypeCls = typeColors[t.type] || 'spokojny';
    document.querySelectorAll('.type-pill').forEach(p=>{
      p.className='type-pill';
      const map={Spokojny:'spokojny-p',Interwały:'interwaly-p',Tempo:'tempo-p',Wybieganie:'wybieganie-p',Regeneracja:'regeneracja-p',Odpoczynek:'odpoczynek-p','🏁 Start':'start-p'};
      if(p.textContent.trim()===t.type.replace('Bieg spokojny','Spokojny').replace('Interwały','Interwały')) {
        p.className=`type-pill sel ${map[p.textContent.trim()]||'spokojny-p'}`;
      }
    });
    document.getElementById('f-dist').value = t.dist || t.distance_km || '';
    document.getElementById('f-time').value = t.time || t.duration_min || '';
    document.getElementById('f-pace').value = t.pace || '';
    document.getElementById('f-hr').value = t.hr || t.heart_rate || '';
    document.getElementById('f-desc').value = t.desc || t.description || '';
    document.getElementById('f-status').value = t.status||'planned';
  } else {
    document.getElementById('modal-title').textContent = 'Nowy trening';
  }

  document.getElementById('modal-bg').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}
function closeModalOnBg(e) {
  if(e.target===document.getElementById('modal-bg')) closeModal();
}

function selType(el, type, cls) {
  document.querySelectorAll('.type-pill').forEach(p=>p.className='type-pill');
  el.className = `type-pill sel ${cls}-p`;
  selectedType = type;
  selectedTypeCls = cls;
}

async function saveTraining() {
  const dist = parseFloat(document.getElementById('f-dist').value)||0;
  const time = parseInt(document.getElementById('f-time').value)||0;
  const pace = document.getElementById('f-pace').value;
  const hr = document.getElementById('f-hr').value;
  const desc = document.getElementById('f-desc').value;
  const status = document.getElementById('f-status').value;

  if(!editingDate) { notify('Brak daty'); return; }

  const { data: { session } } = await _sbKal.auth.getSession();

  // ── TRENER: zapisz/zaktualizuj w Supabase ───────────────────────
  if (session && _urlRole === 'coach') {
    const athleteId = window._calSelectedAthleteId || null;
    const existingTraining = editingIndex !== null && trainings[editingDate] && trainings[editingDate][editingIndex];
    const dbId = existingTraining?._id || null;

    if (dbId) {
      // UPDATE istniejącego
      await _sbKal.from('trainings').update({
        type: selectedType, distance_km: dist||null, duration_min: time||null,
        pace: pace||null, heart_rate: hr||null, description: desc||null, status
      }).eq('id', dbId);
    } else {
      // INSERT nowego
      await _sbKal.from('trainings').insert({
        coach_id: session.user.id, athlete_id: athleteId, date: editingDate,
        type: selectedType, distance_km: dist||null, duration_min: time||null,
        pace: pace||null, heart_rate: hr||null, description: desc||null, status
      });
    }
    closeModal();
    await loadTrainingsFromDB();
    notify(dbId ? 'Trening zaktualizowany ✓' : `Dodano: ${selectedType}${dist>0?' · '+dist+' km':''}`);
    return;
  }

  // ── ZAWODNIK: lokalne + opcjonalnie log ──────────────────────────
  const t = {type:selectedType,dist,time,pace,hr,desc,status};
  if(!trainings[editingDate]) trainings[editingDate]=[];
  if(editingIndex!==null && editingIndex>=0) {
    trainings[editingDate][editingIndex] = t;
    notify('Trening zaktualizowany ✓');
  } else {
    trainings[editingDate].push(t);
    notify(`Dodano: ${selectedType}${dist>0?' · '+dist+' km':''}`);
  }

  // Jeśli status=done i jesteśmy w widoku zawodnika — zapisz log do Supabase
  if (status === 'done' && _urlRole === 'athlete' && typeof _sbKal !== 'undefined') {
    const { data: { session } } = await _sbKal.auth.getSession();
    if (session) {
      const { data: ath } = await _sbKal.from('athletes').select('id').eq('user_id', session.user.id).maybeSingle();
      if (ath) {
        // Upload zdjęć
        const logFiles = document.getElementById('f-log-files');
        const logStrava = document.getElementById('f-log-strava')?.value || null;
        const logDist = parseFloat(document.getElementById('f-log-dist')?.value) || dist || null;
        const logPace = document.getElementById('f-log-pace')?.value || pace || null;
        let attachmentUrl = null;

        if (logFiles && logFiles.files.length > 0) {
          const urls = [];
          const base = Date.now();
          for (let fi = 0; fi < logFiles.files.length; fi++) {
            const file = logFiles.files[fi];
            const path = ath.id + '/log_' + base + '_' + fi + '_' + Math.random().toString(36).slice(2) + '.' + file.name.split('.').pop();
            const { error: upErr } = await _sbKal.storage.from('training-screenshots').upload(path, file, {upsert:true, contentType: file.type});
            if (!upErr) {
              const { data: urlData } = _sbKal.storage.from('training-screenshots').getPublicUrl(path);
              urls.push(urlData.publicUrl);
            }
          }
          if (urls.length) attachmentUrl = urls.join(',');
        }

        const logComment = document.getElementById('f-comment')?.value || null;
        await _sbKal.from('training_logs').insert({
          athlete_id: ath.id,
          training_type: selectedType,
          distance_km: logDist,
          pace: logPace,
          strava_link: logStrava,
          attachment_url: attachmentUrl,
          comment: logComment,
          logged_at: new Date().toISOString()
        });
        notify('Log zapisany ✓');
      }
    }
  }

  closeModal();
  render();
}

async function approveTraining(e, ds, idx, dbId) {
  e.stopPropagation();
  if (!trainings[ds] || !trainings[ds][idx]) return;
  trainings[ds][idx].status = 'done';
  
  // Zapisz do Supabase jeśli mamy id
  if (dbId && typeof _sbKal !== 'undefined') {
    await _sbKal.from('trainings').update({status:'done'}).eq('id', dbId);
  }
  
  render();

// ── LOAD TRAININGS FROM DB ────────────────────────────────────────
async function loadTrainingsFromDB() {
  const { data: { session } } = await _sbKal.auth.getSession();
  if (!session) return;

  let query = _sbKal.from('trainings').select('*');

  if (_urlRole === 'athlete') {
    // Zawodnik — tylko swoje treningi
    const { data: ath } = await _sbKal.from('athletes')
      .select('id').eq('user_id', session.user.id).maybeSingle();
    if (!ath) return;
    query = query.eq('athlete_id', ath.id);
  } else {
    // Trener — treningi wybranego lub wszystkich zawodników
    if (window._calSelectedAthleteId) {
      query = query.eq('athlete_id', window._calSelectedAthleteId);
    } else {
      query = query.eq('coach_id', session.user.id);
    }
  }

  const { data, error } = await query.order('date');
  if (error || !data) return;

  // Wyczyść stare dane i załaduj świeże z bazy
  trainings = {};
  data.forEach(t => {
    const ds = t.date;
    if (!trainings[ds]) trainings[ds] = [];
    // Sprawdź czy już nie ma tego treningu
    const exists = trainings[ds].some(x => x._id === t.id);
    if (!exists) {
      trainings[ds].push({
        _id: t.id,
        type: t.type || 'Spokojny',
        dist: parseFloat(t.distance_km) || 0,
        time: t.duration_min || 0,
        pace: t.pace || '',
        hr: t.heart_rate || '',
        desc: t.description || '',
        status: t.status || 'planned'
      });
    }
  });

  // Załaduj logi dla tych samych zawodników
  let logsQuery = _sbKal.from('training_logs').select('athlete_id, logged_at, attachment_url, distance_km, pace, feel').order('logged_at');
  if (_urlRole === 'athlete') {
    const { data: ath2 } = await _sbKal.from('athletes').select('id').eq('user_id', session.user.id).maybeSingle();
    if (ath2) logsQuery = logsQuery.eq('athlete_id', ath2.id);
  } else if (window._calSelectedAthleteId) {
    logsQuery = logsQuery.eq('athlete_id', window._calSelectedAthleteId);
  }
  const { data: logsData } = await logsQuery;
  window._calLogs = {};
  (logsData || []).forEach(l => {
    const ds = l.logged_at ? l.logged_at.split('T')[0] : null;
    if (!ds) return;
    if (!window._calLogs[ds]) window._calLogs[ds] = [];
    window._calLogs[ds].push(l);
  });

  render();
}

function renderGoals() {
  const list = document.getElementById('nav-goals-list');
  if (!list) return;
  if (!window._goals.length) {
    list.innerHTML = '<span style="font-size:10px;color:var(--muted2);font-family:DM Mono,monospace;letter-spacing:0.05em;">Brak celów</span>';
    return;
  }
  list.innerHTML = window._goals.map(g => {
    const d = new Date(g.date + 'T12:00:00');
    const now = new Date();
    const days = Math.round((d - now) / 86400000);
    const daysStr = days > 0 ? days + 'd' : days === 0 ? 'Dziś!' : 'po terminie';
    const isClose = days >= 0 && days <= 21;
    const isVeryClose = days >= 0 && days <= 7;
    const borderColor = isVeryClose ? 'rgba(232,184,64,0.8)' : isClose ? 'rgba(61,184,112,0.7)' : 'rgba(61,184,112,0.3)';
    const bg = isVeryClose ? 'rgba(232,184,64,0.12)' : 'rgba(61,184,112,0.08)';
    const dayColor = isVeryClose ? 'var(--yellow)' : isClose ? 'var(--green)' : 'var(--muted)';
    const athleteStr = (_urlRole === 'coach' && g.athlete_name) ? `<span style="font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${g.athlete_name.split(' ')[0]}</span>` : '';
    return `<div style="display:inline-flex;align-items:center;gap:6px;background:${bg};border:1px solid ${borderColor};border-radius:6px;padding:6px 10px;cursor:pointer;transition:all 0.15s;" onclick="openGoalModal('${g.id}')" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='${borderColor}'">
      <span style="font-size:13px;">🏁</span>
      ${athleteStr}
      <span style="font-size:11px;font-weight:600;color:var(--fg);">${g.name}</span>
      <span style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;">${d.toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}</span>
      <span style="font-size:10px;font-weight:600;color:${dayColor};font-family:'DM Mono',monospace;background:${dayColor.replace('var(--','rgba(').replace(')',',0.12)')};padding:1px 5px;border-radius:3px;">${daysStr}</span>
    </div>`;
  }).join('');
}

async function runOCR(input) {
  if (!input.files.length) return;
  const files = input.files;
  const file = files[0];
  // Miniatury
  const thumbsEl = document.getElementById('ocr-thumbs');
  thumbsEl.innerHTML = '';
  Array.from(files).forEach(f => {
    const url = URL.createObjectURL(f);
    thumbsEl.innerHTML += `<img src="${url}" style="width:calc(50% - 3px);max-height:120px;object-fit:cover;border-radius:8px;">`;
  });
  document.getElementById('ocr-file-label').textContent = files.length === 1 ? '✓ ' + file.name : '✓ ' + files.length + ' pliki';
  document.getElementById('ocr-upload-area').style.background = 'rgba(61,184,112,0.08)';
  document.getElementById('ocr-upload-area').style.borderColor = 'var(--green)';
  document.getElementById('ocr-spinner').style.display = 'block';
  // Konwertuj do base64
  const base64 = await new Promise(res => {
    const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(file);
  });
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 300,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: file.type || 'image/jpeg', data: base64 } },
          { type: 'text', text: 'To jest screen z aplikacji Garmin, Strava lub podobnej. Odczytaj dane treningowe i zwróć TYLKO JSON bez żadnego opisu ani backtick. Format: {"distance_km": liczba_lub_null, "duration": "H:MM:SS_lub_null", "pace": "M:SS_lub_null", "heart_rate": liczba_lub_null}' }
        ]}]
      })
    });
    const json = await resp.json();
    const text = (json.content?.[0]?.text || '').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);
    if (parsed.distance_km) document.getElementById('lm-dist').value = parsed.distance_km;
    if (parsed.duration) document.getElementById('lm-time').value = parsed.duration;
    if (parsed.pace) document.getElementById('lm-pace').value = parsed.pace;
    if (parsed.heart_rate) document.getElementById('lm-hr').value = parsed.heart_rate;
    notify('Dane odczytane ✓ — sprawdź i potwierdź');
  } catch(err) {
    notify('Nie udało się odczytać — uzupełnij ręcznie');
  }
  document.getElementById('ocr-spinner').style.display = 'none';
}

  const { data: ath } = await _sbKal.from('athletes').select('id').eq('user_id', session.user.id).maybeSingle();

  await _sbKal.from('training_logs').insert({
    athlete_id: ath.id,

}
