<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MAKIETA — foto-kółka vs 3D+podpis</title>
<link rel="stylesheet" href="theme.css">
<script>try{var t=localStorage.getItem("bm_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;padding:18px 0 80px;}
  .wrap{max-width:420px;margin:0 auto;padding:0 16px;}
  .note{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:0.05em;margin-bottom:16px;line-height:1.6;border:1px dashed var(--border);border-radius:10px;padding:10px 12px;}
  .hd{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);font-family:'DM Mono',monospace;font-weight:700;margin:24px 0 12px;display:flex;align-items:center;gap:8px;}
  .hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--accent-rgb),0.5),transparent);}

  /* ── WARIANT 1: foto-kółka (wzór profilu) ── */
  .fk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-items:center;}
  .fk{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;-webkit-tap-highlight-color:transparent;}
  .fk img{width:80px;height:80px;object-fit:cover;border-radius:50%;box-shadow:0 2px 12px rgba(var(--accent-rgb),0.4);transition:transform 0.18s;}
  .fk:active img{transform:scale(0.94);}
  .fk .lbl{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg2);font-family:'DM Mono',monospace;}
  .fk.nolbl .lbl{display:none;}

  /* ── WARIANT 2: 3D ikona + podpis biały (A2) ── */
  .td-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .td{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform var(--dur-fast,0.18s) var(--ease-out,ease),box-shadow var(--dur-fast,0.18s),border-color var(--dur-fast,0.18s);-webkit-tap-highlight-color:transparent;}
  .td:hover{transform:translateY(-2px);border-color:rgba(var(--accent-rgb),0.5);box-shadow:0 8px 22px rgba(0,0,0,0.4),0 0 16px var(--glow-o2,rgba(232,86,30,0.14));}
  .td:active{transform:scale(0.97);}
  .td img{width:46px;height:46px;object-fit:contain;}
  .td .lbl{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg);font-weight:700;font-family:'DM Mono',monospace;text-align:center;line-height:1.2;}
</style>
</head>
<body>
<div class="wrap">
  <div class="note">⚙ MAKIETA (plik testowy, NIE home). Porównaj 2 style tych samych 5 sekcji. Motyw: localStorage.bm_theme='ocean'/forest/grape/gold + odśwież.</div>

  <div class="hd">Wariant 1 — foto-kółka (wzór profilu, BEZ podpisów)</div>
  <div class="fk-grid nolbl-grid" id="g-fk-nolbl"></div>

  <div class="hd">Wariant 1b — foto-kółka + podpis</div>
  <div class="fk-grid" id="g-fk"></div>

  <div class="hd">Wariant 2 — 3D ikona + podpis biały (A2)</div>
  <div class="td-grid" id="g-td"></div>
</div>
<script>
  var BASE='https://filipjanczak1989-png.github.io/biegamy-assets/';
  var TILES=[
    {photo:'tile-cwiczenia.webp', icon:'icon-ex-section.webp',   lbl:'Ćwiczenia'},
    {photo:'tile-wyzwania.webp',  icon:'icon-radio-trophy.webp', lbl:'Wyzwania'},
    {photo:'tile-odznaki.webp',   icon:'icon-nav-medal.webp',    lbl:'Odznaki'},
    {photo:'tile-races.webp',     icon:'icon-nav-flag.webp',     lbl:'Zawody'},
    {photo:'tile-czat.webp',      icon:'icon-nav-people.webp',   lbl:'Społeczność'}
  ];
  function fk(nolbl){return TILES.map(function(t){return '<button class="fk'+(nolbl?' nolbl':'')+'"><img src="'+BASE+t.photo+'" alt=""><span class="lbl">'+t.lbl+'</span></button>';}).join('');}
  function td(){return TILES.map(function(t){return '<button class="td"><img src="'+BASE+t.icon+'" alt=""><span class="lbl">'+t.lbl+'</span></button>';}).join('');}
  document.getElementById('g-fk-nolbl').innerHTML=fk(true);
  document.getElementById('g-fk').innerHTML=fk(false);
  document.getElementById('g-td').innerHTML=td();
</script>
</body>
</html>
