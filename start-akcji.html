<!--
  START AKCJI (projekt F, spec v3 pkt 1) — guzik, który w dniu startu (sobota 7.11) naciska Fabianek na telefonie Filipa.
  Jeden ekran, bez nawigacji, bez niczego do przypadkowego tapnięcia. Działa wyłącznie dla konta z listy
  akcja_startujacy — sprawdza to RPC (auth.uid()), ta strona tylko nie pokazuje guzika komuś innemu.
  Stany: ladowanie → rozbrojony (przed 06:00 dnia startu) / uzbrojony → nacisniety (iskry) → zapisane (· wysyłam… / · zapisane ✓).
  Przytrzymanie 1 s z pierścieniem (dziecko widzi, że „ładuje"), bez „Czy na pewno?".
  BRAK ZASIĘGU POD DOMEM: czas naciśnięcia zapisany lokalnie (localStorage + IndexedDB, try/catch), wysyłka co 5 s
  i przy zdarzeniu `online`; serwer przyjmuje czas klienta tylko w oknie i ≤ teraz + 2 min (akcja_start).
  PRÓBA: ?proba=1 → akcja 'proba' (guzik zawsze uzbrojony, liczy tylko konto testowe) + „Resetuj próbę".
  ŚCIEŻKA FABIANKA: ?proba=1&sciezka=1, tylko konto trenera → panel: „Od zera”, suwaki km i kwoty, firmy testowe, linki do kolejnych ekranów. Rysunek na próbie przychodzi osobną funkcją, na 15 minut.
-->
<style>
  :root { --tlo: #0b0a0f; --fg: #f0ede8; --muted: #8a8798; --akcent: #e8561e; --akcent2: #ff8a3d; --szary: #2a2832; }
  html, body { margin: 0; height: 100%; background: var(--tlo); color: var(--fg); overflow: hidden;
    font-family: Inter, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; }
  #proba-znak { position: absolute; top: calc(env(safe-area-inset-top) + 14px); left: 50%; transform: translateX(-50%);
    font: 600 11px/1 Inter, sans-serif; letter-spacing: .2em; color: var(--akcent2); border: 1px solid var(--akcent2);
    border-radius: 999px; padding: 6px 12px; }
  #krag { position: relative; width: min(70vw, 70vh, 420px); aspect-ratio: 1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; background: var(--szary);
    transition: background .4s ease, transform .2s ease, box-shadow .4s ease; }
  /* logo assets/ui/logo-b-biale-alfa.webp (Filip 2.11 18:08, z tools/logo-guzika.py): B całe białe z cieniem, pierścień biały 40% — biel i cień w pliku, bez filtrów */
  #krag img { width: 56%; opacity: .3; transition: opacity .4s ease; pointer-events: none; }
  /* ODSŁONA: rysunek przychodzi dopiero w odpowiedzi na naciśnięcie (akcja_start → akcja_licznik), wcześniej przeglądarka nie ma do niego adresu (blizna-155).
     Rozbłysk od razu, guzik czeka szybko pulsując, a otwiera się, gdy rysunek jest już zdekodowany: kamera nie zobaczy pustego kółka ani ładowania obrazka. */
  #krag.czeka, #krag.otwarty { opacity: 1 !important; transform: none !important; display: flex !important; }
  main[data-stan] #krag.czeka { background: radial-gradient(circle at 50% 40%, var(--akcent2), var(--akcent) 70%); box-shadow: 0 0 90px rgba(255, 138, 61, .7); animation: laduje .5s ease-in-out infinite; }
  main[data-stan] #krag.czeka > img { opacity: 1; }
  main[data-stan] #krag.otwarty { background: radial-gradient(circle at 50% 42%, #fff4e6 0, #ffc98a 46%, var(--akcent2) 78%, var(--akcent) 100%); box-shadow: 0 0 70px rgba(255, 138, 61, .55); animation: none; }
  #krag.otwarty > img:not(#postac), #krag.otwarty #pierscien { display: none; }
  .polowa { position: absolute; inset: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, var(--akcent2), var(--akcent) 70%); pointer-events: none; z-index: 3; }
  #krag .polowa img { opacity: 1; }
  .polowa--l { clip-path: inset(0 50% 0 0); animation: otworz-l .72s cubic-bezier(.7, 0, .25, 1) forwards; }
  .polowa--p { clip-path: inset(0 0 0 50%); animation: otworz-p .72s cubic-bezier(.7, 0, .25, 1) forwards; }
  #krag img#postac { position: absolute; left: -11%; bottom: 3%; width: 122%; max-width: none; opacity: 1; transform-origin: 50% 96%; z-index: 2; }
  #krag.odslania img#postac { animation: pojaw .66s cubic-bezier(.2, 1.5, .4, 1) .16s both, macha 1.3s ease-in-out .82s infinite; }
  #krag.otwarty:not(.odslania) img#postac { animation: macha 1.6s ease-in-out infinite; }
  #blysk { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 42%, #fff 0, rgba(255, 241, 224, .92) 26%, rgba(255, 179, 71, .35) 52%, transparent 74%); z-index: 4; }
  #blysk.teraz { animation: blysk .6s ease-out; }
  @keyframes laduje { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes otworz-l { to { transform: translateX(-74%) rotate(-16deg); opacity: 0; } }
  @keyframes otworz-p { to { transform: translateX(74%) rotate(16deg); opacity: 0; } }
  @keyframes pojaw { from { transform: scale(.3) translateY(26%); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  @keyframes macha { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.8deg) translateY(-1.5%); } }
  @keyframes blysk { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { main[data-stan] #krag.czeka, #krag.odslania img#postac, #krag.otwarty:not(.odslania) img#postac, .polowa, #blysk.teraz { animation: none; } .polowa { display: none; } }
  #pierscien { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); transform: rotate(-90deg); pointer-events: none; }
  #pierscien circle { fill: none; stroke-width: 3; }
  #pierscien .tlo-p { stroke: transparent; }
  #pierscien #postep { stroke: var(--fg); stroke-linecap: round; stroke-dasharray: 314.16; stroke-dashoffset: 314.16; }
  #slowo { font: 400 clamp(40px, 13vw, 76px)/1 'Bebas Neue', Inter, sans-serif; letter-spacing: .06em; text-align: center; min-height: 1em; }
  #napis { font-size: 17px; line-height: 1.4; text-align: center; max-width: 32ch; min-height: 1.4em; }
  #licznik { font: 400 26px/1 'Bebas Neue', Inter, sans-serif; letter-spacing: .05em; color: var(--muted); min-height: 1em; }
  #status { font-size: 13px; color: var(--muted); min-height: 1.2em; text-align: center; }
  #iskry { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #reset { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 18px); background: transparent; color: var(--muted);
    border: 1px solid var(--szary); border-radius: 12px; padding: 10px 16px; font: 500 12px Inter, sans-serif; letter-spacing: .06em; }
  /* „⋯" (Filip 2.11 19:00): po starcie — podmiana linku zbiórki (zbiórka kończy się 27.11) bez wdrożenia; RPC akcja_url_zbiorki */
  #wiecej { position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 14px; background: transparent; color: var(--muted);
    border: 1px solid var(--szary); border-radius: 999px; width: 38px; height: 38px; font: 600 18px/1 Inter, sans-serif; }
  #panel { position: absolute; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 56px); background: #15141b; border: 1px solid var(--szary);
    border-radius: 14px; padding: 14px; box-sizing: border-box; }
  #panel label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #panel input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 1px solid var(--szary); background: var(--tlo); color: var(--fg); font: 14px Inter, sans-serif; }
  #panel button { margin-top: 10px; background: var(--akcent); color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; font: 600 13px Inter, sans-serif; }
  #panel .wynik { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 1.2em; word-break: break-all; }
  [hidden] { display: none !important; }
  #sciezka-guzik { position: absolute; left: 14px; top: calc(env(safe-area-inset-top) + 10px); background: transparent; color: var(--akcent2); border: 1px solid var(--akcent2); border-radius: 999px; padding: 9px 14px; font: 600 12px Inter, sans-serif; }
  #sciezka { position: fixed; left: 0; right: 0; bottom: 0; max-height: 78vh; overflow-y: auto; touch-action: pan-y; user-select: text; -webkit-user-select: text; background: #15141b; border-top: 1px solid var(--szary); border-radius: 18px 18px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); box-sizing: border-box; z-index: 8; font-size: 13px; }
  #sciezka h2 { margin: 0 0 4px; font: 400 22px/1 'Bebas Neue', Inter, sans-serif; letter-spacing: .05em; }
  #sciezka .sz-stan { color: var(--muted); font-size: 12px; min-height: 1.3em; margin-bottom: 10px; }
  #sciezka button { background: var(--szary); color: var(--fg); border: 0; border-radius: 10px; padding: 11px 14px; font: 600 13px Inter, sans-serif; margin: 4px 6px 4px 0; }
  #sciezka button.sz-mocny { background: var(--akcent); color: #fff; }
  #sciezka label { display: block; margin-top: 12px; color: var(--muted); font-size: 12px; }
  #sciezka input[type=range] { display: block; width: 100%; margin: 8px 0 0; touch-action: auto; accent-color: var(--akcent2); }
  #sciezka .sz-wart { color: var(--fg); font-weight: 600; }
  #sciezka a { display: inline-block; color: var(--akcent2); margin: 8px 12px 0 0; font-weight: 600; text-decoration: none; }
  #zagraj-szef { display: block; width: min(86vw, 380px); min-height: 76px; margin: 22px auto 0; background: var(--akcent); color: #fff; border: 0; border-radius: 18px; padding: 18px 24px; font: 800 26px Inter, sans-serif; cursor: pointer; touch-action: manipulation; }
  #trzymaj-dotarcie { position: relative; width: 100%; margin-top: 14px; overflow: hidden; background: var(--szary); color: var(--fg); border: 0; border-radius: 10px; padding: 12px; font: 600 13px Inter, sans-serif; touch-action: none; }
  #trzymaj-dotarcie i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--akcent); opacity: .55; pointer-events: none; }
  #trzymaj-dotarcie span { position: relative; }

  main[data-stan="uzbrojony"] #krag { background: radial-gradient(circle at 50% 40%, var(--akcent2), var(--akcent) 70%);
    box-shadow: 0 0 60px rgba(232, 86, 30, .45); animation: puls 2.4s ease-in-out infinite; }
  main[data-stan="uzbrojony"] #krag img { opacity: 1; }
  main[data-stan="uzbrojony"] #krag.trzymam { transform: scale(.96); animation: none; }
  main[data-stan="nacisniety"] #krag, main[data-stan="zapisane"] #krag { background: transparent; box-shadow: none; transform: scale(.5); opacity: 0;
    transition: transform .5s ease, opacity .5s ease; }
  main[data-stan="zapisane"] #krag { display: none; }
  main[data-stan="zapisane"] #slowo { font-size: clamp(30px, 9vw, 52px); }
  @keyframes puls { 0%, 100% { transform: scale(1); box-shadow: 0 0 50px rgba(232,86,30,.35); } 50% { transform: scale(1.025); box-shadow: 0 0 80px rgba(232,86,30,.55); } }
  @media (prefers-reduced-motion: reduce) { main[data-stan="uzbrojony"] #krag { animation: none; } }
  #guzik-dzwiek { display: none; position: absolute; top: calc(58px + env(safe-area-inset-top)); right: 14px; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 50%; background: rgba(16,19,36,.72); cursor: pointer; align-items: center; justify-content: center; z-index: 5; touch-action: manipulation; }
  #guzik-dzwiek svg { width: 32px; height: 32px; color: #fff; }
  main[data-stan="uzbrojony"] #guzik-dzwiek, main[data-stan="nacisniety"] #guzik-dzwiek, main[data-stan="zapisane"] #guzik-dzwiek { display: flex; }
  #funkcja-proby { font-size: 12px; line-height: 1.35; color: var(--muted); text-align: center; max-width: 34ch; }
  #funkcja-proby:empty { display: none; }
  /* Niski ekran telefonu: ekran nie przewija się, więc przycisk Szefa musi się zmieścić razem z rysunkiem. */
  @media (max-height: 760px) {
    main[data-stan="zapisane"] { gap: 10px; }
    main[data-stan="zapisane"] #krag.otwarty { width: min(62vw, 34vh); }
    main[data-stan="zapisane"] #slowo { font-size: clamp(24px, 7.5vw, 38px); }
    #zagraj-szef { margin-top: 4px; min-height: 64px; padding: 12px 20px; }
  }
</style>
</head>
<body>
<main id="ekran" data-stan="ladowanie">
  <div id="proba-znak" hidden>PRÓBA</div>
  <div id="krag" aria-label="Start akcji — przytrzymaj">
    <svg id="pierscien" viewBox="0 0 104 104" aria-hidden="true"><circle class="tlo-p" cx="52" cy="52" r="50"/><circle id="postep" cx="52" cy="52" r="50"/></svg>
    <img src="assets/ui/logo-b-biale-alfa.webp" alt="">
  </div>
  <div id="slowo"></div>
  <div id="napis"></div>
  <div id="licznik"></div>
  <div id="status"></div>
  <div id="premiera-miejsce"></div>
  <div id="funkcja-proby"></div>
  <button id="reset" hidden>Resetuj próbę</button>
  <button id="wiecej" hidden aria-label="Więcej" aria-expanded="false">⋯</button>
  <div id="panel" hidden>
    <label for="url-zbiorki">Link zbiórki (https://www.siepomaga.pl/…)</label>
    <input id="url-zbiorki" type="url" inputmode="url" autocomplete="off" placeholder="https://www.siepomaga.pl/…">
    <button id="zapisz-url" type="button">Zapisz link zbiórki</button>
    <div class="wynik" id="url-wynik"></div>
    <div id="dotarcie-miejsce"></div>
  </div>
</main>
<div id="blysk" aria-hidden="true"></div>
<canvas id="iskry" aria-hidden="true"></canvas>
<script>
(function () {
  'use strict';
  /* Okno guzika = akcje.okno_startu_od/do (dzień startu 06:00–23:59:59 Europe/Warsaw) — z JEDNEJ stałej w js/akcja-cytaty.mjs
     (DZIEN_STARTU = akcje.start). Serwer i tak pilnuje okna — tu tylko, żeby przed czasem nie świecić guzikiem (blizna-96). */
  var AKC = window.BM_AKCJA_CYTATY || {};
  var OKNO_OD = AKC.OKNO_STARTU ? AKC.OKNO_STARTU.od : NaN;
  var OKNO_DO = AKC.OKNO_STARTU ? AKC.OKNO_STARTU.do : NaN;
  var DATA_SLOWNIE = AKC.DATA_SLOWNIE || '';
  var PROBA = new URLSearchParams(location.search).get('proba') === '1';
  var SCIEZKA = PROBA && new URLSearchParams(location.search).get('sciezka') === '1';
  var SLUG = PROBA ? 'proba' : 'dla-fabianka';
  var KLUCZ = 'bm_akcja_nacisk_' + SLUG, KLUCZ_MOZE = 'bm_akcja_moze_' + SLUG;
  var PRZYTRZYMAJ_MS = 1000, PONOW_MS = 5000, OBWOD = 314.16;
  /* „Dotarliśmy" (spec v3 pkt 3): RPC akcja_dotarlismy z migracją 20261102_akcja_dzien5 — przełącznik włączany razem z nią. */
  var DOTARCIE_GOTOWE = true;   // 2.11: migracja 20261102_akcja_dzien5 NA PROD (OK Filipa)
  var $ = function (id) { return document.getElementById(id); };
  var ekran = $('ekran'), krag = $('krag'), postep = $('postep');
  var stan = 'ladowanie', nacisnietoO = 0, trzymanieOd = 0, rafId = 0, wysylam = false, ponowTimer = 0, uzbrojTimer = 0, blokada = null;

  var godzina = function (iso) {
    try { return new Intl.DateTimeFormat('pl-PL', { timeZone: 'Europe/Warsaw', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)); }
    catch (e) { return ''; }
  };
  var km = function (x) { return Number(x || 0).toLocaleString('pl-PL', { maximumFractionDigits: 0 }); };

  function ustaw(nowy, o) {
    o = o || {};
    stan = nowy; ekran.dataset.stan = nowy;
    $('slowo').textContent = o.slowo || '';
    $('napis').textContent = o.napis || '';
    $('licznik').textContent = o.licznik || '';
    $('status').textContent = o.status || '';
    $('reset').hidden = !(PROBA && !SCIEZKA && nowy === 'zapisane');
    if (nowy === 'uzbrojony') { wakeLock(); muzykaUzbrojona(); }
  }

  /* MUZYKA GUZIKA (Filip 6.11): puls i fanfara pobierane od razu, do własnego cache, żeby wybuch nie czekał na sieć. Grają po dotknięciu głośnika, bo telefon inaczej nie pozwoli: trzymany palec dźwięku nie odblokowuje. Bez głośnika guzik działa cicho, jak dotąd. */
  var MUZ = window.BM_MUZYKA, PRZYSPIESZENIE_PULSU = 1.5, dzwiekGuzika = false, muzykaPobrana = false, fanfaraMinela = false, adresPiosenki = '', piosenkaGra = false, ostatniLicznik = null;
  function muzykaUzbrojona() {
    if (!MUZ) return;
    fanfaraMinela = false; adresPiosenki = ''; piosenkaGra = false; ostatniLicznik = null;
    if (!muzykaPobrana) { muzykaPobrana = true; MUZ.przygotuj([MUZ.PLIKI.puls, MUZ.PLIKI.fanfara], true); }
    if (dzwiekGuzika) MUZ.graj(MUZ.PLIKI.puls, { petla: true, glos: 0.85 });
  }
  /* Piosenka zaraz po fanfarze. Adres dopiero po naciśnięciu: próba bierze go z funkcji, prawdziwa akcja z licznika, a przed startem nikt go nie zna. */
  function szykujPiosenke(d) {
    if (!MUZ || !dzwiekGuzika || adresPiosenki) return;
    var zrodlo = PROBA ? (AKC.wizerunekProby ? AKC.wizerunekProby(window.sb) : Promise.resolve(null)) : Promise.resolve(d);
    zrodlo.then(function (x) {
      var a = MUZ.adresyZLicznika(x && x.muzyka).premiera;
      if (!a || !dzwiekGuzika) return;
      adresPiosenki = a; MUZ.bufor(a); grajPiosenke();
    });
  }
  function grajPiosenke() {
    if (!MUZ || !dzwiekGuzika || !fanfaraMinela || !adresPiosenki || piosenkaGra) return;
    piosenkaGra = true; MUZ.graj(adresPiosenki, { glos: 1, przenikanie: 0.05 });
  }
  /* Głośnik powstaje tu, nie w HTML: bez modułu muzyki nie ma czego włączać i ekran zostaje z samym guzikiem. Ikona bez pliku, bo ten ekran ma działać offline. Stoi w rogu, z dala od guzika, i niczego nie uruchamia. */
  function rysujGlosnikGuzika() {
    var b = $('guzik-dzwiek'); if (!b) return;
    b.setAttribute('aria-pressed', dzwiekGuzika ? 'true' : 'false'); b.setAttribute('aria-label', dzwiekGuzika ? 'Wyłącz muzykę' : 'Włącz muzykę');
    b.querySelector('.fale').setAttribute('d', dzwiekGuzika ? 'M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13' : 'M16 9l5 6M21 9l-5 6');
  }
  function zbudujGlosnikGuzika() {
    if (!MUZ) return;
    var b = document.createElement('button');
    b.id = 'guzik-dzwiek'; b.type = 'button';
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="fale" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    b.addEventListener('click', function () {
      dzwiekGuzika = !dzwiekGuzika; rysujGlosnikGuzika();
      if (!dzwiekGuzika) { piosenkaGra = false; MUZ.zatrzymaj(0.1); return; }
      MUZ.odblokuj(); MUZ.bufor(MUZ.PLIKI.fanfara);
      if (stan === 'uzbrojony') MUZ.graj(MUZ.PLIKI.puls, { petla: true, glos: 0.85 });
      else if (ostatniLicznik) { fanfaraMinela = true; szykujPiosenke(ostatniLicznik); grajPiosenke(); }   // głośnik dotknięty już po wybuchu
    });
    ekran.insertBefore(b, $('premiera-miejsce')); rysujGlosnikGuzika();   // przed panelami: otwarty panel ma leżeć nad głośnikiem
  }

  /* ── pamięć naciśnięcia: localStorage + IndexedDB, każde w try/catch (prywatne okno, zablokowane dane) ── */
  function idb(tryb, fn) {
    return new Promise(function (ok) {
      try {
        var r = indexedDB.open('bm-akcja', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('nacisk'); };
        r.onerror = function () { ok(null); };
        r.onsuccess = function () {
          try {
            var tx = r.result.transaction('nacisk', tryb), st = tx.objectStore('nacisk'), q = fn(st);
            tx.oncomplete = function () { ok(q && 'result' in q ? q.result : true); };
            tx.onerror = function () { ok(null); };
          } catch (e) { ok(null); }
        };
      } catch (e) { ok(null); }
    });

    }
    $('sz-stan').textContent = (s.wystartowala ? 'Po naciśnięciu' : 'Przed naciśnięciem') + ' · firmy: ' + (s.firmy || 0) + (s.firmy_ukryte ? ' (ukryte: ' + s.firmy_ukryte + ')' : '') + ' · zgłoszenia: ' + (s.zgloszenia_nowe || 0);
  }
  function opisSuwakow() {
    var k = KM_SUWAK[Number($('sz-km').value)];
    $('sz-km-wart').textContent = k == null ? 'prawdziwe km konta testowego' : km(k) + ' km';
    $('sz-kwota-wart').textContent = PROC_SUWAK[Number($('sz-kwota').value)] + '%';
  }
  async function sciezkaRpc(nazwa, arg, napis) {
    $('sz-stan').textContent = napis;
    var r = await window.sb.rpc(nazwa, arg);
    if (r.error) { $('sz-stan').textContent = r.error.code === '42501' ? 'To konto nie jest kontem trenera.' : 'Nie udało się: sprawdź sieć.'; return null; }
    pokazStanSciezki(r.data, nazwa === 'akcja_proba_symuluj' ? 'zostaw' : '');
    return r.data;
  }
  /* Panel powstaje dopiero po zgodzie bazy: na zwykłym ekranie guzika nie ma czego przypadkiem dotknąć (blizna-96). */
  function budujPanelSciezki() {
    function w(tag, id, tekst, rodzic) { var e = document.createElement(tag); if (id) e.id = id; if (tekst) e.textContent = tekst; (rodzic || panel).appendChild(e); return e; }
    function suwak(id, etykieta, idWart, maks) {
      var l = w('label', '', etykieta); l.htmlFor = id; w('span', idWart, '', l).className = 'sz-wart';
      var i = w('input', id); i.type = 'range'; i.min = '0'; i.max = String(maks); i.step = '1'; i.value = '0'; i.setAttribute('aria-label', etykieta);
    }
    var g = document.createElement('button'); g.id = 'sciezka-guzik'; g.type = 'button'; g.textContent = 'Ścieżka'; g.setAttribute('aria-expanded', 'false'); ekran.appendChild(g);
    var panel = document.createElement('div'); panel.id = 'sciezka'; panel.hidden = true; ekran.appendChild(panel);
    w('h2', '', 'Ścieżka Fabianka');
    var st = w('div', 'sz-stan'); st.className = 'sz-stan'; st.setAttribute('role', 'status');
    var oz = w('button', 'sz-od-zera', 'Od zera'); oz.type = 'button'; oz.className = 'sz-mocny';
    suwak('sz-km', 'Symuluj km: ', 'sz-km-wart', 5);
    suwak('sz-kwota', 'Kwota zbiórki: ', 'sz-kwota-wart', 3);
    var f = w('div'); f.style.marginTop = '12px';
    w('button', 'sz-firmy-dodaj', 'Dodaj 3 firmy testowe próby', f).type = 'button';
    w('button', 'sz-firmy-usun', 'Usuń firmy próby', f).type = 'button';
    var linki = w('div');
    [['dla-fabianka.html?proba=1&sciezka=1', 'Ulica i strona próby ›'], ['gra-cegielki.html?sciezka=1', 'Gra ›'], ['trener.html#firmy-sec', 'Panel firm ›']].forEach(function (l) { w('a', '', l[1], linki).href = l[0]; });
  }
  async function wlaczSciezke() {
    var r = await window.sb.rpc('akcja_sciezka_stan');
    if (r.error) return;
    budujPanelSciezki();
    pokazStanSciezki(r.data);
    $('sciezka-guzik').addEventListener('click', function () { var otw = $('sciezka').hidden; $('sciezka').hidden = !otw; this.setAttribute('aria-expanded', String(otw)); });
    var odZeraUzbrojone = 0;
    $('sz-od-zera').addEventListener('click', async function () {
      if (Date.now() - odZeraUzbrojone > 4000) { odZeraUzbrojone = Date.now(); this.textContent = 'Dotknij jeszcze raz: próba od zera'; var przycisk = this; setTimeout(function () { przycisk.textContent = 'Od zera'; }, 4000); return; }
      odZeraUzbrojone = 0; this.textContent = 'Od zera';
      this.disabled = true;
      var w = await sciezkaRpc('akcja_proba_od_zera', {}, 'Wracam do zera…');
      this.disabled = false;
      if (!w) return;
      await wyczyscLokalnie(); wyczyscPremiere(); wyczyscPostepGry();
      zamknijGuzik(); przyciskDotarcia(null); panelLinku(null);
      $('panel').hidden = true; $('sciezka').hidden = true; $('sciezka-guzik').setAttribute('aria-expanded', 'false');
      uzbrojGdyCzas();
    });
    function zmienSuwak() {
      opisSuwakow();
      sciezkaRpc('akcja_proba_symuluj', { p_km: KM_SUWAK[Number($('sz-km').value)], p_proc: PROC_SUWAK[Number($('sz-kwota').value)] }, 'Zapisuję…');
    }
    $('sz-km').addEventListener('input', opisSuwakow); $('sz-kwota').addEventListener('input', opisSuwakow);
    $('sz-km').addEventListener('change', zmienSuwak); $('sz-kwota').addEventListener('change', zmienSuwak);
    $('sz-firmy-dodaj').addEventListener('click', function () { sciezkaRpc('akcja_proba_firmy', { p_dodaj: true }, 'Dodaję firmy próby…'); });
    $('sz-firmy-usun').addEventListener('click', async function () {
      var w = await sciezkaRpc('akcja_proba_firmy', { p_dodaj: false }, 'Usuwam firmy próby…');
      if (w && w.pliki && w.pliki.length) { try { await window.sb.storage.from('akcja-firmy-logo').remove(w.pliki); } catch (e) {} }
    });
  }

  $('reset').addEventListener('click', async function () {
    if (!PROBA) return;
    this.disabled = true;
    try {
      var r = await window.sb.rpc('akcja_proba_reset');
      if (r.error) throw r.error;
      await wyczyscLokalnie(); wyczyscPremiere();
      zamknijGuzik();
      uzbrojGdyCzas();
    } catch (e) { $('status').textContent = 'Reset się nie udał — sprawdź sieć.'; }
    this.disabled = false;
  });

  function sesjaWPamieci() {
    try { return Object.keys(localStorage).some(function (k) { return /^sb-.*-auth-token$/.test(k); }); } catch (e) { return false; }
  }

  /* ── start strony ── */
  async function init() {
    $('proba-znak').hidden = !PROBA;
    if (!window.sb) { ustaw('blad', { napis: 'Nie udało się wczytać aplikacji. Odśwież stronę.' }); return; }
    var sesja = null;
    try { sesja = (await window.sb.auth.getSession()).data.session; } catch (e) {}
    /* audyt 2.11: token wygasł, a odświeżenie nie przeszło (brak sieci) → getSession() = null, choć sesja jest w pamięci telefonu.
       Wtedy nie blokujemy guzika: naciśnięcie zapisze się lokalnie, RPC poleci po powrocie sieci z odświeżonym tokenem. */
    if (!sesja && !sesjaWPamieci()) { ustaw('brak', { napis: 'Zaloguj się na konto trenera i otwórz tę stronę ponownie.' }); return; }

    var czekajace = await odczytajLokalnie();
    if (czekajace) { ustaw('zapisane', { slowo: 'Akcja ruszyła · ' + godzina(czekajace), licznik: '0 / 12 500 km', status: 'wysyłam…' }); wyslij(); return; }

    /* Czy to konto może nacisnąć: akcja_tydzien odpowiada wyłącznie startującym (dla innych 42501). Tylko po to, żeby nie
       pokazywać guzika komuś innemu — prawdziwa kontrola jest w akcja_start. Bez sieci: ostatnia znana odpowiedź. */
    var moze = null;
    try {
      var p = await window.sb.rpc('akcja_tydzien', { p_slug: SLUG, p_poniedzialek: '2026-11-09' });
      if (p.error && p.error.code === '42501') moze = false; else if (!p.error) moze = true;
      if (moze != null) try { localStorage.setItem(KLUCZ_MOZE, moze ? '1' : '0'); } catch (e) {}
    } catch (e) {}
    if (moze == null) { try { moze = localStorage.getItem(KLUCZ_MOZE) !== '0'; } catch (e) { moze = true; } }
    if (SCIEZKA) wlaczSciezke();
    if (!moze) { ustaw('brak', { napis: 'Ta strona jest tylko dla osoby, która uruchamia akcję.' }); return; }

    try {
      var l = await window.sb.rpc('akcja_licznik', { p_slug: SLUG });
      if (!l.error && l.data && l.data.wystartowala) { pokazZapisane(l.data, true); return; }
    } catch (e) {}
    uzbrojGdyCzas();
  }
  init();
})();
</script>
</body>
