*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#07050c;--bg2:#0f0e16;--card:#13111f;
  --border:rgba(255,255,255,0.08);--fg:#f0ede8;
  --fg2:rgba(240,237,232,0.7);--muted:rgba(240,237,232,0.45);
  --accent:#e8561e;
}
html,body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;min-height:100%;}
#topbar{
  display:flex;align-items:center;gap:12px;
  padding:52px 20px 14px;background:var(--bg);
  position:sticky;top:0;z-index:10;
  border-bottom:1px solid var(--border);
}
#topbar button{
  background:rgba(255,255,255,0.08);border:none;color:var(--fg);
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  font-size:20px;display:flex;align-items:center;justify-content:center;
}
#topbar h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.08em;}
#content{padding:12px 16px 100px;}

.top-back-btn {
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);
  color:var(--fg);border-radius:12px;padding:8px 14px;
  font-size:13px;font-family:'DM Mono',monospace;letter-spacing:0.05em;
  cursor:pointer;text-decoration:none;
  position:fixed;top:max(16px,env(safe-area-inset-top,16px));left:16px;
  z-index:100;backdrop-filter:blur(12px);
  transition:border-color 0.15s,background 0.15s;
}
.top-back-btn:hover{border-color:var(--accent);background:rgba(232,86,30,0.1);}

</style>
</head>

function renderBadgesSection() {
  const container = document.getElementById('badges-section-content');
  if (!container) return;

  const earned = window._earnedBadges.size;
  const cats = [...new Set(BADGES.map(b => b.cat))];

  let html = `
    <div style="display:flex;align-items:center;gap:12px;padding:0 0 16px;border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:16px;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1;color:var(--accent);">${earned}</div>
      <div>
        <div style="font-size:13px;font-weight:600;">zdobyte odznaki</div>
        <div style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;">${BADGES.length - earned} jeszcze do zdobycia</div>
      </div>
    </div>`;

  for (const cat of cats) {
    const catBadges = BADGES.filter(b => b.cat === cat);
    const earnedInCat = catBadges.filter(b => window._earnedBadges.has(b.id)).length;
    if (earnedInCat === 0) continue; // Pokaż kategorie tylko ze zdobytymi

    html += `<div style="font-size:9px;letter-spacing:0.25em;text-transform:uppercase;font-family:'DM Mono',monospace;color:var(--muted);margin-bottom:10px;">${cat} <span style="color:var(--accent);">${earnedInCat}/${catBadges.length}</span></div>`;
    html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;">`;

    for (const b of catBadges) {
      const isEarned = window._earnedBadges.has(b.id);
      if (!isEarned) continue; // Tylko zdobyte
      const col = RARITY_COLOR[b.rarity] || '#fff';
      html += `
        <div style="background:#13111f;border:1px solid ${col}55;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 0 16px ${col}18;">
          <img src="${BASE_URL}${b.id}.webp" alt="${b.name}" loading="lazy"
            style="width:56px;height:56px;border-radius:10px;object-fit:cover;box-shadow:0 0 12px ${col}44;"
            onerror="this.style.opacity='0.2'">
          <div style="font-size:11px;font-weight:600;line-height:1.2;">${b.name}</div>
          <span style="font-size:8px;letter-spacing:0.1em;text-transform:uppercase;font-family:'DM Mono',monospace;color:${col};background:${col}18;padding:2px 6px;border-radius:4px;">${RARITY_LABEL[b.rarity]}</span>
        </div>`;
    }
    html += `</div>`;
  }

  // Niezdobyte — mała szara siatka na dole
  const locked = BADGES.filter(b => !window._earnedBadges.has(b.id));
  if (locked.length > 0) {
    html += `<div style="font-size:9px;letter-spacing:0.25em;text-transform:uppercase;font-family:'DM Mono',monospace;color:rgba(255,255,255,0.2);margin-bottom:10px;">Do zdobycia (${locked.length})</div>`;
    html += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;">`;
    for (const b of locked) {
      html += `
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;opacity:0.3;" title="${b.desc}">
          <img src="${BASE_URL}${b.id}.webp" alt="${b.name}" loading="lazy"
            style="width:40px;height:40px;border-radius:8px;object-fit:cover;filter:grayscale(1) brightness(0.4);"
            onerror="this.style.opacity='0.1'">
          <div style="font-size:8px;color:var(--muted);line-height:1.2;">${b.name}</div>
        </div>`;
    }
    html += `</div>`;
  }

  container.innerHTML = html;
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { history.back(); return; }
  const { data: ath } = await sb.from('athletes')
    .select('id').eq('user_id', session.user.id).single();
  if (ath) {
    _athleteId = ath.id;
    const { data } = await sb.from('achievements')
      .select('badge_id').eq('athlete_id', _athleteId);
    if (data) data.forEach(r => window._earnedBadges.add(r.badge_id));
  }
  renderBadgesSection();
}

init();
</script>
