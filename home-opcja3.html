<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>OPCJA 3 — hero 9:16 + foto-kółka (jak teraz)</title>
<link rel="stylesheet" href="theme.css">
<script>try{var t=localStorage.getItem("bm_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;padding:16px 0 60px;}
  .wrap{max-width:420px;margin:0 auto;padding:0 16px;}
  .note{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:0.05em;margin-bottom:14px;line-height:1.6;border:1px dashed var(--border);border-radius:10px;padding:10px 12px;}
  .row{display:flex;gap:10px;}
  /* HERO 9:16 (jak teraz) */
  .hero{flex:1;min-width:0;background:#000;border-radius:22px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;position:relative;box-shadow:var(--tile-shadow-lg);aspect-ratio:9/16;max-height:60vh;display:flex;flex-direction:column;}
  .hero::before{content:'';position:absolute;inset:0;background-image:url('https://raw.githubusercontent.com/filipjanczak1989-png/biegamy-assets/main/solo-hero.png');background-size:cover;background-position:center 30%;opacity:0.6;}
  .hero-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,5,12,0.15) 0%,rgba(7,5,12,0) 35%,rgba(7,5,12,0.65) 100%);}
  .hero-top{height:2px;position:relative;z-index:1;background:linear-gradient(90deg,var(--accent),var(--accent2) 45%,rgba(78,140,214,0.45) 82%,transparent);border-radius:22px 22px 0 0;}
  .hero-lbl{position:relative;z-index:1;padding:12px 14px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.85);}
  .hero-foot{margin-top:auto;position:relative;z-index:1;padding:14px;}
  .hero-foot .t1{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:0.03em;line-height:1;}
  .hero-foot .t2{font-size:11px;color:rgba(255,255,255,0.7);margin-top:4px;}
  /* FOTO-KÓŁKA jak teraz (64px, bez podpisów) */
  .col{display:flex;flex-direction:column;gap:6px;width:88px;flex-shrink:0;}
  .circ{flex:1;background:none;border:none;border-radius:12px;padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
  .circ img{width:64px;height:64px;object-fit:cover;border-radius:50%;box-shadow:0 2px 12px rgba(var(--accent-rgb),0.4);}
</style>
</head>
<body>
<div class="wrap">
  <div class="note">⚙ OPCJA 3 — STAN OBECNY dla porównania: hero 9:16 + foto-kółka 64px (okrągłe zdjęcia, BEZ podpisów). Home bez zmian.</div>
  <div class="row">
    <div class="hero">
      <div class="hero-grad"></div>
      <div class="hero-top"></div>
      <div class="hero-lbl">Dzisiejszy trening</div>
      <div class="hero-foot"><div class="t1">SPOKOJNY BIEG</div><div class="t2">8 km · tempo swobodne</div></div>
    </div>
    <div class="col" id="col"></div>
  </div>
</div>
<script>
  var BASE='https://filipjanczak1989-png.github.io/biegamy-assets/';
  var T=['tile-wyzwania.webp','tile-czat.webp','tile-odznaki.webp','tile-races.webp','tile-cwiczenia.webp'];
  document.getElementById('col').innerHTML=T.map(function(p){return '<button class="circ"><img src="'+BASE+p+'" alt=""></button>';}).join('');
</script>
</body>
</html>
