<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BiegaMy — Wynik</title>
<link rel="stylesheet" href="theme.css">
<script>try{var t=localStorage.getItem("bm_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}

#layout{
  position:fixed;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;
}

/* Zamknij i tytuł */
#topbar{
  position:relative;
  padding:12px 16px;
  display:flex;align-items:center;justify-content:flex-end;
  flex-shrink:0;
  z-index:2;
}
#close{
  background:rgba(255,255,255,0.15);border:none;color:#fff;
  font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;
}

/* Zdjęcie — wypełnia resztę */
#img{
  flex:1;min-height:0;
  background:#111;background-size:cover;background-position:center bottom;
  background-repeat:no-repeat;
}

/* Cyfry pod zdjęciem */
#info{
  flex-shrink:0;
  padding:14px 16px 10px;
  text-align:center;
  background:#000;
}
#num{
  font-family:'Bebas Neue',monospace,sans-serif;
  font-size:clamp(48px,16vw,90px);line-height:1;
}

/* Paski pod wszystkim */
#bars{
  flex-shrink:0;
  display:flex;gap:4px;
  padding:10px 16px 20px;
  background:#000;
}
.bar{flex:1;height:3px;background:rgba(255,255,255,0.25);border-radius:2px;overflow:hidden;}
.fill{height:100%;width:0%;background:#fff;border-radius:2px;transition:none;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:10;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="layout">
  <div id="topbar">
    <button id="close" onclick="goBack()">✕</button>
  </div>
  <div id="img"></div>
  <div id="info"><div id="num"></div></div>
  <div id="bars"></div>
</div>
<script>
const BASE = 'https://filipjanczak1989-png.github.io/biegamy-assets/prs/';
const COLORS = {'dystans':'#e8561e','tempo':'#5b8cff','czas':'#3db870','final':'#e8561e'};

const params = new URLSearchParams(location.search);
const dist = parseFloat(params.get('dist')) || 0;
const pace = params.get('pace') || '';
const time = params.get('time') || '';
const SETS = ['set1','set2','set3','set4','set5','set6','set7','set8'];
const s = SETS[Math.floor(Math.random()*SETS.length)];

const slides = [];
if (dist > 0) slides.push({type:'dystans', val:dist.toFixed(1)+' km', bg:BASE+'prs_'+s+'_dystans.webp'});
if (pace)     slides.push({type:'tempo',   val:pace+' /km',            bg:BASE+'prs_'+s+'_tempo.webp'});
if (time)     slides.push({type:'czas',    val:time,                   bg:BASE+'prs_'+s+'_czas.webp'});
slides.push({type:'final', val:'', bg:BASE+'prs_final.webp'});

// Buduj paski
const barsEl = document.getElementById('bars');
slides.forEach(() => {
  const b = document.createElement('div'); b.className='bar';
  const f = document.createElement('div'); f.className='fill';
  b.appendChild(f); barsEl.appendChild(b);
});

let cur = 0, timer = null;

function show(idx) {
  if (idx >= slides.length) { goBack(); return; }
  cur = idx;
  const sl = slides[idx];

  // Grafika
  const imgEl = document.getElementById('img');
  imgEl.style.backgroundImage = sl.bg ? "url('"+sl.bg+"')" : '';

  // Cyfry
  const info = document.getElementById('info');
  const num = document.getElementById('num');
  if (sl.type === 'final') {
    info.style.display = 'none';
    startConfetti();
  } else {
    info.style.display = 'block';
    num.textContent = sl.val;
    num.style.color = COLORS[sl.type] || '#fff';
  }

  // Pasek
  clearInterval(timer);
  const fills = document.querySelectorAll('.fill');
  fills.forEach((f,i) => f.style.width = i < idx ? '100%' : '0%');
  const dur = sl.type === 'final' ? 4000 : 3000;
  const step = 100/(dur/50);
  timer = setInterval(() => {
    const w = parseFloat(fills[idx].style.width||0) + step;
    fills[idx].style.width = Math.min(w,100)+'%';
    if (w >= 100) { clearInterval(timer); show(idx+1); }
  }, 50);
}

document.getElementById('layout').onclick = e => {
  if (e.target.id === 'close') return;
  clearInterval(timer);
  show(cur+1);
};

function goBack() {
  clearInterval(timer);
  history.back();
}

function startConfetti() {
  const canvas = document.getElementById('confetti');
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['var(--accent)','#ff8c42','#fff','#ffd700','#3db870','#5b8cff'];
  const parts = Array.from({length:120}, () => ({
    x: Math.random()*innerWidth,
    y: -20,
    vx: (Math.random()-0.5)*5,
    vy: Math.random()*4+2,
    w: Math.random()*10+4,
    h: Math.random()*6+3,
    c: colors[Math.floor(Math.random()*colors.length)],
    r: Math.random()*360,
    rv: (Math.random()-0.5)*8
  }));
  let frame;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    parts.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.r+=p.rv;
      if (p.y < canvas.height) alive = true;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.r*Math.PI/180);
      ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if (alive) frame = requestAnimationFrame(draw);
  }
  draw();
  setTimeout(() => cancelAnimationFrame(frame), 4500);
}

show(0);
</script>
</body>
</html>
