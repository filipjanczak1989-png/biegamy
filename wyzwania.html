<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BiegaMy">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="BiegaMy">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<title>BiegaMy — Wyzwania</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sb.js"></script>
<link rel="stylesheet" href="theme.css">
<script>try{var t=localStorage.getItem("bm_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#07050c;--bg2:#0f0e16;--card:#13111f;--border:rgba(255,255,255,0.08);--fg:#f0ede8;--fg2:rgba(240,237,232,0.7);--muted:rgba(240,237,232,0.45);--accent:#e8561e;}
html,body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;height:100%;}
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&family=DM+Mono&display=swap');
#topbar{display:flex;align-items:center;gap:12px;padding:54px 20px 16px;background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);}
#topbar button{background:rgba(255,255,255,0.08);border:none;color:var(--fg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#topbar h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.08em;}
#content{padding:16px 16px 100px;}
#challenges-content{}

.top-back-btn {
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);
  color:var(--fg);border-radius:12px;padding:8px 14px;
  font-size:13px;font-family:'DM Mono',monospace;letter-spacing:0.05em;
  cursor:pointer;text-decoration:none;
  position:fixed;top:max(16px,env(safe-area-inset-top,16px));left:16px;
  z-index:100;backdrop-filter:blur(12px);
  transition:border-color 0.15s,background 0.15s;
}
.top-back-btn:hover{border-color:var(--accent);background:rgba(232,86,30,0.1);}

</style>
</head>
<body>
<div id="topbar">
  <a class="top-back-btn" href="javascript:history.back()">‹ Wstecz</a>
  <h1>Wyzwania</h1>
</div>
<div id="content">
  <div id="duels-section" style="margin-bottom:18px;"></div>
  <div id="challenges-content">
    <div style="text-align:center;padding:48px 0;color:var(--muted);font-size:13px;">Ładowanie...</div>
  </div>
</div>
<script>
let _athleteId = null;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { history.back(); return; }
  const { data: ath } = await sb.from('athletes').select('id').eq('user_id', session.user.id).single();
  if (ath) _athleteId = ath.id;
  loadDuels();
  loadChallenges();
}

// ── POJEDYNKI (duels) ─────────────────────────────────────────────
async function loadDuels() {
  const target = document.getElementById('duels-section');
  if (!target || !_athleteId) return;

  const { data: duels, error } = await sb.from('duels')
    .select('*')
    .or('challenger_id.eq.' + _athleteId + ',opponent_id.eq.' + _athleteId)
    .in('status', ['pending', 'accepted'])
    .order('created_at', { ascending: false });

  if (error) { console.warn('duels:', error.message); target.innerHTML = ''; return; }
  if (!duels || !duels.length) { target.innerHTML = ''; return; }

  // Pobierz dane przeciwników
  const otherIds = [...new Set(duels.map(d => d.challenger_id === _athleteId ? d.opponent_id : d.challenger_id))];
  const { data: athletes } = await sb.from('athletes')
    .select('id,full_name,avatar_url').in('id', otherIds);
  const athMap = {};
  (athletes || []).forEach(a => athMap[a.id] = a);

  const TYPE_LABELS = { distance: 'Dystans', time: 'Czas', pace: 'Tempo', frequency: 'Treningi' };

  // Header
  let html = '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;letter-spacing:0.05em;margin-bottom:10px;display:flex;align-items:center;gap:8px;">⚔️ Pojedynki <span style="background:var(--accent);color:#fff;font-size:10px;padding:2px 8px;border-radius:8px;font-family:\'DM Mono\',monospace;font-weight:600;">' + duels.length + '</span></div>';

  duels.forEach(d => {
    const isChallenger = d.challenger_id === _athleteId;
    const otherId = isChallenger ? d.opponent_id : d.challenger_id;
    const other = athMap[otherId] || { full_name: 'Biegacz' };
    const typeName = TYPE_LABELS[d.type] || d.type;
    const ini = (other.full_name || '?').split(' ').map(x => x[0]).join('').toUpperCase().slice(0, 2);
    const av = other.avatar_url
      ? '<img src="' + other.avatar_url + '" style="width:100%;height:100%;object-fit:cover;">'
      : ini;

    let statusBadge = '';
    let actions = '';

    if (d.status === 'pending') {
      if (isChallenger) {
        statusBadge = '<span style="background:rgba(232,86,30,0.15);color:var(--accent);font-size:10px;padding:3px 8px;border-radius:6px;font-family:\'DM Mono\',monospace;font-weight:600;">⏳ Wysłano</span>';
        actions = '<button onclick="cancelDuel(\'' + d.id + '\')" style="background:transparent;border:1px solid var(--border2);color:var(--muted);font-size:10px;padding:6px 10px;border-radius:7px;cursor:pointer;">Anuluj</button>';
      } else {
        statusBadge = '<span style="background:rgba(232,86,30,0.2);color:var(--accent);font-size:10px;padding:3px 8px;border-radius:6px;font-family:\'DM Mono\',monospace;font-weight:600;">📩 Wyzwał Cię!</span>';
        actions = '<div style="display:flex;gap:6px;"><button onclick="acceptDuel(\'' + d.id + '\')" style="background:var(--accent);border:none;color:#fff;font-size:11px;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;">✓ Przyjmij</button><button onclick="rejectDuel(\'' + d.id + '\')" style="background:transparent;border:1px solid var(--border2);color:var(--muted);font-size:11px;padding:7px 10px;border-radius:8px;cursor:pointer;">✕</button></div>';
      }
    } else if (d.status === 'accepted') {
      statusBadge = '<span style="background:rgba(61,184,112,0.15);color:var(--green);font-size:10px;padding:3px 8px;border-radius:6px;font-family:\'DM Mono\',monospace;font-weight:600;">🔥 Aktywny</span>';
      // Czas do końca
      if (d.end_at) {
        const end = new Date(d.end_at);
        const now = new Date();
        const diffH = Math.max(0, Math.round((end - now) / 3600000));
        const diffD = Math.floor(diffH / 24);
        const remain = diffD > 0 ? diffD + 'd ' + (diffH % 24) + 'h' : diffH + 'h';
        statusBadge += ' <span style="color:var(--muted);font-size:10px;font-family:\'DM Mono\',monospace;margin-left:6px;">⏱ ' + remain + '</span>';
      }
    }

    html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;">'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">'
        + '<div onclick="openProfile(\'' + otherId + '\')" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff7a45);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0;cursor:pointer;overflow:hidden;">' + av + '</div>'
        + '<div style="flex:1;min-width:0;">'
          + '<div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (other.full_name || 'Biegacz') + '</div>'
          + '<div style="font-size:10px;color:var(--muted);font-family:\'DM Mono\',monospace;margin-top:2px;">' + typeName + ' · ' + d.duration_days + ' dni</div>'
        + '</div>'
        + '<div style="flex-shrink:0;">' + statusBadge + '</div>'
      + '</div>'
      + (actions ? '<div style="display:flex;justify-content:flex-end;">' + actions + '</div>' : '')
    + '</div>';
  });

  target.innerHTML = html;
}

async function acceptDuel(duelId) {
  const start = new Date();
  const { data: d } = await sb.from('duels').select('duration_days,challenger_id').eq('id', duelId).maybeSingle();
  if (!d) return;
  const end = new Date(start.getTime() + d.duration_days * 86400000);
  const { error } = await sb.from('duels').update({
    status: 'accepted',
    start_at: start.toISOString(),
    end_at: end.toISOString()
  }).eq('id', duelId);
  if (error) { alert('Błąd: ' + error.message); return; }
  // Powiadom challengera
  try {
    const meR = await sb.from('athletes').select('full_name').eq('id', _athleteId).maybeSingle();
    const myName = meR.data?.full_name || 'Ktoś';
    await sb.from('notifications').insert({
      athlete_id: d.challenger_id,
      type: 'duel',
      from_athlete_id: _athleteId,
      message: myName + ' przyjął(a) Twoje wyzwanie 🔥',
      read: false,
      created_at: new Date().toISOString()
    });
  } catch(e) {}
  loadDuels();
}

async function rejectDuel(duelId) {
  if (!confirm('Odrzucić to wyzwanie?')) return;
  await sb.from('duels').update({ status: 'rejected' }).eq('id', duelId);
  loadDuels();
}

async function cancelDuel(duelId) {
  if (!confirm('Anulować pojedynek?')) return;
  await sb.from('duels').update({ status: 'cancelled' }).eq('id', duelId);
  loadDuels();
}

function openProfile(athleteId) {
  location.href = 'profil.html?id=' + athleteId;
}

window.acceptDuel = acceptDuel;
window.rejectDuel = rejectDuel;
window.cancelDuel = cancelDuel;
window.openProfile = openProfile;

function loadChallenges() {
  const el = document.getElementById('challenges-content');
  if (!el) return;
  const now = new Date();
  const dow = now.getDay() === 0 ? 6 : now.getDay() - 1; // 0=pn
  const wS = new Date(now); wS.setDate(now.getDate() - dow); wS.setHours(0,0,0,0);
  const mS = new Date(now.getFullYear(), now.getMonth(), 1);
  const weekNum = Math.floor((wS - new Date(wS.getFullYear(),0,1)) / 604800000);

  const BASE = 'https://filipjanczak1989-png.github.io/biegamy-assets/badges/';

  // Wyzwania tygodniowe — każde powiązane z odznakę
  const WEEKLY = [
    {id:'tydzien_mocy',   badge:'tydzien_mocy',   title:'Tydzień mocy',       desc:'3 treningi w tym tygodniu',   target:3,  unit:'treningi', kind:'sessions',color:'#e8a040'},
    {id:'5_dni_ruchu',    badge:'5_dni_ruchu',     title:'5 dni ruchu',        desc:'5 treningów w tym tygodniu',  target:5,  unit:'treningi', kind:'sessions',color:'#5090e0'},
    {id:'weekend_runner', badge:'weekend_runner',  title:'Weekend runner',     desc:'2 treningi w weekend',        target:2,  unit:'sesje',    kind:'weekend', color:'#9a6fe8'},
    {id:'20km_tydzien',   badge:'20km_tydzien',    title:'20 km / tydzień',    desc:'20 km od poniedziałku',       target:20, unit:'km',       kind:'km',      color:'#3db870'},
    {id:'40km_tydzien',   badge:'40km_tydzien',    title:'40 km / tydzień',    desc:'40 km od poniedziałku',       target:40, unit:'km',       kind:'km',      color:'#e8b840'},
    {id:'60km_tydzien',   badge:'60km_tydzien',    title:'60 km / tydzień',    desc:'60 km od poniedziałku',       target:60, unit:'km',       kind:'km',      color:'#FC4C02'},
    {id:'80km_tydzien',   badge:'80km_tydzien',    title:'80+ km / tydzień',   desc:'80 km od poniedziałku',       target:80, unit:'km',       kind:'km',      color:'#ff4444'},
    {id:'szybki_tydzien', badge:'szybki_tydzien',  title:'Szybki tydzień',     desc:'2 treningi tempowe',          target:2,  unit:'tempo',    kind:'tempo',   color:'#FC4C02'},
    {id:'3_dni_pod_rzad', badge:'3_dni_pod_rzad',  title:'3 dni pod rząd',     desc:'3 kolejne dni treningów',     target:3,  unit:'dni',      kind:'streak',  color:'#e8b840'},
    {id:'forma_rosnie',   badge:'forma_rosnie',    title:'Forma rośnie',       desc:'4 treningi w tym tygodniu',   target:4,  unit:'treningi', kind:'sessions',color:'#3db870'},
    {id:'bez_skipa',      badge:'bez_skipa',       title:'Bez skipa',          desc:'Trening co drugi dzień',      target:4,  unit:'dni',      kind:'altdays', color:'#aac8ff'},
    {id:'mieszany_ogien', badge:'mieszany_ogien',  title:'Mieszany ogień',     desc:'Easy + Tempo + Interwały',    target:3,  unit:'typy',     kind:'mix',     color:'#FC4C02'},
  ];

  // Wyzwania miesięczne — powiązane z odznakami
  const MONTHLY = [
    {id:'50km_miesiaca',  badge:'50km_miesiaca',  title:'50 km miesiąca',    desc:'50 km w tym miesiącu',       target:50,  unit:'km',       kind:'mkm',     color:'#3db870'},
    {id:'100km_miesiaca', badge:'100km_miesiaca', title:'100 km miesiąca',   desc:'100 km w tym miesiącu',      target:100, unit:'km',       kind:'mkm',     color:'#e8b840'},
    {id:'200km_miesiaca', badge:'200km_miesiaca', title:'200 km miesiąca',   desc:'200 km w tym miesiącu',      target:200, unit:'km',       kind:'mkm',     color:'#FC4C02'},
    {id:'15_treningow',   badge:'15_treningow',   title:'15 treningów',      desc:'15 treningów w miesiącu',    target:15,  unit:'treningi', kind:'msess',   color:'#5090e0'},
    {id:'20_treningow',   badge:'20_treningow',   title:'20 treningów',      desc:'20 treningów w miesiącu',    target:20,  unit:'treningi', kind:'msess',   color:'#9a6fe8'},
    {id:'maraton_m',      badge:'maraton_m',      title:'Maraton miesiąca',  desc:'42 km łącznie w miesiącu',   target:42,  unit:'km',       kind:'mkm',     color:'#e8a040'},
  ];

  // Wybierz 3 tygodniowe (rotacja) + 2 miesięczne (rotacja)
  const w1 = WEEKLY[weekNum % WEEKLY.length];
  const w2 = WEEKLY[(weekNum + 3) % WEEKLY.length];
  const w3 = WEEKLY[(weekNum + 7) % WEEKLY.length];
  const m1 = MONTHLY[Math.floor(weekNum/4) % MONTHLY.length];
  const m2 = MONTHLY[(Math.floor(weekNum/4)+1) % MONTHLY.length];

  function buildCard(ch, prog, earned, isMonthly) {
    const pct = Math.min(100, Math.round((prog||0) / ch.target * 100));
    const col = ch.color;
    const almostLabel = (!earned && pct >= 60)
      ? `<div style="font-size:10px;color:${col};font-family:'DM Mono',monospace;margin-top:6px;">Zostało ${(ch.target - (prog||0)).toFixed(ch.unit==='km'?1:0)} ${ch.unit} do odznaki 🔥</div>`
      : '';
    return `<div style="background:var(--card);border:1px solid ${earned?col:'var(--border)'};border-radius:16px;padding:14px 16px;margin-bottom:10px;${earned?'box-shadow:0 0 16px '+col+'22;':''}">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        <img src="${BASE}${ch.badge}.webp" style="width:48px;height:48px;border-radius:10px;flex-shrink:0;${earned?'box-shadow:0 0 12px '+col+'55;':'filter:grayscale(0.4) brightness(0.7);'}" onerror="this.style.display='none'">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <div style="font-size:14px;font-weight:600;">${ch.title}</div>
            ${earned ? `<span style="color:#3db870;font-size:13px;">✓</span>` : ''}
            <span style="font-size:8px;letter-spacing:0.12em;text-transform:uppercase;font-family:'DM Mono',monospace;color:var(--muted);background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:4px;">${isMonthly?'MIESIĄC':'TYDZIEŃ'}</span>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">${ch.desc}</div>
          ${almostLabel}
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:${col};">${typeof prog==='number'?prog.toFixed(ch.unit==='km'?1:0):'0'}</div>
          <div style="font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;">/ ${ch.target} ${ch.unit}</div>
        </div>
      </div>
      <div style="background:rgba(255,255,255,0.06);border-radius:4px;height:4px;overflow:hidden;">
        <div style="background:${col};height:4px;width:${pct}%;border-radius:4px;transition:width 0.8s ease;${pct>=100?'box-shadow:0 0 8px '+col+'88;':''}"></div>
      </div>
    </div>`;
  }

  // Render z zerowym postępem najpierw
  function render(progMap, earnedSet) {
    let html = `<div style="font-size:9px;letter-spacing:0.2em;text-transform:uppercase;font-family:'DM Mono',monospace;color:var(--muted);padding:0 0 8px;">Ten tydzień</div>`;
    [w1,w2,w3].forEach(ch => {
      html += buildCard(ch, progMap[ch.kind]?.[ch.id]||progMap[ch.kind]||0, earnedSet.has(ch.badge), false);
    });
    html += `<div style="font-size:9px;letter-spacing:0.2em;text-transform:uppercase;font-family:'DM Mono',monospace;color:var(--muted);padding:8px 0 8px;">Ten miesiąc</div>`;
    [m1,m2].forEach(ch => {
      html += buildCard(ch, progMap['m_'+ch.id]||0, earnedSet.has(ch.badge), true);
    });
    html += `<div style="text-align:center;padding:10px 0 0;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;">🔄 Tygodniowe resetują się w poniedziałek</div>`;
    el.innerHTML = html;
  }

  render({}, new Set());

  if (!_athleteId) return;

  Promise.all([
    sb.from('training_logs').select('distance_km,logged_at,training_type,pace')
       .eq('athlete_id', _athleteId).gte('logged_at', mS.toISOString()),
    sb.from('achievements').select('badge_id').eq('athlete_id', _athleteId)
  ]).then(([logsRes, achRes]) => {
    const all = logsRes.data || [];
    const wl = all.filter(l => new Date(l.logged_at) >= wS);
    const earnedSet = new Set((achRes.data||[]).map(r => r.badge_id));

    // Oblicz postępy
    const wkm = wl.reduce((s,l) => s+(parseFloat(l.distance_km)||0), 0);
    const mkm = all.reduce((s,l) => s+(parseFloat(l.distance_km)||0), 0);
    const wsess = wl.length;
    const msess = all.length;
    const wknd = wl.filter(l => { const d = new Date(l.logged_at).getDay(); return d===6||d===0; }).length;
    const wTempo = wl.filter(l => l.training_type==='Tempo').length;
    const wDays = [...new Set(wl.map(l=>l.logged_at.slice(0,10)))].sort();

    // streak
    let streak = 0, prev = null;
    wDays.forEach(d => {
      if (!prev) { streak=1; } 
      else { streak = Math.round((new Date(d)-new Date(prev))/86400000)===1 ? streak+1 : 1; }
      prev = d;
    });

    // Dla każdego wyzwania tygodniowego oblicz progress
    function wProg(ch) {
      if (ch.kind==='km')      return wkm;
      if (ch.kind==='sessions')return wsess;
      if (ch.kind==='weekend') return wknd;
      if (ch.kind==='streak')  return streak;
      if (ch.kind==='tempo')   return wTempo;
      if (ch.kind==='altdays') return Math.floor(wDays.length);
      if (ch.kind==='mix') {
        const types = new Set(wl.map(l=>l.training_type));
        return [types.has('Spokojny'),types.has('Tempo'),types.has('Interwały')].filter(Boolean).length;
      }
      return 0;
    }

    const progMap = {};
    [w1,w2,w3].forEach(ch => { progMap[ch.id] = wProg(ch); });
    [m1,m2].forEach(ch => {
      progMap['m_'+ch.id] = ch.kind==='mkm' ? mkm : msess;
    });

    // Specjalna mapa dla render
    function renderWithData() {
      let html = `<div style="font-size:9px;letter-spacing:0.2em;text-transform:uppercase;font-family:'DM Mono',monospace;color:var(--muted);padding:0 0 8px;">Ten tydzień</div>`;
      [w1,w2,w3].forEach(ch => {
        html += buildCard(ch, progMap[ch.id]||0, earnedSet.has(ch.badge), false);
      });
      html += `<div style="font-size:9px;letter-spacing:0.2em;text-transform:uppercase;font-family:'DM Mono',monospace;color:var(--muted);padding:8px 0 8px;">Ten miesiąc</div>`;
      [m1,m2].forEach(ch => {
        html += buildCard(ch, progMap['m_'+ch.id]||0, earnedSet.has(ch.badge), true);
      });
      html += `<div style="text-align:center;padding:10px 0 0;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;">🔄 Tygodniowe resetują się w poniedziałek</div>`;
      el.innerHTML = html;
    }
    renderWithData();
  });
}



init();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function(reg) {
        // Wykryj update i powiadom usera
        reg.addEventListener('updatefound', function() {
          var newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // Nowa wersja gotowa — auto-reload
                console.log('[PWA] New version available, reloading...');
                newWorker.postMessage({ type: 'SKIP_WAITING' });
                // Fallback gdy controllerchange nie odpali w 5s
                setTimeout(function() {
                  if (!refreshing) {
                    console.warn('[PWA] controllerchange nie odpalił, force reload');
                    window.location.reload();
                  }
                }, 5000);
              }
            });
          }
        });
        // Periodic update check co 60s (tylko gdy karta widoczna)
        setInterval(function() {
          if (document.visibilityState === 'visible' && typeof reg.update === 'function') {
            reg.update();
          }
        }, 60000);
      })
      .catch(function(err) {
        console.warn('[PWA] Service worker registration failed:', err);
      });
  });

  // Reload przy zmianie kontrolera (po SKIP_WAITING)
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>
