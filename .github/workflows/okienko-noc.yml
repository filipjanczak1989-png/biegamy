# ─────────────────────────────────────────────────────────────────────────────
# OKIENKO-NOC — Okienko samo się sprawdza codziennie (Filip 3.11 16:12).
#   02:00 UTC: ławka v2 na żywo (klasyfikator Gemini), prawdziwe pytania z wczoraj (👎, reakcje, awarie, samosprawdzenie=false, > 3 s),
#   sędzia (drugi model ocenia, niczego nie zmienia), kandydaci do ławki → docs/okienko-raport/RRRR-MM-DD.md (ZANONIMIZOWANY — repo
#   publiczne; strażnik w narzędziu + blizna-125). Spadek ≥ 2 pkt % albo regresja → issue. NIGDY automatycznego deployu ani zmiany kodu:
#   poranna pętla to człowiek („przeczytaj raport okienka i przygotuj poprawki” → gałąź okienko/poprawki-RRRR-MM-DD → OK Filipa → merge).
# SEKRETY (Settings → Secrets → Actions): GEMINI_API_KEY (ławka --zywy + sędzia), RAPORT_SECRET (nagłówek do EF okienko-raport-dane, która
#   oddaje jedną dobę logów zanonimizowaną po stronie serwera; klucz serwisowy bazy NIGDY nie trafia do GitHuba — blizna-125). Koszt nocy:
#   limit 0,50 USD (--limit-usd) — przekroczenie przerywa sędziego/ławkę i zapisuje to w raporcie. Commit raportu z [skip ci] — bez deployu.
# SĘDZIA (Filip 3.11): SEDZIA=gemini (domyślnie w narzędziu) | claude. Claude działa tylko do SEDZIA_CLAUDE_DO (kredyty Anthropic ~10 dni) i tylko z sekretem
#   ANTHROPIC_API_KEY; potem narzędzie samo wraca do gemini, a raport to mówi. Treść: pytanie, ścieżka, odpowiedź po anonimizacji i strażniku `czysty`.
#   ⚠️ Dziennik budżetu lokalny NIE widzi wydatków z CI: górna granica to limit nocy × liczba nocy (0,50 × 10 = 5 USD), ponad próg 90 USD w narzędziach.
name: okienko-noc

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: {}   # domyślnie nic; job raport dostaje tylko to, czego potrzebuje

concurrency:
  group: okienko-noc
  cancel-in-progress: false

jobs:
  raport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # commit raportu do docs/okienko-raport (z [skip ci])
      issues: write     # issue przy alarmie
    env:
      SEDZIA: claude    # przełącznik: gemini | claude
      SEDZIA_CLAUDE_DO: '2026-11-13'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # sędzia Claude używa oficjalnego SDK przez npm: (Deno, bez node_modules, jak reszta tools/_claude.mjs); ścieżka gemini zostaje na Node bez zmian
      - uses: denoland/setup-deno@v2
        if: env.SEDZIA == 'claude'
        with:
          deno-version: v2.x

      - name: Raport nocy (ławka na żywo + prawdziwe pytania + sędzia)
        id: raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAPORT_SECRET: ${{ secrets.RAPORT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          if [ "$SEDZIA" = "claude" ]; then
            deno run -A tools/okienko-raport-dnia.mjs --noc --limit-usd 0.5
          else
            node tools/okienko-raport-dnia.mjs --noc --limit-usd 0.5
          fi
          echo "kod=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Blizna anonimizacji raportu (repo publiczne)
        run: node --test tests/blizna-125-okienko-noc.test.js

      - name: Czujka intervals ↔ Garmin (forum t/609; poniedziałki także wyszukiwanie)
        id: czujka
        run: |
          set +e
          node tools/czujka-intervals.mjs
          echo "kod=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Commit raportu (bez deployu)
        run: |
          git config user.name "okienko-noc"
          git config user.email "okienko-noc@users.noreply.github.com"
          git add docs/okienko-raport/*.md docs/okienko-postep.md docs/czujka-intervals.json 2>/dev/null || true
          git diff --cached --quiet && echo "nic do zapisania" && exit 0
          git commit -m "docs(okienko-raport): raport nocy $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Issue przy alarmie (spadek ≥ 2 pkt % albo regresja)
        if: steps.raport.outputs.kod == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(date -u +%F)
          { cat docs/okienko-raport/.alarm 2>/dev/null || echo "patrz raport"; echo; echo "Raport: docs/okienko-raport/$D.md";
            echo "Poranna pętla: „przeczytaj raport okienka i przygotuj poprawki” → gałąź okienko/poprawki-$D → OK Filipa → merge + deploy (ręcznie)."; } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Okienko: alarm ławki $D" --body-file "$RUNNER_TEMP/issue.md" --label okienko || true

      - name: Issue czujki (nowy post Davida o Garminie)
        if: steps.czujka.outputs.kod == '4'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(date -u +%F)
          { cat docs/okienko-raport/.czujka-alarm 2>/dev/null || echo "patrz log"; echo;
            echo "Plan B: docs/garmin-plan-b-2026-11-03.md (przełącznik GARMIN_BLOKADA=1 w sekretach EF intervals-status + deploy; komunikat gotowy)."; } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "intervals/Garmin: nowy post Davida $D" --body-file "$RUNNER_TEMP/issue.md" --label garmin || true
