name: Auto-bump Service Worker Cache

# Triggeruje się przy każdym push do main lub master
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      # NIE triggeruj się gdy zmienia się tylko sw.js
      # (zapobiega nieskończonej pętli)
      - 'sw.js'
      - '.github/workflows/**'

jobs:
  bump-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Potrzebujemy tokenu z uprawnieniami push
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pełna historia żeby commit działał
          fetch-depth: 0

      - name: Bump cache version in sw.js
        id: bump
        run: |
          # Generuj nową wersję: data + krótki SHA commita
          # Format: biegamy-2026-05-06-a1b2c3d
          DATE=$(date -u +"%Y-%m-%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          NEW_VERSION="biegamy-${DATE}-${SHORT_SHA}"

          echo "Nowa wersja: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Podmień linię w sw.js
          # Pattern: const CACHE_VERSION = '...';
          sed -i "s|const CACHE_VERSION = '[^']*';|const CACHE_VERSION = '$NEW_VERSION';|" sw.js

          # Pokaż diff dla logów
          echo "=== Diff sw.js ==="
          git diff sw.js | head -10

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Sprawdź czy są zmiany
          if git diff --quiet sw.js; then
            echo "Brak zmian w sw.js — pomijam commit"
            exit 0
          fi

          git add sw.js
          git commit -m "chore: bump SW cache to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push
