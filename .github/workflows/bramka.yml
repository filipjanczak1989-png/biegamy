# BRAMKI — jedyne miejsce, w którym reguły REALNIE blokują.
#
# ⚠️ TEN WORKFLOW NIE JEST WOŁANY PRZEZ deploy.yml ANI rollback.yml.
#    Świadomie. Rollback musi działać wtedy, gdy wszystko inne jest zepsute —
#    a bramka też może być zepsuta. Łańcuch „rollback czeka na bramkę" znaczy,
#    że zepsuta bramka blokuje ratunek. Ta sama zasada co w testy.yml.
#
# ⚠️ HOOK LOKALNY (.githooks/pre-commit) to PRZYPOMNIENIE, nie zamek:
#    da się go ominąć `--no-verify` (.ai/LEKCJE.md #4) i nie przeżywa
#    `git clone`, bo `.git/hooks` nie jest wersjonowane. Zamek jest TUTAJ.
#
# ⚠️ KAŻDA BRAMKA URUCHAMIA NAJPIERW SAMOKONTROLĘ. Bramka, która świeci na
#    zielono, bo wywróciła się w środku, jest gorsza niż jej brak — udaje,
#    że sprawdziła. Samokontrola psuje regułę i sprawdza, że została złapana.
name: bramki

on:
  push:
  workflow_dispatch:
    inputs:
      test_negatywny:
        description: 'Wstrzyknij naruszenie i sprawdź, że workflow CZERWIENIEJE'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bramki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # bramka-commit czyta zakres pushu, nie sam HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── TEST NEGATYWNY (tylko z ręcznego uruchomienia) ──────────────────
      # Dowód, że workflow potrafi zaczerwienić. Bez tego „zielony" nie znaczy
      # nic: nie wiadomo, czy bramka sprawdza, czy tylko się nie wywraca.
      - name: Wstrzyknij naruszenie (test negatywny)
        if: inputs.test_negatywny
        run: |
          echo "⚠️ TEST NEGATYWNY — psuję reguły celowo. Ten run MA być czerwony."
          sed -i "s/'spacer': 0.5/'spacer': 1.5/" sb.js
          mkdir -p supabase/migrations
          echo "GRANT SELECT ON public.athletes TO anon;" > supabase/migrations/99999999_test_negatywny.sql   # bramka:przyklad
          git add -A

      # ⚠️ `if: always()` na KAZDEJ bramce. Bez tego pierwsza czerwona przerywa
      #    job i reszta jest `skipped` — czyli widac JEDNA usterke zamiast
      #    wszystkich, a przy naprawie wychodza pojedynczo, run po runie.
      #    Wyszlo w tescie negatywnym 16.08.2026.
      # ── SAMOKONTROLA OBU BRAMEK ─────────────────────────────────────────
      - name: Samokontrola — bramka reguł
        run: node tools/bramka-reguly.js --samokontrola

      - name: Samokontrola — bramka commita
        if: always()
        run: node tools/bramka-commit.js --samokontrola

      - name: Samokontrola — bramka karty
        if: always()
        run: node tools/bramka-karta.js --samokontrola

      - name: Samokontrola — bramka CDN
        if: always()
        run: node tools/bramka-cdn.js --samokontrola

      # ── BRAMKI WŁAŚCIWE ─────────────────────────────────────────────────
      - name: Reguły treningowe (sb.js vs _shared + EF bez własnych kopii)
        if: always()
        run: node tools/bramka-reguly.js

      # ⚠️ Karta udostępniania ma JEDEN renderer (EF). Zdublowana jest tylko
      #    GEOMETRIA: klient mierzy jasność zdjęcia tam, gdzie EF postawi imię.
      #    Rozjazd nie wywala niczego — sprawia, że kontrola jasności mierzy nie
      #    to miejsce i przepuszcza nieczytelne karty.
      #    Bramka porównuje WYNIK (piksele, krycie scrimu w punktach próbkowania),
      #    nie zapis. NIE sprawdza malowania: czcionek, odstępów, zawijania.
      - name: Karta udostępniania (geometria EF vs strefy klienta)
        if: always()
        run: node tools/bramka-karta.js

      # ⚠️ Aplikacja jest offline-first, więc SDK z obcego originu jako skrypt
      #    blokujący parser był twardą zależnością poza własnym cache. Drugi,
      #    niezależny powód: adres `@2` to zakres PŁYWAJĄCY bez `integrity` —
      #    kod u ludzi mógł się zmienić bez commita. Bramka pilnuje, żeby
      #    dziewiętnasta strona nie wróciła do CDN przez skopiowanie tagu.
      - name: supabase-js z własnego originu (self-host + suma vendora)
        if: always()
        run: node tools/bramka-cdn.js

      # ⚠️ `--ci` ZWEZA BLOKADE do rzeczy, na ktore wlasciwa reakcja brzmi
      #    „cofnij natychmiast": sekrety i GRANT/REVOKE dla roli `anon`.
      #    Migracje, sb.js i theme.css zostaja OSTRZEZENIEM — sa legalne, a w CI
      #    blokada dziala PO fakcie: migracja juz poszla do bazy, a rollback KODU
      #    jej nie cofnie. Czerwony run mowilby wtedy „cofnij" o czyms, czego
      #    cofnac sie nie da, i uczyl omijania bramki.
      #    W HOOKU zostaje bez zmian — tam blokada dziala PRZED.
      #    Zmierzone na 32 commitach z 16.08.2026: bramka zatrzymalaby 5,
      #    WSZYSTKIE na `supabase/migrations`; sekrety i anon — zero trafien.
      - name: Zakres commita (sekrety i anon blokuja, reszta ostrzega)
        if: always()
        run: |
          if [ "${{ inputs.test_negatywny }}" = "true" ]; then
            node tools/bramka-commit.js --ci
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # ⚠️ PIERWSZY PUSH NOWEJ GAŁĘZI. `before` to same zera, więc nie ma
            #    z czym porównać. Do 16.08.2026 ten przypadek był POMIJANY —
            #    czyli nowa gałąź przemycała cokolwiek, a bramka świeciła
            #    na zielono. Wyszło w teście negatywnym: zabroniony plik
            #    migracji przeszedł, bo push był pierwszy.
            #    Teraz liczymy od punktu rozejścia z gałęzią domyślną.
            BAZA=$(git merge-base "origin/${{ github.event.repository.default_branch }}" "${{ github.sha }}")
            echo "Pierwszy push gałęzi — zakres od punktu rozejścia: $BAZA"
            node tools/bramka-commit.js --ci --zakres "$BAZA..${{ github.sha }}"
          else
            node tools/bramka-commit.js --ci --zakres "${{ github.event.before }}..${{ github.sha }}"
          fi

      # ── BRAMKI SPÓJNOŚCI ŹRÓDEŁ (do 16.08.2026 nikt ich nie uruchamiał) ──
      - name: RUN_TYPES — lista typów biegowych w 8 źródłach
        if: always()
        run: python tools/sprawdz-run-types.py

      - name: Stałe wyzwania #100kmDlaKasi w 3 źródłach
        if: always()
        run: python tools/sprawdz-spol-stale.py
