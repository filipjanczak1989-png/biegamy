name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Wywolywalny z rollback.yml — inaczej trzeba by duplikowac cala logike
  # deployu (bump + rsync + Pages), a dwie kopie rozjechalyby sie przy
  # pierwszej zmianie.
  # !! `ref` MA BYC GALEZIA, nie sha. Krok "Commit bump back" robi `git push`,
  #    a z odlaczonej HEAD (checkout po sha) push nie ma dokad pojsc.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Na push/dispatch `inputs` jest puste -> github.ref, czyli zachowanie
          # sprzed zmiany. Z rollback.yml przychodzi 'main', wiec checkout bierze
          # SWIEZY szczyt galezi — juz z wypchnietym rewertem.
          ref: ${{ inputs.ref || github.ref }}

      - name: Bump SW cache version
        run: |
          NEW_VERSION="biegamy-$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)"
          sed -i "s|const CACHE_VERSION = '[^']*';|const CACHE_VERSION = '$NEW_VERSION';|" sw.js
          echo "Wersja: $NEW_VERSION"

      - name: Commit bump back (sync repo)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if ! git diff --quiet sw.js; then
            git add sw.js
            git commit -m "chore: bump SW cache [skip ci]"
            git push
          fi

      # Na Pages ma trafiac STRONA, a nie caly katalog roboczy. Sprawdzone
      # 15.08.2026 na wdrozonym serwisie: kazdy z ponizszych katalogow byl
      # publicznie pobieralny (HTTP 200), m.in. docs/zaleglosci-bezpieczenstwo.md
      # i .ai/LEKCJE.md. Repo jest publiczne, wiec to NIE JEST wyciek — te pliki
      # i tak sa na GitHubie. Powod wykluczenia jest inny: nie serwujemy
      # z originu aplikacji rzeczy, ktore nie sa aplikacja.
      #
      # !! ZWERYFIKOWANE, ZE STRONA TEGO NIE LADUJE: zero dopasowan na
      #    src=/href=/fetch(/import z tych katalogow w *.html, *.js, *.css.
      #    Trafienia na "supabase/" w kodzie to wylacznie adresy *.supabase.co.
      #
      # !! CZEGO SWIADOMIE NIE WYKLUCZAMY:
      #      CNAME            — bez niego Pages gubi domene wlasna
      #      js/ vendor/ assets/ — strona to laduje
      #      README*.md CLAUDE.md — dokumentacja w korzeniu repo, nieszkodliwa
      #    Oszczednosc miejsca jest przy okazji i jest mala (~1,1 MB przy
      #    artefakcie liczonym w dziesiatkach MB — patrz zaleglosc o assets/ gry).
      #    Sens jest porzadkowy, nie wydajnosciowy.
      - name: Stage site (bez .git/.github i bez zaplecza)
        run: |
          mkdir -p /tmp/site
          # Wiodacy ukosnik KOTWICZY wzorzec do korzenia transferu. Bez niego
          # rsync dopasowuje KAZDY komponent sciezki, wiec przyszly js/tools/
          # albo assets/docs/ zniknalby po cichu. Dzis takich katalogow nie ma
          # (sprawdzone 15.08.2026: zero dopasowan ponizej korzenia), i wlasnie
          # dlatego kotwica kosztuje teraz nic, a pozniej kosztowalaby debugowanie.
          rsync -a \
            --exclude '/.git' \
            --exclude '/.github' \
            --exclude '/tests' \
            --exclude '/tools' \
            --exclude '/docs' \
            --exclude '/.ai' \
            --exclude '/supabase' \
            ./ /tmp/site/
          echo "Wdrazane: $(du -sh /tmp/site | cut -f1)"
          for k in tests tools docs .ai supabase; do
            test ! -e "/tmp/site/$k" || { echo "BLAD: $k trafil do artefaktu"; exit 1; }
          done
          test -f /tmp/site/CNAME || { echo "BLAD: brak CNAME — domena wlasna padnie"; exit 1; }
          test -f /tmp/site/zawodnik.html || { echo "BLAD: brak zawodnik.html"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Odczekaj przed retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
