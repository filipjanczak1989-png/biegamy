<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Ta trasa nie istnieje · BiegaMy</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0d0b12;color:#fff;font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.karta{max-width:420px;width:100%;text-align:center}
.grafika{position:relative;height:220px;border-radius:20px;overflow:hidden;margin-bottom:28px;display:none}
.grafika img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%}
.grafika::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,11,18,0) 55%,rgba(13,11,18,.55) 100%)}
.kod{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:4px;line-height:1;color:#e8561e;margin-bottom:6px}
h1{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;font-weight:400;margin-bottom:10px}
p{font-size:14px;line-height:1.6;color:rgba(255,255,255,.65);margin-bottom:26px}
.btn{display:inline-block;background:#e8561e;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:13px 30px;border-radius:12px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn:active{transform:scale(.97)}
.stopka{margin-top:26px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase}</style>
</head>
<body>
<!-- STRONA-404 v1 (WIZUAL E4-P1): GH Pages serwuje ja automatycznie dla nieznanych sciezek -->
<div class="karta">
  <div class="grafika" id="g"><img id="gi" alt=""></div>
  <div class="kod">404</div>
  <h1>Ta trasa nie istnieje</h1>
  <p>Zboczyłeś ze szlaku — zdarza się najlepszym. Wróć na znaną trasę i biegniemy dalej.</p>
  <a class="btn" href="/index.html">Wróć na trasę</a>
  <div class="stopka">jesteśmy obok · biegamy.run</div>
</div>
<script>(function(){var i=document.getElementById('gi');i.onload=function(){document.getElementById('g').style.display='block';};i.src='/assets/ui/pustki/pustka-404.webp';})();</script>
</body>
</html>
