<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07070a">
<title>Brak połączenia — BiegaMy</title>
<link rel="icon" href="favicon.ico">
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #07070a;
    color: #f0ede8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .icon { width: 96px; height: 96px; margin-bottom: 24px; }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: rgba(240, 237, 232, 0.7);
    max-width: 360px;
    margin: 0 0 28px;
  }
  .btn {
    display: inline-block;
    background: #e8561e;
    color: #ffffff;
    padding: 14px 32px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .secondary {
    background: transparent;
    color: rgba(240, 237, 232, 0.6);
    border: 1px solid rgba(240, 237, 232, 0.15);
    margin-top: 12px;
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: #e8561e;
    display: inline-block;
    margin-right: 8px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  .status {
    margin-top: 24px;
    font-size: 13px;
    color: rgba(240, 237, 232, 0.4);
    font-family: 'DM Mono', monospace;
  }
</style>
</head>
<body>
  <img src="icons/icon-192.png" alt="BiegaMy" class="icon">
  <h1>Brak połączenia</h1>
  <p>Nie udało się połączyć z internetem. Sprawdź swoje połączenie i spróbuj ponownie.</p>
  <button class="btn" onclick="location.reload()">Spróbuj ponownie</button>
  <a href="zawodnik.html" class="btn secondary">Otwórz ostatnie dane (offline)</a>
  <div class="status"><span class="pulse"></span>Sprawdzam połączenie...</div>

<script>
  // Auto-reload kiedy odzyskasz połączenie
  window.addEventListener('online', () => {
    location.reload();
  });

  // Aktywne sprawdzanie co 5s
  setInterval(() => {
    if (navigator.onLine) {
      fetch('/manifest.json', { cache: 'no-cache' })
        .then(() => location.reload())
        .catch(() => {});
    }
  }, 5000);
</script>
</body>
</html>
