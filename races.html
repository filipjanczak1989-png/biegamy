<!DOCTYPE html>
<!-- BiegaMy build: 2026-05-13T19:08Z · races · clickable participant avatars -->
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalendarz Startów · BiegaMy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sb.js"></script>
<link rel="stylesheet" href="theme.css">
<script>try{var t=localStorage.getItem("bm_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;overflow-x:hidden;}

/* ── HEADER ── */
.races-header{
  position:sticky;top:0;z-index:100;
  background:rgba(7,7,10,0.92);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top,0px) 16px 0;
}
.races-header-inner{display:flex;align-items:center;gap:12px;padding:14px 0 12px;}
.back-btn{
  background:rgba(255,255,255,0.07);border:1px solid var(--border);
  color:var(--fg2);border-radius:50%;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  font-size:18px;line-height:1;
}
.races-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.04em;color:var(--fg);}
.races-title span{color:var(--accent);}
.add-race-btn{
  margin-left:auto;
  background:var(--accent);border:none;color:#fff;
  border-radius:12px;padding:8px 14px;font-size:12px;font-weight:600;
  letter-spacing:0.04em;cursor:pointer;display:flex;align-items:center;gap:6px;
  white-space:nowrap;
}

/* ── FILTER CHIPS ── */
.filter-row{
  display:flex;gap:8px;padding:10px 16px 12px;
  overflow-x:auto;scrollbar-width:none;
}
.filter-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  color:var(--fg2);border-radius:20px;padding:6px 14px;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;
  cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ── SEARCH ── */
.search-wrap{padding:0 16px 12px;}
.search-input{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  color:var(--fg);border-radius:12px;padding:10px 14px 10px 38px;
  font-size:14px;font-family:'DM Sans',sans-serif;outline:none;
  transition:border-color 0.15s;
}
.search-input:focus{border-color:rgba(var(--accent-rgb),0.5);}
.search-input::placeholder{color:var(--fg3);}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--fg3);pointer-events:none;}

/* ── RACES LIST ── */
.races-list{padding:0 16px 100px;display:flex;flex-direction:column;gap:12px;}

.race-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--tile-radius);overflow:hidden;
  box-shadow:var(--tile-shadow);cursor:pointer;
  transition:border-color 0.18s,transform 0.12s;
  position:relative;
}
.race-card:active{transform:scale(0.985);}
.race-card:hover{border-color:rgba(var(--accent-rgb),0.3);}

.race-card-inner{padding:16px 18px;}
.race-top{display:flex;align-items:flex-start;gap:12px;}
.race-dist-badge{
  flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-radius:10px;padding:6px 10px;text-align:center;
  min-width:56px;
}
.race-dist-badge .dist-num{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;}
.race-dist-badge .dist-unit{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.85;font-family:'DM Mono',monospace;}
.race-info{flex:1;min-width:0;}
.race-name{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px;line-height:1.3;}
.race-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.race-meta-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--fg3);font-family:'DM Mono',monospace;}
.race-meta-item svg{flex-shrink:0;}

.race-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 12px;border-top:1px solid rgba(255,255,255,0.05);
  margin-top:10px;
}
.signup-btn{
  background:rgba(var(--accent-rgb),0.15);border:1px solid rgba(var(--accent-rgb),0.4);
  color:var(--accent);border-radius:10px;padding:7px 14px;
  font-size:11px;font-family:'DM Mono',monospace;letter-spacing:0.08em;
  cursor:pointer;transition:all 0.15s;
}
.signup-btn:hover,.signup-btn:active{background:var(--accent);color:#fff;}
.signup-btn.signed{background:rgba(61,184,112,0.15);border-color:rgba(61,184,112,0.4);color:var(--green);}
.signup-btn.signed:hover{background:var(--green);color:#fff;}

.signups-count{font-size:11px;color:var(--fg3);font-family:'DM Mono',monospace;}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;padding:60px 30px;
  color:var(--fg3);
}
.empty-state svg{margin-bottom:16px;opacity:0.3;}
.empty-state p{font-size:14px;line-height:1.6;}

/* ── MONTH DIVIDER ── */
.month-divider{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.25em;
  text-transform:uppercase;color:var(--muted);
  padding:8px 0 4px;display:flex;align-items:center;gap:10px;
}
.month-divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── RACE DETAIL MODAL ── */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.25s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
  background:var(--card2);border-radius:24px 24px 0 0;
  padding:0 0 env(safe-area-inset-bottom,20px);
  transform:translateY(40px);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.15);margin:12px auto 0;}
.modal-head{padding:20px 20px 16px;}
.modal-dist{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:0.15em;color:var(--accent);margin-bottom:6px;}
.modal-name{font-size:20px;font-weight:700;color:var(--fg);line-height:1.2;margin-bottom:14px;}
.modal-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.modal-meta-cell{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
.modal-meta-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:4px;}
.modal-meta-value{font-size:13px;font-weight:600;color:var(--fg);}
.modal-desc{font-size:13px;color:var(--fg2);line-height:1.7;padding:0 20px;margin-bottom:18px;}
.modal-links{padding:0 20px;display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.modal-link-btn{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.05);border:1px solid var(--border);
  color:var(--fg2);border-radius:12px;padding:12px 16px;
  font-size:13px;cursor:pointer;text-decoration:none;
  transition:border-color 0.15s;
}
.modal-link-btn:hover{border-color:rgba(var(--accent-rgb),0.4);}
.modal-link-btn span{flex:1;}
.modal-actions{padding:0 20px;}
.modal-signup-btn{
  width:100%;background:var(--accent);border:none;color:#fff;
  border-radius:14px;padding:15px;font-size:15px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity 0.15s;
}
.modal-signup-btn:active{opacity:0.85;}
.modal-signup-btn.signed{background:rgba(61,184,112,0.2);color:var(--green);border:1px solid rgba(61,184,112,0.4);}
.modal-close{
  position:absolute;top:16px;right:16px;
  background:rgba(255,255,255,0.08);border:none;color:var(--fg3);
  width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* ── ADD RACE MODAL ── */
.add-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.04em;padding:20px 0 16px;}
.add-title span{color:var(--accent);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:7px;}
.field input,.field select,.field textarea{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  color:var(--fg);border-radius:12px;padding:11px 14px;font-size:14px;
  font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(var(--accent-rgb),0.5);}
.field select option{background:#1a1525;color:var(--fg);}
.field textarea{resize:vertical;min-height:80px;}
.submit-btn{
  width:100%;background:var(--accent);border:none;color:#fff;
  border-radius:14px;padding:15px;font-size:15px;font-weight:600;
  cursor:pointer;margin-top:8px;
}
.cancel-btn{
  width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--border);
  color:var(--fg2);border-radius:14px;padding:14px;font-size:14px;
  cursor:pointer;margin-top:8px;
}

/* ── PENDING BADGE ── */
.pending-notice{
  margin:12px 16px;
  background:rgba(78,140,214,0.1);border:1px solid rgba(78,140,214,0.3);
  border-radius:12px;padding:10px 14px;
  font-size:12px;color:var(--blue);
  display:flex;align-items:center;gap:8px;
}

/* ── LOADING ── */
.skeleton{
  background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── BACK NAV ── */
.bottom-back{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(7,7,10,0.96);border-top:1px solid var(--border);
  padding:12px 20px env(safe-area-inset-bottom,12px);
  display:flex;justify-content:center;
}
.bottom-back-btn{
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  color:var(--fg2);border-radius:12px;padding:11px 32px;font-size:13px;
  cursor:pointer;display:flex;align-items:center;gap:8px;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(22,18,30,0.97);border:1px solid rgba(255,255,255,0.1);
  color:var(--fg);border-radius:14px;padding:11px 20px;font-size:13px;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:9999;
  opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.region-btn{flex-shrink:0;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--fg3);border-radius:20px;padding:5px 12px;font-size:10px;font-family:'DM Mono',monospace;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.region-btn.active{background:rgba(var(--accent-rgb),0.15);border-color:rgba(var(--accent-rgb),0.4);color:var(--accent);}
/* Distance chips w filter panelu */
.dchip{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--fg2);border-radius:14px;padding:6px 12px;font-size:11px;font-family:'DM Mono',monospace;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.dchip:hover{border-color:rgba(var(--accent-rgb),0.3);}
.dchip.active{background:rgba(var(--accent-rgb),0.15);border-color:rgba(var(--accent-rgb),0.4);color:var(--accent);}
/* Active filter pill (na górze) */
.afpill{display:inline-flex;align-items:center;gap:5px;background:rgba(var(--accent-rgb),0.12);border:1px solid rgba(var(--accent-rgb),0.35);color:var(--accent);border-radius:14px;padding:4px 8px 4px 10px;font-size:11px;font-family:'DM Mono',monospace;}
.afpill button{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px;line-height:1;}

.top-back-btn {
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);
  color:var(--fg);border-radius:12px;padding:8px 14px;
  font-size:13px;font-family:'DM Mono',monospace;letter-spacing:0.05em;
  cursor:pointer;text-decoration:none;
  position:fixed;top:max(16px,env(safe-area-inset-top,16px));left:16px;
  z-index:100;backdrop-filter:blur(12px);
  transition:border-color 0.15s,background 0.15s;
}
.top-back-btn:hover{border-color:var(--accent);background:rgba(var(--accent-rgb),0.1);}

</style>
</head>
<body>

<!-- HEADER -->
<div class="races-header">
  <div class="races-header-inner">
    <button class="back-btn" onclick="history.back()">‹</button>
    <div class="races-title">Kalendarz <span>Startów</span></div>
    <button id="filter-toggle-btn" onclick="toggleFiltersPanel()" title="Filtry"
      style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--fg2);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span id="filter-count-badge" style="display:none;position:absolute;top:-3px;right:-3px;background:var(--accent);color:#fff;font-size:9px;font-family:'DM Mono',monospace;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px;line-height:1;border:2px solid var(--bg);"></span>
    </button>
    <button class="add-race-btn" onclick="openAddRace()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Dodaj start
    </button>
  </div>

  <!-- ACTIVE FILTERS BAR (chip-y aktywnych filtrów - zawsze widoczne kiedy coś ustawione) -->
  <div id="active-filters-bar" style="display:none;padding:8px 16px 0;flex-wrap:wrap;gap:6px;"></div>

  <!-- FILTERS PANEL (rozwijany pod headerem) -->
  <div id="filters-panel" style="display:none;padding:14px 16px 4px;background:rgba(15,13,24,0.6);border-bottom:1px solid var(--border);">
    <!-- Pole search -->
    <div class="search-wrap" style="padding:0 0 12px;">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" placeholder="Szukaj zawodów (np. wroclaw)..." id="search-input" oninput="filterRaces()">
    </div>

    <!-- Województwo -->
    <div style="margin-bottom:10px;">
      <label style="font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;display:block;margin-bottom:5px;">Województwo</label>
      <select id="f-voi" onchange="onFilterChange()"
        style="width:100%;background:var(--card2);border:1px solid var(--border);color:var(--fg);padding:9px 10px;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;color-scheme:dark;cursor:pointer;">
        <option value="">— Wszystkie —</option>
        <option value="dolnośląskie">Dolnośląskie</option>
        <option value="kujawsko-pomorskie">Kujawsko-pomorskie</option>
        <option value="lubelskie">Lubelskie</option>
        <option value="lubuskie">Lubuskie</option>
        <option value="łódzkie">Łódzkie</option>
        <option value="małopolskie">Małopolskie</option>
        <option value="mazowieckie">Mazowieckie</option>
        <option value="opolskie">Opolskie</option>
        <option value="podkarpackie">Podkarpackie</option>
        <option value="podlaskie">Podlaskie</option>
        <option value="pomorskie">Pomorskie</option>
        <option value="śląskie">Śląskie</option>
        <option value="świętokrzyskie">Świętokrzyskie</option>
        <option value="warmińsko-mazurskie">Warmińsko-mazurskie</option>
        <option value="wielkopolskie">Wielkopolskie</option>
        <option value="zachodniopomorskie">Zachodniopomorskie</option>
      </select>
    </div>

    <!-- Miesiąc -->
    <div style="margin-bottom:10px;">
      <label style="font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;display:block;margin-bottom:5px;">Miesiąc</label>
      <select id="f-month" onchange="onFilterChange()"
        style="width:100%;background:var(--card2);border:1px solid var(--border);color:var(--fg);padding:9px 10px;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;color-scheme:dark;cursor:pointer;">
        <option value="">— Dowolny —</option>
        <!-- generowane JS bo zależne od bieżącej daty -->
      </select>
    </div>

    <!-- Dystans (multi-select chip-y) -->
    <div style="margin-bottom:10px;">
      <label style="font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;display:block;margin-bottom:6px;">Dystans</label>
      <div id="dist-chips" style="display:flex;flex-wrap:wrap;gap:6px;">
        <button class="dchip active" data-dist="all" onclick="selectDistChip(this)">Wszystkie</button>
        <button class="dchip" data-dist="5" onclick="selectDistChip(this)">5 km</button>
        <button class="dchip" data-dist="10" onclick="selectDistChip(this)">10 km</button>
        <button class="dchip" data-dist="21.097" onclick="selectDistChip(this)">Półmaraton</button>
        <button class="dchip" data-dist="42.195" onclick="selectDistChip(this)">Maraton</button>
        <button class="dchip" data-dist="ultra" onclick="selectDistChip(this)">Ultra</button>
        <button class="dchip" data-dist="other" onclick="selectDistChip(this)">Inne</button>
      </div>
    </div>

    <!-- Zakres dat -->
    <div style="margin-bottom:10px;">
      <label style="font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;display:block;margin-bottom:5px;">Zakres dat (precyzyjny)</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <input id="adv-date-from" type="date" onchange="onFilterChange()"
          style="width:100%;background:var(--card2);border:1px solid var(--border);color:var(--fg);padding:8px 10px;border-radius:8px;font-size:12px;font-family:'DM Mono',monospace;color-scheme:dark;">
        <input id="adv-date-to" type="date" onchange="onFilterChange()"
          style="width:100%;background:var(--card2);border:1px solid var(--border);color:var(--fg);padding:8px 10px;border-radius:8px;font-size:12px;font-family:'DM Mono',monospace;color-scheme:dark;">
      </div>
    </div>

    <!-- Akcje -->
    <div style="display:flex;gap:8px;margin-top:8px;padding-bottom:6px;">
      <button onclick="clearAllFilters()" class="btn btn-ghost btn-sm" style="flex:1;">Wyczyść</button>
      <button onclick="toggleFiltersPanel()" class="btn btn-primary btn-sm" style="flex:2;">Pokaż wyniki</button>
    </div>
  </div>
</div>

<!-- PENDING NOTICE (ukryte domyślnie) -->
<div class="pending-notice" id="pending-notice" style="display:none;">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>
  <span id="pending-text">Twoje propozycje czekają na akceptację trenera</span>
</div>

<!-- RACES LIST -->
<!-- BANERY E3: hero tygodniowy (no-op bez sb.js/pliku) -->
<div id="banery-top"></div>
<script>document.addEventListener('DOMContentLoaded',function(){window.BANERY&&BANERY.mount('#banery-top','races');});</script>
<div class="races-list" id="races-list">
  <!-- skeleton loader -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;">

<script>
const _sb = window.sb;

let _user = null, _athleteId = null, _athleteGoals = [], _isCoach = false;
let _allRaces = [], _mySignups = new Set();
let _racesSeenBaseline = '';   // KROK 3: "ostatnia wizyta" sprzed tego wejścia — do badge "NOWE"
let _activeDist = 'all', _searchVal = '';
let _currentRace = null;

// ── INIT ──────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }
  _user = session.user;

  // KROK 3: zapamiętaj "ostatnią wizytę" PRZED nadpisaniem seen (renderRaceCard użyje do badge "NOWE")
  _racesSeenBaseline = localStorage.getItem('bm_races_friends_seen') || '';

  // Pobierz athlete
  const { data: ath } = await _sb.from('athletes')
    .select('id,race_goals')
    .eq('user_id', _user.id)
    .maybeSingle();
  if (ath) {
    _athleteId = ath.id;
    try { _athleteGoals = JSON.parse(ath.race_goals || '[]'); } catch(e) { _athleteGoals = []; }
  }

  // Sprawdź czy trener
  const { data: coachRow } = await _sb.from('coaches').select('id').eq('id', _user.id).maybeSingle();
  _isCoach = !!coachRow;
  updateAddRaceUI();

  await loadRaces();
  await loadMySignups();

  // KROK 2: oznacz "widziałem biegi teraz" → kropka "nowe od znajomych" na home zniknie
  try { localStorage.setItem('bm_races_friends_seen', new Date().toISOString()); } catch(e){}
})();

// ── LOAD RACES ────────────────────────────────────────────────────
async function loadRaces() {
  let query = _sb.from('races')
    .select('*')
    .gte('date', new Date().toISOString().slice(0,10))
    .order('date', { ascending: true });

  // Trener widzi wszystkie (pending też), zawodnik tylko approved
  if (!_isCoach) query = query.eq('status', 'approved');

  const { data, error } = await query;

  if (error) { showToast('Błąd ładowania: ' + error.message); return; }
  _allRaces = data || [];

  // z1+: kto zgłosił pendingi (tylko trener) — added_by → full_name
  window._raceSubmitters = {};
  if (_isCoach) {
    const ids = [...new Set(_allRaces.filter(r => r.status === 'pending' && r.added_by).map(r => r.added_by))];
    if (ids.length) {
      const { data: subs } = await _sb.from('athletes').select('id, full_name').in('id', ids);
      (subs || []).forEach(a => { window._raceSubmitters[a.id] = a.full_name || ''; });
    }
  }

  // Pobierz avatary uczestników BiegaMy dla każdego wyścigu (max 5 per race)
  await loadMyFriends();              // najpierw znajomi (potrzebne do wyróżnienia "znajomi biegną")
  await loadRaceParticipantsAvatars();

  renderRaces();

  // Sprawdź pending (tylko dla zawodnika)
  if (_athleteId && !_isCoach) {
    const { data: pending } = await _sb.from('races')
      .select('id')
      .eq('added_by', _athleteId)
      .eq('status', 'pending');
    if (pending?.length) {
      document.getElementById('pending-notice').style.display = 'flex';
      document.getElementById('pending-text').textContent =
        `${pending.length === 1 ? 'Twoja propozycja czeka' : `${pending.length} propozycje czekają`} na akceptację trenera`;
    }
  }
}

// Pobiera avatary do max 5 uczestników per race i zapisuje w _raceParticipants
let _raceParticipants = {};  // raceId → [{id, full_name, avatar_url}, ...]
let _raceFriends = {};       // raceId → [...] — TYLKO moi znajomi zapisani na ten bieg
let _myFriends = new Set();  // athlete_id zaakceptowanych znajomych
async function loadRaceParticipantsAvatars() {
  const raceIds = _allRaces.filter(r => (r.signup_count||0) > 0).map(r => r.id);
  if (!raceIds.length) return;

  // Pobierz wszystkie signups dla widocznych wyścigów
  const { data: signups } = await _sb.from('race_signups')
    .select('race_id,athlete_id,created_at')
    .in('race_id', raceIds)
    .order('created_at', { ascending: false });

  if (!signups || !signups.length) return;

  // Grupuj per race, weź max 5 najnowszych per race
  const byRace = {};
  signups.forEach(s => {
    if (!byRace[s.race_id]) byRace[s.race_id] = [];
    if (byRace[s.race_id].length < 5) byRace[s.race_id].push(s.athlete_id);
  });

  // Pobierz dane wszystkich tych zawodników jednym zapytaniem
  // znajomi: licz z PEŁNEJ listy signups (nie tylko top-5), żeby znajomy zapisany jako 6.+ też się liczył
  const friendsByRace = {};
  if (_myFriends.size) {
    signups.forEach(s => {
      if (_myFriends.has(s.athlete_id)) (friendsByRace[s.race_id] = friendsByRace[s.race_id] || []).push(s.athlete_id);
    });
  }
  const friendIds = [...new Set(Object.values(friendsByRace).flat())];
  const allAthleteIds = [...new Set([...Object.values(byRace).flat(), ...friendIds])];
  if (!allAthleteIds.length) return;
  const { data: athletes } = await _sb.from('athletes')
    .select('id,full_name,avatar_url')
    .in('id', allAthleteIds);

  const athMap = {};
  (athletes||[]).forEach(a => { athMap[a.id] = a; });

  _raceParticipants = {};
  Object.keys(byRace).forEach(raceId => {
    _raceParticipants[raceId] = byRace[raceId]
      .map(id => athMap[id])
      .filter(Boolean);
  });
  _raceFriends = {};
  Object.keys(friendsByRace).forEach(raceId => {
    _raceFriends[raceId] = friendsByRace[raceId].map(id => athMap[id]).filter(Boolean);
  });
}

async function loadMySignups() {
  if (!_athleteId) return;
  const { data } = await _sb.from('race_signups')
    .select('race_id')
    .eq('athlete_id', _athleteId);
  _mySignups = new Set((data || []).map(r => r.race_id));
}

// Moi zaakceptowani znajomi (athlete_id) — do wyróżnienia "znajomi biegną" na karcie
async function loadMyFriends() {
  if (!_athleteId) return;
  const { data } = await _sb.from('friendships')
    .select('requester_id,addressee_id')
    .eq('status', 'accepted')
    .or(`requester_id.eq.${_athleteId},addressee_id.eq.${_athleteId}`);
  _myFriends = new Set((data || []).map(f => f.requester_id === _athleteId ? f.addressee_id : f.requester_id));
}

// ── RENDER ────────────────────────────────────────────────────────
function renderRaces() {
  const list = document.getElementById('races-list');
  const filtered = getFiltered();

  // Dla trenera: pending na górze osobno
  let html = '';
  if (_isCoach) {
    const pending = _allRaces.filter(r => r.status === 'pending');
    if (pending.length > 0) {
      html += `<div class="month-divider" style="color:var(--blue);">Do zatwierdzenia (${pending.length})</div>`;
      pending.forEach(r => { html += renderRaceCard(r); });
      html += `<div class="month-divider">Zatwierdzone</div>`;
    }
  }

  const approved = filtered.filter(r => r.status === 'approved');
  if (approved.length === 0 && !html) {
    list.innerHTML = `<div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <p>Brak zawodów w tym filtrze.<br>Możesz zaproponować nowe!</p>
    </div>`;
    return;
  }

  // Grupuj po miesiącu
  let currentMonth = '';
  for (const race of approved) {
    const month = formatMonth(race.date);
    if (month !== currentMonth) {
      currentMonth = month;
      if (!_isCoach) html += `<div class="month-divider">${month}</div>`;
      else html += `<div class="month-divider" style="font-size:8px;">${month}</div>`;
    }
    html += renderRaceCard(race);
  }
  list.innerHTML = html;
}

function renderRaceCard(race) {
  const signed = _mySignups.has(race.id);
  const isPending = race.status === 'pending';
  const isRejected = race.status === 'rejected';
  // KROK 3: approved bieg dodany PO ostatniej wizycie = "NOWE" (created_at > baseline)
  const isNew = !isPending && !isRejected && race.created_at && _racesSeenBaseline && race.created_at > _racesSeenBaseline;
  const distLabel = distanceLabel(race.distance_km);
  const distNum = formatDistNum(race.distance_km);
  const distUnit = formatDistUnit(race.distance_km);
  const dateStr = formatDate(race.date);

  // Avatary uczestników BiegaMy (max 5)
  const parts = _raceParticipants[race.id] || [];
  const totalCount = race.signup_count || 0;
  let avatarsHtml = '';
  if (parts.length > 0) {
    const avList = parts.map((a, idx) => {
      const ini = (a.full_name||'?').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
      const inner = a.avatar_url
        ? `<img src="${escAttr(a.avatar_url)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.textContent='${ini}'">`
        : ini;
      return `<div onclick="event.stopPropagation();location.href='profil.html?id=${a.id}'" style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;border:2px solid #0a0810;margin-left:${idx===0?'0':'-8px'};overflow:hidden;flex-shrink:0;z-index:${10-idx};position:relative;cursor:pointer;transition:transform 0.15s;" onmouseover="this.style.transform='scale(1.15)';this.style.zIndex='20'" onmouseout="this.style.transform='scale(1)';this.style.zIndex='${10-idx}'" title="${escAttr(a.full_name||'')} · klik = profil">${inner}</div>`;
    }).join('');
    const moreCount = totalCount - parts.length;
    const more = moreCount > 0
      ? `<div onclick="event.stopPropagation();showParticipants('${race.id}','${escAttr(race.name)}')" style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--fg2);border:2px solid #0a0810;margin-left:-8px;font-family:DM Mono,monospace;font-weight:600;flex-shrink:0;cursor:pointer;">+${moreCount}</div>`
      : '';
    avatarsHtml = `<div style="display:flex;align-items:center;flex-shrink:0;">${avList}${more}</div>`;
  }

  // znajomi zapisani na ten bieg — wyróżnienie ("społeczność żyje", zero pusha)
  const rFriends = _raceFriends[race.id] || [];
  let friendsHtml = '';
  if (rFriends.length) {
    const names = rFriends.slice(0, 2).map(f => (f.full_name || '').trim().split(' ')[0]).filter(Boolean);
    const extra = rFriends.length - names.length;
    const label = names.join(', ') + (extra > 0 ? ` +${extra}` : '');
    friendsHtml = `<div style="display:flex;align-items:center;gap:6px;font-size:11px;font-family:'DM Mono',monospace;color:var(--accent);font-weight:600;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Znajomi biegną: ${escHtml(label)}</span>
    </div>`;
  }

  const countLabel = totalCount > 0
    ? `<span onclick="event.stopPropagation();showParticipants('${race.id}','${escAttr(race.name)}')" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;">${totalCount} z BiegaMy</span>`
    : 'Bądź pierwszy!';

  // z1+: kto zgłosił (tylko trener, tylko pending)
  const submitter = (race.status === 'pending' && _isCoach && race.added_by && window._raceSubmitters)
    ? (window._raceSubmitters[race.added_by] || '') : '';
  const submitterHtml = submitter
    ? `<div style="font-size:10px;color:var(--blue);font-family:'DM Mono',monospace;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);">Zgłosił(a): ${escHtml(submitter)}</div>`
    : '';

  return `<div class="race-card" onclick="openRace('${race.id}')">
    <div class="race-card-inner">
      <div class="race-top">
        <div class="race-dist-badge">
          <div class="dist-num">${distNum}</div>
          <div class="dist-unit">${distUnit}</div>
        </div>
        <div class="race-info">
          <div class="race-name">${escHtml(race.name)}${isNew ? ' <span style="font-size:10px;background:rgba(var(--accent-rgb),0.18);color:var(--accent);border-radius:6px;padding:2px 7px;font-family:DM Mono,monospace;letter-spacing:0.08em;vertical-align:middle;font-weight:700;">NOWE</span>' : ''}${isPending ? ' <span style="font-size:10px;background:rgba(78,140,214,0.2);color:var(--blue);border-radius:6px;padding:2px 7px;font-family:DM Mono,monospace;letter-spacing:0.08em;vertical-align:middle;">OCZEKUJE</span>' : ''}${isRejected ? ' <span style="font-size:10px;background:rgba(255,80,80,0.2);color:#ff6060;border-radius:6px;padding:2px 7px;font-family:DM Mono,monospace;letter-spacing:0.08em;vertical-align:middle;">ODRZUCONE</span>' : ''}</div>

// ── FILTER ────────────────────────────────────────────────────────
// Normalizacja - usuwa polskie znaki i lowercase
function _normalize(s) {
  if (!s) return '';
  return s.toString().toLowerCase()
    .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l')
    .replace(/ń/g,'n').replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
}

function getFiltered() {
  var voi = document.getElementById('f-voi')?.value || '';
  var month = document.getElementById('f-month')?.value || '';  // YYYY-MM
  var dateFrom = document.getElementById('adv-date-from')?.value || '';
  var dateTo   = document.getElementById('adv-date-to')?.value || '';

  return _allRaces.filter(r => {
    // Zawodnik widzi tylko approved; trener widzi wszystkie
    if (!_isCoach && r.status !== 'approved') return false;
    // Województwo (dropdown)
    if (voi) {
      var locN = _normalize((r.voivodeship||'') + ' ' + (r.region||'') + ' ' + (r.city||''));
      if (!locN.includes(_normalize(voi))) return false;
    }
    // Miesiąc YYYY-MM
    if (month && r.date) {
      if (!r.date.startsWith(month)) return false;
    }
    // Zakres dat (precyzyjny)
    if (dateFrom && r.date && r.date < dateFrom) return false;
    if (dateTo   && r.date && r.date > dateTo)   return false;
    // Dystans
    const matchDist = matchesDistFilter(r.distance_km, _activeDist);
    if (!matchDist) return false;
    // Search - fuzzy bez polskich znaków
    const qN = _normalize(_searchVal);
    if (qN) {
      const hay = _normalize((r.name||'') + ' ' + (r.city||''));
      if (!hay.includes(qN)) return false;
    }
    return true;
  });
}

function matchesDistFilter(km, filter) {
  if (filter === 'all') return true;
  if (filter === 'ultra') return km > 42.195;
  if (filter === 'other') return ![5,10,21.097,42.195].some(d => Math.abs(km - d) < 0.2) && km <= 42.195;
  return Math.abs(km - parseFloat(filter)) < 0.2;
}

function selectDistChip(el) {
  document.querySelectorAll('.dchip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  _activeDist = el.dataset.dist;

}

// Wskaźnik aktywnych filtrów (chip-y na górze, klik=usuń)
function updateActiveFiltersBar() {
  var bar = document.getElementById('active-filters-bar');
  if (!bar) return;
  var pills = [];
  var voi = document.getElementById('f-voi')?.value;
  var month = document.getElementById('f-month')?.value;
  var df = document.getElementById('adv-date-from')?.value;
  var dt = document.getElementById('adv-date-to')?.value;
  if (voi) pills.push('<span class="afpill">'+_capitalize(voi)+'<button onclick="clearOneFilter(\'voi\')">×</button></span>');
  if (month) {
    var [y,m] = month.split('-');
    var mNames = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
    pills.push('<span class="afpill">'+mNames[parseInt(m)-1]+' '+y+'<button onclick="clearOneFilter(\'month\')">×</button></span>');
  }
  if (df || dt) {
    var label = (df ? df : '...') + ' → ' + (dt ? dt : '...');
    pills.push('<span class="afpill">'+label+'<button onclick="clearOneFilter(\'dates\')">×</button></span>');
  }
  if (_activeDist && _activeDist !== 'all') {
    var distLbl = ({'5':'5 km','10':'10 km','21.097':'Półmaraton','42.195':'Maraton','ultra':'Ultra','other':'Inne'})[_activeDist] || _activeDist;
    pills.push('<span class="afpill">'+distLbl+'<button onclick="clearOneFilter(\'dist\')">×</button></span>');
  }
  if (_searchVal) {
    pills.push('<span class="afpill">"'+_searchVal+'"<button onclick="clearOneFilter(\'search\')">×</button></span>');
  }
  if (pills.length === 0) {
    bar.style.display = 'none';
    bar.innerHTML = '';
  } else {
    bar.style.display = 'flex';
    bar.innerHTML = pills.join('');
  }
}

function _capitalize(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

function clearOneFilter(kind) {
  if (kind === 'voi') document.getElementById('f-voi').value = '';
  else if (kind === 'month') document.getElementById('f-month').value = '';
  else if (kind === 'dates') {
    document.getElementById('adv-date-from').value = '';
    document.getElementById('adv-date-to').value = '';
  }
  else if (kind === 'dist') {
    document.querySelectorAll('.dchip').forEach(c => c.classList.remove('active'));
    document.querySelector('.dchip[data-dist="all"]')?.classList.add('active');
    _activeDist = 'all';
  }
  else if (kind === 'search') {
    document.getElementById('search-input').value = '';
    _searchVal = '';
  }
  filterRaces();
}

function updateFilterBadge() {
  var count = 0;
  if (document.getElementById('f-voi')?.value) count++;
  if (document.getElementById('f-month')?.value) count++;
  if (document.getElementById('adv-date-from')?.value || document.getElementById('adv-date-to')?.value) count++;
  if (_activeDist && _activeDist !== 'all') count++;
  if (_searchVal) count++;
  var badge = document.getElementById('filter-count-badge');
  var btn = document.getElementById('filter-toggle-btn');
  if (badge) {
    if (count > 0) {
      badge.textContent = count;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }
  if (btn) {
    btn.style.borderColor = count > 0 ? 'rgba(var(--accent-rgb),0.5)' : 'var(--border)';
    btn.style.color = count > 0 ? 'var(--accent)' : 'var(--fg2)';
  }
}

// Generowanie listy miesięcy (12 najbliższych)
function _populateMonthOptions() {
  var sel = document.getElementById('f-month');
  if (!sel) return;
  var mNames = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
  var now = new Date();
  var html = '<option value="">— Dowolny —</option>';
  for (var i=0; i<12; i++) {
    var d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    var key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    var label = mNames[d.getMonth()] + ' ' + d.getFullYear();
    html += '<option value="'+key+'">'+label+'</option>';
  }
  sel.innerHTML = html;
}
_populateMonthOptions();

async function approveRace() {
  if (!_currentRace) return;
  const { error } = await _sb.from('races').update({ status: 'approved' }).eq('id', _currentRace.id);
  if (error) { showToast('Błąd: ' + error.message); return; }
  _currentRace.status = 'approved';
  // Aktualizuj lokalnie
  const r = _allRaces.find(r => r.id === _currentRace.id);
  if (r) r.status = 'approved';
  showToast('Zawody zatwierdzone ✓');
  closeModal();
  renderRaces();
}

async function rejectRace() {
  if (!_currentRace) return;
  if (!confirm('Odrzucić propozycję "' + _currentRace.name + '"?')) return;
  const { error } = await _sb.from('races').update({ status: 'rejected' }).eq('id', _currentRace.id);
  if (error) { showToast('Błąd: ' + error.message); return; }
  _currentRace.status = 'rejected';
  const r = _allRaces.find(r => r.id === _currentRace.id);
  if (r) r.status = 'rejected';
  showToast('Propozycja odrzucona');
  closeModal();
  renderRaces();
}

async function deleteRace() {
  if (!_currentRace) return;
  const name = _currentRace.name;
  if (!confirm(`Usunąć "${name}" z kalendarza? Tej operacji nie można cofnąć.`)) return;
  const { error } = await _sb.from('races').delete().eq('id', _currentRace.id);
  if (error) { showToast('Błąd: ' + error.message); return; }
  _allRaces = _allRaces.filter(r => r.id !== _currentRace.id);
  showToast(`"${name}" usunięte ✓`);
  closeModal();
  renderRaces();
}

// ── SIGNUP / UNSIGNUP ─────────────────────────────────────────────
async function toggleSignup() {
  if (!_currentRace) return;
  const id = _currentRace.id;
  const signed = _mySignups.has(id);
  if (signed) {
    await doUnsignup(id);
  } else {
    await doSignup(id);
  }
}

async function quickSignup(e, id) {
  const signed = _mySignups.has(id);
  if (signed) { await doUnsignup(id); }
  else { await doSignup(id); }
}

async function doSignup(raceId) {
  if (!_athleteId) { showToast('Musisz być zalogowany'); return; }
  const race = _allRaces.find(r => r.id === raceId);
  if (!race) return;

  const { error } = await _sb.from('race_signups').upsert({
    race_id: raceId,
    athlete_id: _athleteId
  }, { onConflict: 'race_id,athlete_id' });

  if (error) { showToast('Błąd: ' + error.message); return; }

  _mySignups.add(raceId);

  // Aktualizuj licznik lokalnie
  const r = _allRaces.find(r => r.id === raceId);
  if (r) r.signup_count = (r.signup_count || 0) + 1;

  // Dodaj do celów zawodnika
  await addToGoals(race);

  showToast('Zapisano! Cel dodany do Twojego profilu ✓');
  updateModalSignupBtn(true);
  renderRaces();
}

async function doUnsignup(raceId) {
  if (!_athleteId) return;
  const { error } = await _sb.from('race_signups')
    .delete()
    .eq('race_id', raceId)
    .eq('athlete_id', _athleteId);
  if (error) { showToast('Błąd: ' + error.message); return; }

  _mySignups.delete(raceId);
  const r = _allRaces.find(r => r.id === raceId);
  if (r) r.signup_count = Math.max(0, (r.signup_count || 1) - 1);

  // Usuń też cel powiązany z wyścigiem
  await removeFromGoals(raceId);

  showToast('Zapis usunięty');
  updateModalSignupBtn(false);
  renderRaces();
}

async function addToGoals(race) {
  if (!_athleteId) return;
  // Sprawdź czy cel z tym race_id już istnieje (lub po nazwie dla starych celów)
  const alreadyExists = _athleteGoals.some(g =>
    g.race_id === race.id ||
    (g.name && g.name.toLowerCase() === race.name.toLowerCase())
  );
  if (alreadyExists) {
    // Zaktualizuj cel — dodaj race_id jeśli go nie ma
    var existing = _athleteGoals.find(function(g){ return g.name && g.name.toLowerCase() === race.name.toLowerCase(); });
    if (existing && !existing.race_id) {
      existing.race_id = race.id;
      await _sb.from('athletes').update({ race_goals: JSON.stringify(_athleteGoals) }).eq('id', _athleteId);
    }
    return;
  }

  const newGoal = { name: race.name, date: race.date, race_id: race.id };
  _athleteGoals.push(newGoal);

  await _sb.from('athletes').update({
    race_goals: JSON.stringify(_athleteGoals),
    goal: _athleteGoals[0]?.name || null,
    target_date: _athleteGoals[0]?.date || null
  }).eq('id', _athleteId);
}

// Usuń cel powiązany z wyścigiem (gdy zawodnik się wypisuje)
async function removeFromGoals(raceId) {
  if (!_athleteId) return;
  const idx = _athleteGoals.findIndex(g => g.race_id === raceId);
  if (idx === -1) return;
  _athleteGoals.splice(idx, 1);
  await _sb.from('athletes').update({
    race_goals: JSON.stringify(_athleteGoals),
    goal: _athleteGoals[0]?.name || null,
    target_date: _athleteGoals[0]?.date || null
  }).eq('id', _athleteId);
}

  var distSel = document.getElementById('f-dist');
  var distCustom = document.getElementById('f-dist-custom');
  var customField = document.getElementById('custom-dist-field');
  var d = parseFloat(r.distance_km);
  if (Math.abs(d - 5) < 0.05) distSel.value = '5';
  else if (Math.abs(d - 10) < 0.05) distSel.value = '10';
  else if (Math.abs(d - 21.097) < 0.2) distSel.value = '21.097';
  else if (Math.abs(d - 42.195) < 0.2) distSel.value = '42.195';
  else if (d > 42.195) distSel.value = 'ultra';
  else {
    distSel.value = 'other';
    distCustom.value = r.distance_km;
    customField.style.display = 'block';
  }

  // Brak min date przy edycji (data może być w przeszłości)
  document.getElementById('f-date').removeAttribute('min');

  updateAddRaceUI();
  // Zamknij modal szczegółów + otwórz formularz
  closeModal();
  document.getElementById('add-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeAddRace() {
  document.getElementById('add-overlay').classList.remove('open');
  document.body.style.overflow = '';
  _editingRaceId = null;
  updateAddRaceUI();
}

function handleAddOverlayClick(e) {
  if (e.target === document.getElementById('add-overlay')) closeAddRace();
}

document.getElementById('f-dist').addEventListener('change', function() {
  document.getElementById('custom-dist-field').style.display =
    this.value === 'other' ? 'block' : 'none';
});

async function submitRace() {
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value;
  const distSel = document.getElementById('f-dist').value;
  const city = document.getElementById('f-city').value.trim();
  const voiEl = document.getElementById('f-voivodeship');
  const voivodeship = voiEl ? voiEl.value : '';
  const rules = document.getElementById('f-rules').value.trim();
  const organizer = document.getElementById('f-organizer').value.trim();
  const desc = document.getElementById('f-desc').value.trim();

  if (!name || !date || !city) {
    showToast('Wypełnij nazwę, datę i miasto');
    return;
  }

  let dist_km;
  if (distSel === 'other') {
    dist_km = parseFloat(document.getElementById('f-dist-custom').value);
    if (isNaN(dist_km) || dist_km <= 0) { showToast('Podaj poprawny dystans'); return; }
  } else if (distSel === 'ultra') {
    dist_km = 100; // placeholder
  } else {
    dist_km = parseFloat(distSel);
  }

  const payload = {
    name,
    date,
    distance_km: dist_km,
    city,
    voivodeship: voivodeship || null,
    url_regulamin: rules || null,
    url_organizer: organizer || null,
    description: desc || null,
  };

  let result;
  if (_editingRaceId) {
    // EDIT — update istniejący
    result = await _sb.from('races').update(payload).eq('id', _editingRaceId);
  } else {
    // INSERT — nowy
    payload.status = _isCoach ? 'approved' : 'pending';
    payload.added_by = _athleteId || null;
    payload.signup_count = 0;
    result = await _sb.from('races').insert(payload).select('id').single();
  }

  if (result.error) {
    // Możliwy błąd: kolumna 'voivodeship' nie istnieje. Spróbuj 'region'.
    if (result.error.message && result.error.message.toLowerCase().includes('voivodeship')) {
      delete payload.voivodeship;
      payload.region = voivodeship || null;
      if (_editingRaceId) {
        result = await _sb.from('races').update(payload).eq('id', _editingRaceId);
      } else {
        result = await _sb.from('races').insert(payload).select('id').single();
      }
    }
  }
  if (result.error) { showToast('Błąd: ' + result.error.message); return; }

  if (_editingRaceId) {
    showToast('Zmiany zapisane ✓');
  } else {
    showToast(_isCoach ? 'Zawody dodane do kalendarza ✓' : 'Propozycja wysłana do trenera ✓');
  }

  // z1+: auto-zapis na własny bieg, jeśli zawodnik zaznaczył udział
  if (!_editingRaceId && !_isCoach && _athleteId && result.data && result.data.id) {
    const pc = document.getElementById('f-participate');
    if (pc && pc.checked) {
      const { error: sErr } = await _sb.from('race_signups').upsert(
        { race_id: result.data.id, athlete_id: _athleteId },
        { onConflict: 'race_id,athlete_id' });
      if (!sErr) {
        await _sb.from('races').update({ signup_count: 1 }).eq('id', result.data.id);
        _mySignups.add(result.data.id);
        try { await addToGoals(Object.assign({ id: result.data.id }, payload)); } catch(e) {}
      }
    }
  }

  const wasEditing = !!_editingRaceId;
  closeAddRace();
  _resetRaceForm();

  // Przeładuj listę
  await loadRaces();

  if (!wasEditing && !_isCoach) {
    document.getElementById('pending-notice').style.display = 'flex';
    document.getElementById('pending-text').textContent = 'Twoja propozycja czeka na akceptację trenera';
  }
}

// ── HELPERS ───────────────────────────────────────────────────────
function distanceLabel(km) {
  if (km === 5) return '5 km';
  if (km === 10) return '10 km';
  if (Math.abs(km - 21.097) < 0.2) return 'Półmaraton';
  if (Math.abs(km - 42.195) < 0.2) return 'Maraton';
  if (km > 42.195) return 'Ultra';
  return `${km} km`;
}

function formatDistNum(km) {
  if (Math.abs(km - 21.097) < 0.2) return '21';
  if (Math.abs(km - 42.195) < 0.2) return '42';
  if (km > 42.195) return `${Math.round(km)}`;
  return km % 1 === 0 ? String(km) : km.toFixed(1);
}

function formatDistUnit(km) {
  if (Math.abs(km - 21.097) < 0.2) return '1 km';
  if (Math.abs(km - 42.195) < 0.2) return '2 km';
  return 'km';
}

function formatDistFull(km) {
  if (Math.abs(km - 21.097) < 0.2) return '21,097 km';
  if (Math.abs(km - 42.195) < 0.2) return '42,195 km';
  return `${km} km`;
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('pl-PL', { day:'numeric', month:'long', year:'numeric' });
}

function formatMonth(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('pl-PL', { month:'long', year:'numeric' });
}

function escHtml(s) { return window.escapeHtml(s); }

function escAttr(str) {
  return (str || '').replace(/"/g, '&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
