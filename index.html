/* ══ BIEGAMY LOGIN — PREMIUM UI v3 ═══════════════════════════════════ */
:root{
  --bg:#12111a;
  --card:#1a1924;
  --card2:#1e1d2a;
  --border:rgba(255,255,255,0.09);
  --border2:rgba(255,255,255,0.16);
  --accent:#e8561e;
  --accent2:#ff7040;
  --fg:#f0ede8;
  --fg2:rgba(240,237,232,0.65);
  --muted:#6e6a7c;
  --green:#3db870;
  --red:#e05050;
  --glow-o:rgba(232,86,30,0.32);
  --glow-g:rgba(61,184,112,0.25);
  --tile-shadow:0 16px 56px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.07) inset;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}

/* ── FULL SCREEN BG WITH RUNNERS ─────────────────────────────────────── */
body{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 20px;
  background-image:
    radial-gradient(ellipse 140% 60% at 50% -10%, rgba(232,86,30,0.22) 0%, transparent 58%),
    radial-gradient(ellipse 70% 50% at 95% 70%, rgba(78,140,214,0.10) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 5% 80%, rgba(61,184,112,0.09) 0%, transparent 55%);
  position:relative;overflow:hidden;
}

/* ── CONTAINER ──────────────────────────────────────────────────────── */
.container{width:100%;max-width:400px;position:relative;z-index:1;}

/* ── LOGO ───────────────────────────────────────────────────────────── */
.logo{text-align:center;margin-bottom:36px;}
.logo-text{
  font-family:'Bebas Neue',sans-serif;font-size:52px;
  letter-spacing:0.05em;line-height:1;
  /* gradient text */
  background:linear-gradient(145deg,var(--fg) 30%,rgba(240,237,232,0.6) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.logo-text span{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.logo-sub{
  font-size:9px;letter-spacing:0.38em;text-transform:uppercase;
  color:var(--muted);font-family:'DM Mono',monospace;margin-top:6px;
}

/* ── CARD ───────────────────────────────────────────────────────────── */
.card{
  background:linear-gradient(160deg,rgba(18,15,24,0.97) 0%,rgba(10,9,16,0.98) 100%);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:24px;
  padding:28px 24px;
  box-shadow:var(--tile-shadow);
  position:relative;overflow:hidden;
}
/* top accent line */
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 0%,rgba(232,86,30,0.7) 35%,rgba(78,140,214,0.4) 70%,transparent 100%);
  box-shadow:0 0 24px rgba(232,86,30,0.5);
}
/* noise texture */
.card::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events:none;mix-blend-mode:overlay;
}
/* all children above pseudo-elements */
.card > *{position:relative;z-index:1;}

.card-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.03em;margin-bottom:4px;}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:24px;font-weight:300;}

/* ── TABS ───────────────────────────────────────────────────────────── */
.tabs{
  display:flex;background:rgba(255,255,255,0.04);
  border-radius:13px;padding:3px;gap:3px;margin-bottom:24px;
  border:1px solid rgba(255,255,255,0.06);
}
.tab{
  flex:1;padding:9px;text-align:center;
  font-size:10px;letter-spacing:0.14em;text-transform:uppercase;
  font-family:'DM Mono',monospace;color:var(--muted);
  cursor:pointer;border-radius:11px;border:none;background:transparent;
  transition:all 0.18s;-webkit-tap-highlight-color:transparent;
}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:0 2px 12px rgba(232,86,30,0.35),0 1px 0 rgba(255,255,255,0.1) inset;
}

/* ── FORM FIELDS ────────────────────────────────────────────────────── */
.field{margin-bottom:15px;}
.field label{
  display:block;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:7px;
}
.field input{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.09);
  color:var(--fg);font-family:'DM Sans',sans-serif;font-size:15px;
  padding:13px 16px;border-radius:14px;outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
  -webkit-appearance:none;
}
.field input:focus{
  border-color:rgba(232,86,30,0.5);
  box-shadow:0 0 0 3px rgba(232,86,30,0.1),0 0 20px rgba(232,86,30,0.06);
}
.field input::placeholder{color:var(--muted);}

/* ── ROLE SELECTOR ──────────────────────────────────────────────────── */
.role-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
.role-btn{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:14px;padding:14px 12px;text-align:center;
  cursor:pointer;transition:all 0.18s;
  -webkit-tap-highlight-color:transparent;
}
.role-btn:active{transform:scale(0.97);}
.role-btn.sel{
  border-color:rgba(232,86,30,0.45);
  background:rgba(232,86,30,0.09);
  box-shadow:0 0 18px rgba(232,86,30,0.1),0 4px 16px rgba(0,0,0,0.3);
}
.role-btn.sel::before{display:none;}
.role-icon{
  font-size:24px;margin-bottom:6px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.role-btn.sel .role-icon{color:var(--accent);}
.role-label{
  font-size:10px;letter-spacing:0.14em;text-transform:uppercase;
  font-family:'DM Mono',monospace;color:var(--muted);
}
.role-btn.sel .role-label{color:var(--accent);}

/* ── BUTTON ─────────────────────────────────────────────────────────── */
.btn{
  width:100%;
  background:linear-gradient(135deg,#d44c18,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:14px;
  padding:15px;font-family:'DM Mono',monospace;
  font-size:11px;letter-spacing:0.18em;text-transform:uppercase;
  cursor:pointer;transition:all 0.18s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:8px;
  box-shadow:0 4px 24px rgba(232,86,30,0.4),0 1px 0 rgba(255,255,255,0.1) inset;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{box-shadow:0 6px 32px rgba(232,86,30,0.55);}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none;}

/* ── DIVIDER ────────────────────────────────────────────────────────── */
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07);}
.divider span{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;}

/* ── GOOGLE BTN ─────────────────────────────────────────────────────── */
.btn-google{
  width:100%;
  background:rgba(255,255,255,0.04);
  color:var(--fg);border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:14px;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;
  cursor:pointer;transition:all 0.18s;
  display:flex;align-items:center;justify-content:center;gap:10px;
  -webkit-tap-highlight-color:transparent;
}
.btn-google:hover{border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.07);}
.btn-google:active{transform:scale(0.98);}

/* ── SESSION BANNER ─────────────────────────────────────────────────── */
#session-banner{
  display:none;
  background:rgba(61,184,112,0.08);
  border:1px solid rgba(61,184,112,0.25);
  border-radius:16px;padding:14px 16px;margin-bottom:18px;
}

/* ── ALERT ──────────────────────────────────────────────────────────── */
.alert{border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;display:none;line-height:1.5;}
.alert.error{background:rgba(224,80,80,0.1);border:1px solid rgba(224,80,80,0.28);color:#f08080;}
.alert.success{background:rgba(61,184,112,0.1);border:1px solid rgba(61,184,112,0.28);color:var(--green);}
.alert.show{display:block;}

/* ── SPINNER ────────────────────────────────────────────────────────── */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.25);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── FORGOT ─────────────────────────────────────────────────────────── */
.forgot{text-align:right;margin-top:6px;}
.forgot a{font-size:11px;color:var(--muted);text-decoration:none;font-family:'DM Mono',monospace;letter-spacing:0.08em;transition:color 0.15s;}
.forgot a:hover{color:var(--accent);}

/* ── SUCCESS STATE ──────────────────────────────────────────────────── */
.success-state{text-align:center;padding:24px 0;display:none;}
.success-icon{margin-bottom:16px;display:flex;align-items:center;justify-content:center;}
.success-title{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--green);margin-bottom:8px;letter-spacing:0.04em;}
.success-msg{font-size:13px;color:var(--fg2);line-height:1.65;}
.success-redirect{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:14px;letter-spacing:0.08em;}

/* ── FOOTER ─────────────────────────────────────────────────────────── */
.footer-note{
  text-align:center;font-size:10px;color:var(--muted);
  margin-top:22px;font-family:'DM Mono',monospace;
  letter-spacing:0.08em;opacity:0.7;
}

/* ── ENTRY ANIMATION ────────────────────────────────────────────────── */
.container{animation:loginIn 0.5s cubic-bezier(0.16,1,0.3,1) both;will-change:transform,opacity;}
@keyframes loginIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

/* ── PERF ────────────────────────────────────────────────────────────── */
body::before,body::after{contain:strict;}
.card{contain:layout style;}
.tab,.role-btn,.btn,.btn-google{will-change:transform;}
.spinner{contain:strict;}
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <div class="logo-text">Biega<span>My</span></div>
    <div class="logo-sub">Coaching Biegowy</div>
  </div>

  <div class="card">
    <!-- Baner aktywnej sesji -->
    <div id="session-banner">
      <div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--green);font-family:'DM Mono',monospace;margin-bottom:6px;">Jesteś zalogowany</div>
      <div style="font-size:13px;color:var(--fg);margin-bottom:12px;" id="session-email">—</div>
      <div style="display:flex;gap:8px;">
        <button onclick="continueSession()" style="flex:2;background:linear-gradient(135deg,#2a8a50,var(--green));color:#071209;border:none;border-radius:11px;padding:11px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 14px rgba(61,184,112,0.3);font-weight:600;">Kontynuuj →</button>
        <button onclick="logoutSession()" style="flex:1;background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border);border-radius:11px;padding:11px;font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;">Wyloguj</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Logowanie</button>
      <button class="tab" onclick="switchTab('register')">Rejestracja</button>
    </div>

    <div id="alert-box" class="alert"></div>

    <!-- LOGIN FORM -->
    <div id="form-login">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="jan@kowalski.pl" autocomplete="email">
      </div>
      <div class="field">
        <label>Hasło</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        <div class="forgot"><a href="#" onclick="forgotPassword();return false;">Zapomniałem hasła</a></div>
      </div>
      <button class="btn" id="btn-login" onclick="login()">Zaloguj się →</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="form-register" style="display:none;">
      <div class="field">
        <label>Imię i nazwisko</label>
        <input type="text" id="reg-name" placeholder="Jan Kowalski" autocomplete="name">
      </div>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="reg-email" placeholder="jan@kowalski.pl" autocomplete="email">
      </div>
      <div class="field">
        <label>Hasło (min. 8 znaków)</label>
        <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password">
      </div>

      <!-- WYBÓR ROLI -->
      <div class="field">
        <label>Rejestruję się jako</label>
        <div class="role-row">
          <div class="role-btn sel" id="role-athlete" onclick="selectRole('athlete')">
            <div class="role-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M7.5 13.5 10 11l2 3 2-2 2 4"/><path d="m6 20 3.5-3 2.5 3"/><path d="M12 14c1.5-1 3-2 4.5-1.5"/><path d="M8.5 10.5 10 8l3 1"/></svg>
            </div>
            <div class="role-label">Zawodnik</div>
          </div>
          <div class="role-btn" id="role-coach" onclick="selectRole('coach')">
            <div class="role-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="role-label">Trener</div>
          </div>
        </div>
      </div>

      <!-- Specjalizacja trenera -->
      <div class="field" id="coach-spec-field" style="display:none;">
        <label>Specjalizacja <span style="color:var(--muted);font-weight:400;">(opcjonalnie)</span></label>
        <input type="text" id="reg-spec" placeholder="np. Bieganie długodystansowe">
      </div>

      <!-- Kod dostępu trenera -->
      <div class="field" id="coach-pass-field" style="display:none;">
        <label>Kod dostępu trenera <span style="color:var(--red);font-weight:500;">*</span></label>
        <input type="password" id="reg-coach-pass" placeholder="Kod dostępu"
          style="border-color:rgba(232,86,30,0.3);"
          onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='rgba(232,86,30,0.3)'">
        <div style="font-size:10px;color:var(--muted);margin-top:5px;font-family:'DM Mono',monospace;letter-spacing:0.05em;">
          Konta trenerów są dostępne wyłącznie na zaproszenie.
        </div>
      </div>

      <button class="btn" id="btn-register" onclick="register()">Utwórz konto →</button>
    </div>

    <!-- SUCCESS STATE -->
    <div class="success-state" id="success-state">
      <div class="success-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="20 6 9 17 4 12" stroke-width="2"/></svg>
      </div>
      <div class="success-title">Gotowe!</div>
      <div class="success-msg" id="success-msg">Sprawdź skrzynkę e-mail i kliknij link aktywacyjny.</div>
      <div class="success-redirect" id="success-redirect"></div>
    </div>

    <div class="divider"><span>lub</span></div>

    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Kontynuuj z Google
    </button>
  </div>

  <div class="footer-note">© 2026 BiegaMy.run · Twoje dane są bezpieczne</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

// ── SUPABASE INIT ─────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://afqojgkaveykxbltxzwm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PeK_bJBiBt20Dxm0g5myWg_R1hc3qlY';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedRole = 'athlete';
let currentTab = 'login';

// ── WYBÓR ROLI ────────────────────────────────────────────────────────────────
function selectRole(role) {
  selectedRole = role;
  document.getElementById('role-athlete').classList.toggle('sel', role === 'athlete');
  document.getElementById('role-coach').classList.toggle('sel', role === 'coach');
  document.getElementById('coach-spec-field').style.display = role === 'coach' ? 'block' : 'none';
  document.getElementById('coach-pass-field').style.display = role === 'coach' ? 'block' : 'none';
  const btn = document.getElementById('btn-register');
  btn.textContent = role === 'coach' ? 'Utwórz konto trenera →' : 'Utwórz konto →';
}

// ── CHECK IF ALREADY LOGGED IN ────────────────────────────────────────────────
async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const role = session.user.user_metadata?.role || 'athlete';
  // Zawodnik → auto-redirect od razu
  if (role !== 'coach' && role !== 'trener') {
    window.location.href = 'zawodnik.html';
    return;
  }
  // Trener → pokaż baner z wyborem
  const banner = document.getElementById('session-banner');
  const emailEl = document.getElementById('session-email');
  if (banner) banner.style.display = 'block';
  if (emailEl) emailEl.textContent = session.user.email;
  window._activeSession = session;
}

function continueSession() {
  if (window._activeSession) redirectUser(window._activeSession.user);
}

async function logoutSession() {
  await sb.auth.signOut();
  const banner = document.getElementById('session-banner');
  if (banner) banner.style.display = 'none';
  window._activeSession = null;
  showAlert('Wylogowano pomyślnie.', 'success');
}

function redirectUser(user) {
  const role = user.user_metadata?.role || 'athlete';
  if (role === 'coach' || role === 'trener') {
    window.location.href = 'trener.html';
  } else {
    window.location.href = 'zawodnik.html';
  }
}

// ── TAB SWITCH ────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('success-state').style.display = 'none';
  hideAlert();
}

// ── ALERT ─────────────────────────────────────────────────────────────────────
function showAlert(msg, type = 'error') {
  const el = document.getElementById('alert-box');
  el.textContent = msg;
  el.className = `alert ${type} show`;
}
function hideAlert() {
  document.getElementById('alert-box').className = 'alert';
}

// ── SET LOADING ───────────────────────────────────────────────────────────────
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
  } else {
    btn.disabled = false;
    if (btnId === 'btn-login') {
      btn.innerHTML = 'Zaloguj się →';
    } else {
      btn.innerHTML = selectedRole === 'coach' ? 'Utwórz konto trenera →' : 'Utwórz konto →';
    }
  }
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  if (!email || !password) { showAlert('Wypełnij wszystkie pola'); return; }

  hideAlert();
  setLoading('btn-login', true);

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  setLoading('btn-login', false);

  if (error) {
    const msgs = {
      'Invalid login credentials': 'Nieprawidłowy e-mail lub hasło',
      'Email not confirmed': 'Potwierdź e-mail przed logowaniem',
      'Too many requests': 'Za dużo prób — poczekaj chwilę',
    };
    showAlert(msgs[error.message] || error.message);
    return;
  }

  redirectUser(data.user);
}

// ── REGISTER ──────────────────────────────────────────────────────────────────
let _registering = false;
async function register() {
  if (_registering) return;
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const spec = document.getElementById('reg-spec')?.value.trim() || null;
  const coachPass = document.getElementById('reg-coach-pass')?.value || '';

  if (!name || !email || !password) { showAlert('Wypełnij wszystkie pola'); return; }
  if (password.length < 8) { showAlert('Hasło musi mieć co najmniej 8 znaków'); return; }

  // Weryfikacja kodu trenera
  const COACH_ACCESS_CODE = 'BIEGAMY2026';
  if (selectedRole === 'coach') {
    if (!coachPass) { showAlert('Podaj kod dostępu trenera'); return; }
    if (coachPass.trim().toUpperCase() !== COACH_ACCESS_CODE) {
      showAlert('Nieprawidłowy kod dostępu. Skontaktuj się z BiegaMy.');
      document.getElementById('reg-coach-pass').value = '';
      document.getElementById('reg-coach-pass').focus();
      return;
    }
  }

  hideAlert();
  _registering = true;
  setLoading('btn-register', true);

  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: {
      data: { full_name: name, role: selectedRole }
    }
  });

  setLoading('btn-register', false);
  _registering = false;

  if (error) {
    const msgs = {
      'User already registered': 'Ten e-mail jest już zarejestrowany',
      'Password should be at least 6 characters': 'Hasło musi mieć co najmniej 6 znaków',
    };
    showAlert(msgs[error.message] || error.message);
    return;
  }

  // Jeśli trener i mamy sesję — utwórz wpis w tabeli coaches
  if (selectedRole === 'coach' && data.session) {
    await sb.from('coaches').insert({
      id: data.user.id,
      full_name: name,
      specialization: spec || null
    }).catch(() => {});
  }

  // Zawsze pokaż success — niezależnie czy sesja istnieje (email confirmation może być włączone)
  document.getElementById('form-register').style.display = 'none';
  document.getElementById('success-state').style.display = 'block';

  const roleLabel = selectedRole === 'coach' ? 'trenera' : 'zawodnika';

  if (data.session) {
    // Auto-login (email confirmation wyłączone) — przekieruj od razu
    document.getElementById('success-msg').textContent = `Witaj, ${name}! Konto ${roleLabel} zostało utworzone.`;
    document.getElementById('success-redirect').textContent = 'Przekierowuję...';
    setTimeout(() => {
      window.location.href = selectedRole === 'coach' ? 'trener.html' : 'zawodnik.html?onboarding=1';
    }, 1500);
  } else {
    // Email confirmation włączone — poinformuj i zostań na stronie
    if (selectedRole === 'coach') {
      document.getElementById('success-msg').textContent = `Konto trenera dla ${name} zostało utworzone! Sprawdź skrzynkę ${email} i kliknij link aktywacyjny.`;
      document.getElementById('success-redirect').textContent = 'Po aktywacji zaloguj się tutaj.';
    } else {
      document.getElementById('success-msg').textContent = `Konto zawodnika dla ${name} zostało utworzone! Sprawdź skrzynkę ${email} i kliknij link aktywacyjny.`;
      document.getElementById('success-redirect').textContent = 'Po aktywacji zaloguj się — zostaniesz przywitany przez system.';
    }
  }
}

// ── FORGOT PASSWORD ───────────────────────────────────────────────────────────
async function forgotPassword() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showAlert('Wpisz e-mail żeby zresetować hasło'); return; }

  const { error } = await sb.auth.resetPasswordForEmail(email);
  if (error) { showAlert(error.message); return; }
  showAlert('Link do resetu hasła został wysłany na ' + email, 'success');
}

// ── GOOGLE LOGIN ──────────────────────────────────────────────────────────────
async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin + '/login.html'
    }
  });
  if (error) showAlert('Błąd logowania przez Google: ' + error.message);
}

// ── ENTER KEY ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (currentTab === 'login') login();
    else register();
  }
}, { passive: true });

// ── INIT ──────────────────────────────────────────────────────────────────────
checkSession();

// expose dla inline onclick
window.switchTab = switchTab;
window.selectRole = selectRole;
window.login = login;
window.register = register;
window.forgotPassword = forgotPassword;
window.loginGoogle = loginGoogle;
window.continueSession = continueSession;
window.logoutSession = logoutSession;

}); // end DOMContentLoaded
</script>
</body>
</html>
