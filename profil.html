<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Profil Biegacza · BiegaMy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#07070a;--card:rgba(18,15,24,0.97);--card2:rgba(24,20,32,0.98);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.05);
  --fg:#f0ede8;--fg2:rgba(240,237,232,0.7);--fg3:rgba(240,237,232,0.42);
  --accent:#e8561e;--accent2:#ff7a45;--muted:rgba(240,237,232,0.38);
  --green:#3db870;--blue:#5b8cff;--yellow:#e8b840;--red:#e05050;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;overflow-x:hidden;}

/* ── HERO ── */
.hero{position:relative;height:260px;overflow:hidden;}
.hero-img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,7,10,0.15) 0%,rgba(7,7,10,0.97) 100%);}
.hero-back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;background:rgba(0,0,0,0.4);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--fg);text-decoration:none;}

/* ── AVATAR SECTION ── */
.profile-head{padding:0 20px;margin-top:-56px;position:relative;z-index:2;}
.avatar-row{display:flex;align-items:flex-end;gap:14px;margin-bottom:12px;}
.avatar-wrap{position:relative;flex-shrink:0;}
.avatar{width:88px;height:88px;border-radius:50%;border:3px solid var(--bg);object-fit:cover;background:rgba(232,86,30,0.2);}
.avatar-initials{width:88px;height:88px;border-radius:50%;border:3px solid var(--bg);background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:32px;color:#fff;letter-spacing:0.05em;}
.avatar-edit{position:absolute;bottom:2px;right:2px;background:var(--accent);border:2px solid var(--bg);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;}
.action-btns{flex:1;display:flex;flex-direction:column;gap:7px;align-items:flex-end;padding-bottom:4px;}

/* Friend / Follow buttons */
.btn-friend{border-radius:10px;padding:8px 16px;font-size:11px;font-family:DM Mono,monospace;letter-spacing:0.08em;cursor:pointer;border:1px solid;transition:all 0.15s;white-space:nowrap;}
.btn-friend.add{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-friend.pending{background:rgba(232,86,30,0.1);border-color:rgba(232,86,30,0.3);color:var(--accent);}
.btn-friend.friends{background:rgba(61,184,112,0.12);border-color:rgba(61,184,112,0.35);color:var(--green);}
.btn-follow{border-radius:10px;padding:7px 14px;font-size:10px;font-family:DM Mono,monospace;letter-spacing:0.08em;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--fg2);transition:all 0.15s;}
.btn-follow.following{border-color:rgba(91,140,255,0.4);color:var(--blue);background:rgba(91,140,255,0.08);}
.btn-msg{border-radius:10px;padding:7px 14px;font-size:10px;font-family:DM Mono,monospace;letter-spacing:0.08em;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--fg2);transition:all 0.15s;display:flex;align-items:center;gap:5px;}
.btn-msg:hover{border-color:rgba(232,86,30,0.4);}

.profile-name{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:0.04em;line-height:1;margin-bottom:4px;}
.profile-quote{font-size:13px;color:var(--fg3);line-height:1.5;font-style:italic;margin-bottom:10px;}

/* Stats row */
.profile-stats{display:flex;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.ps-item{flex:1;text-align:center;padding:10px 6px;border-right:1px solid var(--border);}
.ps-item:last-child{border-right:none;}
.ps-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--fg);line-height:1;}
.ps-lbl{font-size:9px;font-family:DM Mono,monospace;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-top:2px;}

/* ── SECTIONS ── */
.section{padding:0 20px;margin-bottom:20px;}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.06em;color:var(--fg);}
.section-title span{color:var(--accent);}
.section-add{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:11px;font-family:DM Mono,monospace;padding:4px 10px;cursor:pointer;}
.section-add:hover{border-color:var(--accent);color:var(--accent);}

/* PBs grid */
.pbs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pb-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden;}
.pb-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);}
.pb-dist{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-family:DM Mono,monospace;margin-bottom:4px;}
.pb-time{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--fg);line-height:1;}
.pb-empty{color:var(--fg3);font-size:18px;}
.pb-pace{font-size:10px;color:var(--fg3);font-family:DM Mono,monospace;margin-top:2px;}

/* Goals */
.goal-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;}
.goal-date-badge{flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;padding:5px 8px;text-align:center;min-width:42px;}
.goal-date-day{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;color:#fff;}
.goal-date-mon{font-size:8px;font-family:DM Mono,monospace;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.8);}
.goal-name{font-size:13px;font-weight:500;color:var(--fg);flex:1;}
.goal-days{font-size:10px;font-family:DM Mono,monospace;color:var(--fg3);}

/* Badges */
.badges-row{display:flex;flex-wrap:wrap;gap:8px;}
.badge-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2);}
.badge-icon{font-size:16px;}

/* Posts grid */
.posts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.post-photo{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;cursor:pointer;}
.post-photo img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s;}
.post-photo:hover img{transform:scale(1.03);}
.post-photo-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.6) 0%,transparent 50%);opacity:0;transition:opacity 0.2s;}
.post-photo:hover .post-photo-overlay{opacity:1;}
.post-photo-del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);border:none;border-radius:6px;color:#fff;font-size:10px;padding:3px 7px;cursor:pointer;display:none;}
.post-photo:hover .post-photo-del{display:block;}

.post-quote{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;grid-column:span 2;}
.post-quote-text{font-size:15px;line-height:1.7;color:var(--fg);font-style:italic;}
.post-quote-text::before{content:'"';font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--accent);line-height:0.5;display:block;margin-bottom:8px;}
.post-quote-del{position:absolute;top:8px;right:8px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--fg3);font-size:10px;padding:2px 7px;cursor:pointer;}
.post-date{font-size:10px;font-family:DM Mono,monospace;color:var(--muted);margin-top:8px;}

/* ── ADD POST SHEET ── */
.add-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.add-overlay.open{opacity:1;pointer-events:all;}
.add-sheet{width:100%;max-width:480px;background:var(--card2);border-radius:24px 24px 0 0;padding:0 20px env(safe-area-inset-bottom,24px);transform:translateY(60px);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.add-overlay.open .add-sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.15);margin:12px auto 16px;}
.sheet-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.04em;margin-bottom:16px;}
.sheet-title span{color:var(--accent);}
.type-tabs{display:flex;gap:8px;margin-bottom:16px;}
.type-tab{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-size:11px;font-family:DM Mono,monospace;letter-spacing:0.08em;color:var(--fg3);transition:all 0.15s;}
.type-tab.active{background:rgba(232,86,30,0.15);border-color:rgba(232,86,30,0.5);color:var(--accent);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-family:DM Mono,monospace;margin-bottom:6px;}
.field textarea,.field input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:11px 14px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;}
.field textarea{min-height:90px;}
.field textarea:focus,.field input:focus{border-color:rgba(232,86,30,0.5);}
.upload-area{border:1px dashed rgba(232,86,30,0.4);border-radius:12px;padding:24px;text-align:center;cursor:pointer;color:var(--fg3);font-size:13px;transition:border-color 0.15s;}
.upload-area:hover{border-color:var(--accent);}
.upload-preview{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-top:10px;display:none;}
.sheet-submit{width:100%;background:var(--accent);border:none;color:#fff;border-radius:12px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}
.sheet-cancel{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--fg3);border-radius:12px;padding:12px;font-size:13px;cursor:pointer;margin-top:8px;}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(22,18,30,0.97);border:1px solid rgba(255,255,255,0.1);color:var(--fg);border-radius:14px;padding:11px 20px;font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:9999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Loader */
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Empty state */
.empty{text-align:center;padding:32px 20px;color:var(--fg3);font-size:13px;font-family:DM Mono,monospace;line-height:1.8;}
.empty svg{opacity:0.25;margin-bottom:12px;}

.bottom-pad{height:env(safe-area-inset-bottom,20px);height:calc(env(safe-area-inset-bottom,0px) + 20px);}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.lightbox.open{opacity:1;pointer-events:all;}
.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:8px;}
.lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* ── HERO SLIDESHOW ─────────────────────────────────── */
.p-hero-wrap{position:relative;margin:0 16px 0;border-radius:18px;overflow:hidden;}
.p-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:0;transition:opacity 0.5s ease;z-index:0;border-radius:inherit;}
.p-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,5,12,0.1) 0%,rgba(7,5,12,0.0) 40%,rgba(7,5,12,0.55) 100%);z-index:1;border-radius:inherit;}
.p-hero-inner{position:relative;z-index:2;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;}
.p-hero-dots{display:flex;gap:4px;align-items:center;}
.p-hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.35);cursor:pointer;transition:all 0.25s;border:none;}
.p-hero-dot.active{background:var(--accent);width:18px;border-radius:3px;}

/* ── TILES ──────────────────────────────────────────── */
.p-tiles-row{display:flex;gap:10px;margin:8px 16px 4px;}
.p-hero-tile{flex:1;border-radius:18px;overflow:hidden;position:relative;min-height:200px;}
.p-tiles-right{display:flex;flex-direction:column;gap:8px;width:88px;flex-shrink:0;}
.p-tile-btn{flex:1;background:none;border:none;border-radius:12px;padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>

<!-- HERO + KAFELKI -->
<div style="padding-top:calc(env(safe-area-inset-top,0px) + 8px);position:relative;">
  <a class="hero-back" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;z-index:10;background:rgba(0,0,0,0.4);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--fg);text-decoration:none;" href="javascript:history.back()">‹</a>

  <div class="p-tiles-row">
    <!-- Hero karta z slideshow -->
    <div class="p-hero-tile">
      <div class="p-hero-bg" id="p-hero-bg"></div>
      <div class="p-hero-overlay"></div>
      <div class="p-hero-inner">
        <div style="display:flex;align-items:center;gap:6px;">
          <button onclick="_pHeroPrev()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;width:22px;height:22px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;">‹</button>
          <div id="p-hero-dots" class="p-hero-dots"></div>
          <button onclick="_pHeroNext()" style="background:rgba(255,255,255,0.12);border:none;color:#fff;width:22px;height:22px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;">›</button>
        </div>
      </div>
    </div>

    <!-- Kafelki po prawej -->
    <div class="p-tiles-right">
      <button class="p-tile-btn" onclick="location.href='zawodnik.html'" title="Wyzwania">
        <img src="https://afqojgkaveykxbltxzwm.supabase.co/storage/v1/object/public/biegamy-assets/tile-wyzwania.webp" style="width:80px;height:80px;object-fit:cover;border-radius:50%;box-shadow:0 2px 12px rgba(232,86,30,0.4);" onerror="this.parentElement.style.background='rgba(255,255,255,0.05)'">
      </button>
      <button class="p-tile-btn" onclick="location.href='zawodnik.html'" title="Czat">
        <img src="https://afqojgkaveykxbltxzwm.supabase.co/storage/v1/object/public/biegamy-assets/tile-czat.webp" style="width:80px;height:80px;object-fit:cover;border-radius:50%;box-shadow:0 2px 12px rgba(232,86,30,0.4);" onerror="this.parentElement.style.background='rgba(255,255,255,0.05)'">
      </button>
      <button class="p-tile-btn" onclick="location.href='odznaki.html'" title="Odznaki">
        <img src="https://afqojgkaveykxbltxzwm.supabase.co/storage/v1/object/public/biegamy-assets/tile-odznaki.webp" style="width:80px;height:80px;object-fit:cover;border-radius:50%;box-shadow:0 2px 12px rgba(232,86,30,0.4);" onerror="this.parentElement.style.background='rgba(255,255,255,0.05)'">
      </button>
      <button class="p-tile-btn" onclick="location.href='races.html'" title="Starty">
        <img src="https://afqojgkaveykxbltxzwm.supabase.co/storage/v1/object/public/biegamy-assets/tile-races.webp" style="width:80px;height:80px;object-fit:cover;border-radius:50%;box-shadow:0 2px 12px rgba(232,86,30,0.4);" onerror="this.parentElement.style.background='rgba(255,255,255,0.05)'">
      </button>
    </div>
  </div>
</div>

<!-- PROFILE HEAD -->
<div class="profile-head">
  <div class="avatar-row">
    <div class="avatar-wrap">
      <div class="avatar-initials" id="av-initials">?</div>
      <img class="avatar" id="av-img" style="display:none;position:absolute;inset:0;" alt="">
      <div class="avatar-edit" id="av-edit-btn" style="display:none;" onclick="document.getElementById('av-upload').click()">✎</div>
      <input type="file" id="av-upload" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
    </div>
    <div class="action-btns" id="action-btns">
      <!-- Wypełniane przez JS -->
    </div>
  </div>

  <div class="profile-name" id="profile-name">—</div>
  <div class="profile-quote" id="profile-quote" style="display:none;"></div>

  <!-- Prywatność (tylko własny profil) -->
  <div id="privacy-row" style="display:none;margin-bottom:10px;">
    <button id="privacy-btn" onclick="togglePrivacy()" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--fg2);border-radius:10px;padding:7px 14px;font-size:11px;font-family:DM Mono,monospace;letter-spacing:0.06em;cursor:pointer;display:flex;align-items:center;gap:6px;"></button>
  </div>

  <!-- Statystyki -->
  <div class="profile-stats">
    <div class="ps-item" onclick="switchProfileTab('friends')" style="cursor:pointer;">
      <div class="ps-val" id="ps-friends">—</div>
      <div class="ps-lbl">Znajomi</div>
    </div>
    <div class="ps-item" onclick="openFollowersList()" style="cursor:pointer;">
      <div class="ps-val" id="ps-followers">—</div>
      <div class="ps-lbl">Obserwuje</div>
    </div>
    <div class="ps-item" onclick="openTrainingsList()" style="cursor:pointer;">
      <div class="ps-val" id="ps-logs">—</div>
      <div class="ps-lbl">Treningi</div>
    </div>
    <div class="ps-item">
      <div class="ps-val" id="ps-km">—</div>
      <div class="ps-lbl">km łącznie</div>
    </div>
  </div>
</div>

<!-- TABS -->
<div style="padding:0 20px;margin-bottom:16px;">
  <div style="display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;">
    <button id="ptab-profile" onclick="switchProfileTab('profile')" style="flex:1;background:rgba(232,86,30,0.12);color:var(--accent);border:none;font-family:DM Mono,monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:9px 4px;cursor:pointer;">Profil</button>
    <button id="ptab-friends" onclick="switchProfileTab('friends')" style="flex:1;background:transparent;color:var(--muted);border:none;border-left:1px solid var(--border);font-family:DM Mono,monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:9px 4px;cursor:pointer;" style="position:relative;">Znajomi<span id="profil-friends-badge" style="display:none;position:absolute;top:4px;right:4px;background:var(--accent);width:6px;height:6px;border-radius:50%;"></span></button>
    <button id="ptab-find" onclick="switchProfileTab('find')" style="flex:1;background:transparent;color:var(--muted);border:none;border-left:1px solid var(--border);font-family:DM Mono,monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:9px 4px;cursor:pointer;">Znajdź</button>
  </div>
</div>

<!-- TAB: PROFIL -->
<div id="tab-profile">

<!-- ZYCIÓWKI -->
<div class="section">
  <div class="section-hdr">
    <div class="section-title">Życ<span>iówki</span></div>
  </div>
  <div class="pbs-grid" id="pbs-grid">
    <div class="pb-card skeleton" style="height:70px;"></div>
    <div class="pb-card skeleton" style="height:70px;"></div>
    <div class="pb-card skeleton" style="height:70px;"></div>
    <div class="pb-card skeleton" style="height:70px;"></div>
  </div>
</div>

<!-- CELE / STARTY -->
<div class="section" id="goals-section">
  <div class="section-hdr">
    <div class="section-title">Cele i <span>Starty</span></div>
    <button id="add-goal-btn" style="display:none;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:11px;font-family:DM Mono,monospace;cursor:pointer;" onclick="addGoalPrompt()">+ Cel</button>
  </div>
  <div id="goals-list"><div class="skeleton" style="height:56px;border-radius:12px;margin-bottom:8px;"></div></div>
</div>

<!-- POSTY (zdjęcia + cytaty) -->
<div class="section">
  <div class="section-hdr">
    <div class="section-title">Post<span>y</span></div>
    <button class="section-add" id="add-post-btn" style="display:none;" onclick="openAddPost()">+ Dodaj</button>
  </div>
  <div id="posts-container">
    <div class="skeleton" style="height:160px;border-radius:12px;"></div>
  </div>
</div>

</div><!-- /tab-profile -->

<!-- TAB: ZNAJOMI -->
<div id="tab-friends" style="display:none;padding:0 20px;">
  <div id="profile-friends-content" style="padding-top:4px;"></div>
</div>

<!-- TAB: ZNAJDŹ -->
<div id="tab-find" style="display:none;padding:0 20px;">
  <div style="position:relative;margin-bottom:12px;margin-top:4px;">
    <input id="profile-search-inp" type="text" placeholder="Szukaj biegaczy po imieniu..." oninput="profileSearch(this.value)"
      style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--fg);font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 14px 11px 40px;border-radius:10px;outline:none;box-sizing:border-box;"
      onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
    <svg style="position:absolute;left:13px;top:50%;transform:translateY(-50%);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
  <div id="profile-search-results"><div style="text-align:center;padding:32px 0;color:var(--muted);font-size:12px;">Wpisz imię żeby szukać</div></div>
</div>

<div style="height:90px;"></div>

<!-- ADD POST SHEET -->
<div class="add-overlay" id="add-overlay" onclick="handleAddClick(event)">
  <div class="add-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Nowy <span>Post</span></div>
    <div class="type-tabs">
      <div class="type-tab active" id="tab-photo" onclick="switchPostType('photo')">📷 Zdjęcie</div>
      <div class="type-tab" id="tab-quote" onclick="switchPostType('quote')">" Cytat</div>
    </div>

    <!-- Photo form -->
    <div id="form-photo">
      <div class="upload-area" onclick="document.getElementById('post-img-input').click()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:8px;opacity:0.4;"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <div>Kliknij żeby dodać zdjęcie</div>
        <input type="file" id="post-img-input" accept="image/*" style="display:none" onchange="previewPostImg(this)">
      </div>
      <img id="post-img-preview" class="upload-preview" alt="">
      <div class="field" style="margin-top:12px;">
        <label>Opis (opcjonalnie)</label>
        <textarea id="post-photo-desc" placeholder="Co to za bieg?"></textarea>
      </div>
    </div>

    <!-- Quote form -->
    <div id="form-quote" style="display:none;">
      <div class="field">
        <label>Twój cytat motywacyjny</label>
        <textarea id="post-quote-text" placeholder="Np. Każdy kilometr to krok bliżej do siebie..." style="min-height:120px;"></textarea>
      </div>
    </div>

    <button class="sheet-submit" onclick="submitPost()">Opublikuj →</button>
    <button class="sheet-cancel" onclick="closeAddPost()">Anuluj</button>
    <div style="height:8px;"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const _sb = supabase.createClient(
  'https://afqojgkaveykxbltxzwm.supabase.co',
  'sb_publishable_PeK_bJBiBt20Dxm0g5myWg_R1hc3qlY'
);

let _myId = null;       // mój athlete ID
let _targetId = null;   // oglądany profil (może być mój)
let _isOwnProfile = false;
let _isCoach = false;
let _friendStatus = null; // null | 'pending_sent' | 'pending_received' | 'accepted'
let _isFollowing = false;
let _postType = 'photo';
let _postImgFile = null;
let _profileData = null;

// ── INIT ──────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }

  // Sprawdź czy trener
  const { data: coachRow } = await _sb.from('coaches').select('id').eq('id', session.user.id).maybeSingle();
  _isCoach = !!coachRow;

  // Mój athlete ID
  const { data: me } = await _sb.from('athletes').select('id').eq('user_id', session.user.id).maybeSingle();
  _myId = me?.id || null;

  // Target: ?id=UUID lub własny profil
  const params = new URLSearchParams(location.search);
  const targetUserId = params.get('id');

  if (targetUserId && targetUserId !== me?.id) {
    // Cudzý profil — id to athlete_id
    _targetId = targetUserId;
    _isOwnProfile = false;
  } else {
    _targetId = _myId;
    _isOwnProfile = true;
  }

  if (!_targetId) {
    document.getElementById('profile-name').textContent = 'Brak profilu';
    return;
  }

  // Pokaż przyciski edycji od razu (własny profil)
  if (_isOwnProfile) {
    ['add-post-btn','add-goal-btn'].forEach(function(id){var el=document.getElementById(id);if(el)el.style.display='block';});
    var ae=document.getElementById('av-edit-btn');if(ae)ae.style.display='flex';
    var pr=document.getElementById('privacy-row');if(pr)pr.style.display='block';
  }

  // Sprawdź prywatność cudzego profilu przed załadowaniem
  if (!_isOwnProfile) {
    const { data: privCheck } = await _sb.from('athletes')
      .select('is_public,full_name')
      .eq('id', _targetId)
      .maybeSingle();
    if (privCheck && !privCheck.is_public) {
      const initials = (privCheck.full_name||'?').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
      document.getElementById('profile-name').textContent = privCheck.full_name || 'Biegacz';
      document.getElementById('av-initials').textContent = initials;
      document.querySelector('.profile-head').insertAdjacentHTML('beforeend',
        '<div style="text-align:center;padding:32px 20px;color:var(--muted);font-size:13px;line-height:1.8;">'+
        '<div style="font-size:36px;margin-bottom:12px;">🔒</div>'+
        '<div style="font-weight:600;color:var(--fg2);margin-bottom:6px;">Profil prywatny</div>'+
        '<div>Ten zawodnik ma prywatny profil.</div></div>'
      );
      ['tab-profile','tab-friends','tab-find'].forEach(function(id){var el=document.getElementById(id);if(el)el.style.display='none';});
      var tr=document.querySelector('.p-tiles-row');if(tr)tr.style.display='none';
      var tabs=document.querySelector('[id^="ptab"]');
      document.querySelectorAll('[id^="ptab"]').forEach(function(b){b.style.display='none';});
      await loadFriendStatus();
      renderActionBtns();
      return;
    }
  }

  await Promise.all([
    loadProfile(),
    loadStats(),
    loadFriendStatus(),
    loadPosts(),
  ]);

  renderActionBtns();
  if(_isOwnProfile)checkProfilFriendRequests();
  var _tp=new URLSearchParams(location.search).get('tab');if(_tp)setTimeout(function(){switchProfileTab(_tp);},300);
})();

// ── LOAD PROFILE ─────────────────────────────────────────────────
async function loadProfile() {
  const { data: ath } = await _sb.from('athletes')
    .select('id,full_name,goal,target_date,race_goals,pb_marathon,pb_half,pb_10k,pb_5k,avatar_url,is_public')
    .eq('id', _targetId)
    .maybeSingle();
  if (!ath) return;
  _profileData = ath;

  // Imię
  const name = ath.full_name || 'Biegacz';
  document.getElementById('profile-name').textContent = name;
  document.title = name + ' · BiegaMy';

  // Inicjały / avatar
  const initials = name.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('av-initials').textContent = initials;
  if (ath.avatar_url) {
    const img = document.getElementById('av-img');
    img.src = ath.avatar_url;
    img.style.display = 'block';
    document.getElementById('av-initials').style.display = 'none';
  }

  // Edit avatar tylko dla własnego profilu
  if (_isOwnProfile) {
    document.getElementById('av-edit-btn').style.display = 'flex';
    document.getElementById('add-post-btn').style.display = 'block';
    // Ustaw stan prywatności
    updatePrivacyBtn(!!ath.is_public);
  }

  // PBs
  renderPBs(ath);

  // Cele
  renderGoals(ath);

  // Odznaki (z training_logs)
  loadBadges();
}

function renderPBs(ath) {
  const pbs = [
    { dist: '5 KM', key: 'pb_5k', val: ath.pb_5k },
    { dist: '10 KM', key: 'pb_10k', val: ath.pb_10k },
    { dist: 'PÓŁMARATON', key: 'pb_half', val: ath.pb_half },
    { dist: 'MARATON', key: 'pb_marathon', val: ath.pb_marathon },
  ];
  var canEdit = _isOwnProfile;
  document.getElementById('pbs-grid').innerHTML = pbs.map(function(pb) {
    return '<div class="pb-card"' + (canEdit ? ' onclick="editPB(\''+pb.key+'\',\''+pb.dist+'\',\''+( pb.val||'')+'\')" style="cursor:pointer;"' : '') + '>'
      + '<div class="pb-dist">' + pb.dist + '</div>'
      + (pb.val ? '<div class="pb-time">' + pb.val + '</div>'
                : '<div class="pb-empty">' + (canEdit ? '<span style="font-size:11px;color:var(--accent);">+ Dodaj</span>' : '—') + '</div>')
      + (canEdit ? '<div style="font-size:9px;color:var(--muted);font-family:DM Mono,monospace;margin-top:3px;">✎ edytuj</div>' : '')
      + '</div>';
  }).join('');
}

function editPB(key, label, current) {
  const val = prompt('Wpisz wynik ' + label + ' (np. 45:30 lub 1:52:10):', current || '');
  if (val === null) return; // anulowano
  savePB(key, val.trim());
}

async function savePB(key, val) {
  if (!_myId) return;
  const upd = {};
  upd[key] = val || null;
  const { error } = await _sb.from('athletes').update(upd).eq('id', _myId);
  if (error) { showToast('Błąd: ' + error.message); return; }
  if (_profileData) _profileData[key] = val;
  showToast('Zyciówka zapisana ✓');
  renderPBs(_profileData);
}

function renderGoals(ath) {
  let goals = [];
  try { goals = JSON.parse(ath.race_goals || '[]'); } catch(e) {}
  if (ath.goal && ath.target_date) {
    if (!goals.some(g => g.name === ath.goal)) {
      goals.unshift({ name: ath.goal, date: ath.target_date });
    }
  }
  const upcoming = goals.filter(g => g.date && new Date(g.date + 'T00:00:00') >= new Date()).sort((a,b) => new Date(a.date) - new Date(b.date));
  const el = document.getElementById('goals-list');
  if (!upcoming.length) {
    el.innerHTML = '<div class="empty">Brak nadchodzących startów</div>';
    return;
  }
  el.innerHTML = upcoming.slice(0,5).map((g, i) => {
    const d = new Date(g.date + 'T00:00:00');
    const day = d.getDate();
    const mon = d.toLocaleDateString('pl-PL', { month: 'short' }).replace('.','').toUpperCase();
    const daysLeft = Math.ceil((d - new Date()) / 86400000);
    var raceName = encodeURIComponent(g.name);
    return '<div class="goal-item" onclick="openRaceDetails(\'' + escHtml(g.name) + '\')" style="cursor:pointer;" onmouseover="this.style.borderColor=\'rgba(232,86,30,0.4)\'" onmouseout="this.style.borderColor=\'var(--border)\'">'
      + '<div class="goal-date-badge"><div class="goal-date-day">'+day+'</div><div class="goal-date-mon">'+mon+'</div></div>'
      + '<div class="goal-name">'+escHtml(g.name)+'<div style="font-size:10px;color:var(--accent);font-family:DM Mono,monospace;margin-top:2px;">👥 Kto bierze udział?</div></div>'
      + '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">'
      + '<div class="goal-days">'+(daysLeft > 0 ? 'za '+daysLeft+' dni' : 'dziś!')+'</div>'
      + (_isOwnProfile ? '<button onclick="event.stopPropagation();removeGoal('+i+')" style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 2px;">×</button>' : '')
      + '</div>'
      + '</div>';
  }).join('');
}

async function loadBadges() {
  const { data: logs } = await _sb.from('training_logs')
    .select('training_type')
    .like('training_type', '__badge__%')
    .eq('athlete_id', _targetId);
  if (!logs?.length) return;
  const badgeSect = document.getElementById('badges-section');
  badgeSect.style.display = 'block';
  const badgeMap = {
    '__badge__first_log': { icon: '🏃', label: 'Pierwsza trasa' },
    '__badge__10_logs':   { icon: '🔟', label: '10 treningów' },
    '__badge__100km':     { icon: '💯', label: '100 km' },
    '__badge__marathon':  { icon: '🏅', label: 'Maratończyk' },
    '__badge__streak_7':  { icon: '🔥', label: 'Tydzień z rzędu' },
  };
  const badgesList = document.getElementById('badges-list');
  badgesList.innerHTML = logs.map(l => {
    const b = badgeMap[l.training_type] || { icon: '⭐', label: l.training_type.replace('__badge__','') };
    return `<div class="badge-item"><span class="badge-icon">${b.icon}</span>${b.label}</div>`;
  }).join('');
}

// ── STATS ─────────────────────────────────────────────────────────
async function loadStats() {
  // Znajomi
  const { data: fr } = await _sb.from('friendships')
    .select('id')
    .eq('status', 'accepted')
    .or(`requester_id.eq.${_targetId},addressee_id.eq.${_targetId}`);
  document.getElementById('ps-friends').textContent = fr?.length || 0;

  // Obserwujący (follows)
  const { data: fol } = await _sb.from('follows').select('id').eq('following_id', _targetId);
  document.getElementById('ps-followers').textContent = fol?.length || 0;

  // Treningi + km
  const { data: logs } = await _sb.from('training_logs')
    .select('distance_km')
    .eq('athlete_id', _targetId)
    .not('training_type', 'like', '__badge__%');
  const totalKm = (logs || []).reduce((s, l) => s + (parseFloat(l.distance_km) || 0), 0);
  document.getElementById('ps-logs').textContent = logs?.length || 0;
  document.getElementById('ps-km').textContent = totalKm > 0 ? Math.round(totalKm) : '0';
}

// ── FRIEND STATUS ─────────────────────────────────────────────────
async function loadFriendStatus() {
  if (!_myId || _isOwnProfile) return;
  const { data } = await _sb.from('friendships')
    .select('id,status,requester_id')
    .or(`and(requester_id.eq.${_myId},addressee_id.eq.${_targetId}),and(requester_id.eq.${_targetId},addressee_id.eq.${_myId})`)
    .maybeSingle();

  if (!data) { _friendStatus = null; }
  else if (data.status === 'accepted') { _friendStatus = 'accepted'; }
  else if (data.status === 'pending') {
    _friendStatus = data.requester_id === _myId ? 'pending_sent' : 'pending_received';
  }

  // Follow status
  const { data: fol } = await _sb.from('follows')
    .select('id')
    .eq('follower_id', _myId)
    .eq('following_id', _targetId)
    .maybeSingle();
  _isFollowing = !!fol;
}

// ── ACTION BUTTONS ─────────────────────────────────────────────────
function renderActionBtns() {
  const el = document.getElementById('action-btns');
  if (_isOwnProfile) { el.innerHTML = ''; return; }

  let friendBtn = '';
  if (_friendStatus === null) {
    friendBtn = `<button class="btn-friend add" onclick="sendFriendRequest()">+ Dodaj do znajomych</button>`;
  } else if (_friendStatus === 'pending_sent') {
    friendBtn = `<button class="btn-friend pending" onclick="cancelFriendRequest()">⏳ Wysłano zaproszenie</button>`;
  } else if (_friendStatus === 'pending_received') {
    friendBtn = `<button class="btn-friend add" onclick="acceptFriendRequest()">✓ Akceptuj zaproszenie</button>`;
  } else if (_friendStatus === 'accepted') {
    friendBtn = `<button class="btn-friend friends" onclick="removeFriend()">✓ Znajomi</button>`;
  }

  const followBtn = `<button class="btn-follow${_isFollowing ? ' following' : ''}" onclick="toggleFollow()">
    ${_isFollowing ? '✓ Obserwujesz' : '+ Obserwuj'}
  </button>`;

  const msgBtn = _friendStatus === 'accepted'
    ? `<button class="btn-msg" onclick="openChat()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Napisz
      </button>` : '';

  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">${friendBtn}${followBtn}${msgBtn}</div>`;
}

// ── FRIEND ACTIONS ─────────────────────────────────────────────────
async function sendFriendRequest() {
  if (!_myId) return;
  const { error } = await _sb.from('friendships').insert({ requester_id: _myId, addressee_id: _targetId });
  if (error) { showToast('Błąd: ' + error.message); return; }
  _friendStatus = 'pending_sent';
  renderActionBtns();
  showToast('Zaproszenie wysłane ✓');
}

async function cancelFriendRequest() {
  const { error } = await _sb.from('friendships').delete()
    .eq('requester_id', _myId).eq('addressee_id', _targetId);
  if (error) { showToast('Błąd: ' + error.message); return; }
  _friendStatus = null;
  renderActionBtns();
  showToast('Zaproszenie anulowane');
}

async function acceptFriendRequest() {
  const { error } = await _sb.from('friendships').update({ status: 'accepted', updated_at: new Date().toISOString() })
    .eq('requester_id', _targetId).eq('addressee_id', _myId);
  if (error) { showToast('Błąd: ' + error.message); return; }
  _friendStatus = 'accepted';
  renderActionBtns();
  document.getElementById('ps-friends').textContent = parseInt(document.getElementById('ps-friends').textContent || 0) + 1;
  showToast('Jesteście znajomymi! 🎉');
}

async function removeFriend() {
  if (!confirm('Usunąć z znajomych?')) return;
  const { error } = await _sb.from('friendships').delete()
    .or(`and(requester_id.eq.${_myId},addressee_id.eq.${_targetId}),and(requester_id.eq.${_targetId},addressee_id.eq.${_myId})`);
  if (error) { showToast('Błąd: ' + error.message); return; }
  _friendStatus = null;
  renderActionBtns();
  showToast('Usunięto z znajomych');
}

async function toggleFollow() {
  if (!_myId) return;
  if (_isFollowing) {
    await _sb.from('follows').delete().eq('follower_id', _myId).eq('following_id', _targetId);
    _isFollowing = false;
  } else {
    await _sb.from('follows').insert({ follower_id: _myId, following_id: _targetId });
    _isFollowing = true;
  }
  renderActionBtns();
}

function openChat() { _openPeerChat(_targetId,_profileData&&_profileData.full_name?_profileData.full_name:'Znajomy'); }

// ── AVATAR UPLOAD ─────────────────────────────────────────────────
async function uploadAvatar(input) {
  if (!input.files[0] || !_myId) return;
  const file = input.files[0];
  const ext = file.name.split('.').pop();
  const path = `avatars/${_myId}.${ext}`;
  const { error: upErr } = await _sb.storage.from('biegamy-assets').upload(path, file, { upsert: true });
  if (upErr) { showToast('Błąd uploadu: ' + upErr.message); return; }
  const { data: urlData } = _sb.storage.from('biegamy-assets').getPublicUrl(path);
  const avatarUrl = urlData.publicUrl + '?t=' + Date.now();
  await _sb.from('athletes').update({ avatar_url: avatarUrl }).eq('id', _myId);
  const img = document.getElementById('av-img');
  img.src = avatarUrl;
  img.style.display = 'block';
  document.getElementById('av-initials').style.display = 'none';
  showToast('Zdjęcie profilowe zaktualizowane ✓');
}

// ── POSTS ─────────────────────────────────────────────────────────
async function loadPosts() {
  const { data: posts } = await _sb.from('profile_posts')
    .select('*')
    .eq('athlete_id', _targetId)
    .order('created_at', { ascending: false });

  const el = document.getElementById('posts-container');
  if (!posts?.length) {
    el.innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <div>${_isOwnProfile ? 'Dodaj swoje pierwsze zdjęcie lub cytat!' : 'Brak postów'}</div>
    </div>`;
    return;
  }

  // Renderuj: photo w gridzie 2-col, quote full-width
  let html = '<div class="posts-grid">';
  for (const p of posts) {
    const dateStr = new Date(p.created_at).toLocaleDateString('pl-PL', { day: 'numeric', month: 'short', year: 'numeric' });
    const delBtn = _isOwnProfile ? `<button class="post-quote-del" onclick="deletePost('${p.id}',event)">🗑</button>` : '';
    if (p.type === 'photo' && p.image_url) {
      html += `<div class="post-photo" onclick="openLightbox('${escAttr(p.image_url)}')">
        <img src="${escAttr(p.image_url)}" alt="${escAttr(p.content||'')}">
        <div class="post-photo-overlay"></div>
        ${_isOwnProfile ? `<button class="post-photo-del" onclick="event.stopPropagation();deletePost('${p.id}',event)">🗑</button>` : ''}
      </div>`;
    } else if (p.type === 'quote' && p.content) {
      html += `<div class="post-quote" style="grid-column:span 2;">
        ${delBtn}
        <div class="post-quote-text">${escHtml(p.content)}</div>
        <div class="post-date">${dateStr}</div>
      </div>`;
    }
  }
  html += '</div>';
  el.innerHTML = html;
}

async function deletePost(postId, e) {
  if (e) e.stopPropagation();
  if (!confirm('Usunąć post?')) return;
  const { error } = await _sb.from('profile_posts').delete().eq('id', postId);
  if (error) { showToast('Błąd: ' + error.message); return; }
  showToast('Post usunięty');
  loadPosts();
}

}

function switchPostType(type) {
  _postType = type;
  document.getElementById('tab-photo').classList.toggle('active', type === 'photo');
  document.getElementById('tab-quote').classList.toggle('active', type === 'quote');
  document.getElementById('form-photo').style.display = type === 'photo' ? 'block' : 'none';
  document.getElementById('form-quote').style.display = type === 'quote' ? 'block' : 'none';

function previewPostImg(input) {
  if (!input.files[0]) return;
  _postImgFile = input.files[0];
  const prev = document.getElementById('post-img-preview');
  prev.src = URL.createObjectURL(_postImgFile);
  prev.style.display = 'block';
}

async function submitPost() {
  if (!_myId) return;
  if (_postType === 'photo') {
    if (!_postImgFile) { showToast('Wybierz zdjęcie'); return; }
    const ext = _postImgFile.name.split('.').pop();
    const path = `profile-posts/${_myId}/${Date.now()}.${ext}`;
    const { error: upErr } = await _sb.storage.from('profile-posts').upload(path, _postImgFile);
    if (upErr) { showToast('Błąd uploadu: ' + upErr.message); return; }
    const { data: urlData } = _sb.storage.from('profile-posts').getPublicUrl(path);
    const desc = document.getElementById('post-photo-desc').value.trim();
    await _sb.from('profile_posts').insert({ athlete_id: _myId, type: 'photo', image_url: urlData.publicUrl, content: desc || null });
  } else {
    const text = document.getElementById('post-quote-text').value.trim();
    if (!text) { showToast('Wpisz cytat'); return; }
    await _sb.from('profile_posts').insert({ athlete_id: _myId, type: 'quote', content: text });
  }
  showToast('Post dodany ✓');
  closeAddPost();
  _postImgFile = null;
  document.getElementById('post-img-preview').style.display = 'none';
  document.getElementById('post-img-preview').src = '';
  document.getElementById('post-photo-desc').value = '';
  document.getElementById('post-quote-text').value = '';
  loadPosts();
}

async function loadProfileFriends() {
  var el = document.getElementById('profile-friends-content');

  el.innerHTML = '';
  var load = document.createElement('div');
  load.style.cssText = 'text-align:center;padding:32px;color:var(--muted);font-size:12px;';
  load.textContent = 'Ładowanie...';
  el.appendChild(load);

  var res = await _sb.from('friendships').select('requester_id,addressee_id').eq('status','accepted')
    .or('requester_id.eq.' + _targetId + ',addressee_id.eq.' + _targetId);
  var rows = res.data || [];
  el.innerHTML = '';

  if (!rows.length) {
    var empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;padding:40px 16px;color:var(--muted);font-size:13px;';
    empty.textContent = 'Brak znajomych';
    el.appendChild(empty);
    return;
  }

  var ids = rows.map(function(r){ return r.requester_id === _targetId ? r.addressee_id : r.requester_id; });
  var athRes = await _sb.from('athletes').select('id,full_name,pb_5k,goal,avatar_url').in('id', ids);

  var myStatuses = {};
  if (_myId && ids.length) {
    var orStr = ids.map(function(id){
      return 'and(requester_id.eq.'+_myId+',addressee_id.eq.'+id+'),and(requester_id.eq.'+id+',addressee_id.eq.'+_myId+')';
    }).join(',');
    var fsRes = await _sb.from('friendships').select('requester_id,addressee_id,status').or(orStr);
    (fsRes.data||[]).forEach(function(r){
      var other = r.requester_id===_myId ? r.addressee_id : r.requester_id;
      myStatuses[other] = r.status==='accepted' ? 'accepted' : (r.requester_id===_myId ? 'pending_sent' : 'pending_received');
    });
  }

  (athRes.data||[]).forEach(function(a) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border2);';

    var avWrap = document.createElement('div');
    avWrap.style.cssText = 'width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff7a45);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;flex-shrink:0;cursor:pointer;overflow:hidden;';
    avWrap.addEventListener('click', function(){ openAthleteProfile(a.id); });
    if (a.avatar_url) {
      var img = document.createElement('img');
      img.src = a.avatar_url; img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
      img.onerror = function(){ this.style.opacity = 0; };
      avWrap.appendChild(img);
    } else {
      avWrap.textContent = (a.full_name||'?').split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);
    }

    var info = document.createElement('div');
    info.style.cssText = 'flex:1;cursor:pointer;';
    info.addEventListener('click', function(){ openAthleteProfile(a.id); });
    var nm = document.createElement('div');
    nm.style.cssText = 'font-size:13px;font-weight:600;';
    nm.textContent = a.full_name || 'Biegacz';
    info.appendChild(nm);
    if (a.goal) { var g = document.createElement('div'); g.style.cssText='font-size:10px;color:var(--muted);margin-top:2px;'; g.textContent=a.goal; info.appendChild(g); }

    var fs = myStatuses[a.id];
    var actionEl = document.createElement('div');
    actionEl.style.cssText = 'flex-shrink:0;';
    if (!a.id === _myId && _myId) {
      if (fs === 'accepted') { actionEl.innerHTML = '<span style="font-size:10px;color:var(--green);padding:5px 8px;">✓ Znajomi</span>'; }
      else if (fs === 'pending_sent') { actionEl.innerHTML = '<span style="font-size:10px;color:var(--accent);">⏳</span>'; }
      else {
        var btn = document.createElement('button');
        btn.style.cssText = 'background:rgba(232,86,30,0.12);border:1px solid rgba(232,86,30,0.35);color:var(--accent);font-size:10px;padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;';
        btn.textContent = '+ Znajomy';
        btn.addEventListener('click', function(e){ e.stopPropagation(); quickAddFriend(a.id, btn); });
        actionEl.appendChild(btn);
      }
    }

    row.appendChild(avWrap); row.appendChild(info); row.appendChild(actionEl);
    el.appendChild(row);
  });
}

async function _doProfileSearch(q) {
  var el = document.getElementById('profile-search-results');
  var res = await _sb.from('athletes').select('id,full_name,pb_marathon,pb_5k,goal,avatar_url')
    .eq('is_public', true).ilike('full_name', '%' + q + '%').limit(20);
  var results = (res.data||[]).filter(function(a){ return a.id !== _myId; });
  el.innerHTML = '';

  if (!results.length) {
    var empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;padding:24px;color:var(--muted);font-size:12px;';
    empty.textContent = 'Brak wyników';
    el.appendChild(empty);
    return;
  }

  var myStatuses = {};
  var followSet = new Set();
  if (_myId) {
    var orStr = results.map(function(a){
      return 'and(requester_id.eq.'+_myId+',addressee_id.eq.'+a.id+'),and(requester_id.eq.'+a.id+',addressee_id.eq.'+_myId+')';
    }).join(',');
    var fsRes = await _sb.from('friendships').select('requester_id,addressee_id,status').or(orStr);
    (fsRes.data||[]).forEach(function(r){
      var o = r.requester_id===_myId ? r.addressee_id : r.requester_id;
      myStatuses[o] = r.status==='accepted' ? 'accepted' : (r.requester_id===_myId ? 'pending_sent' : 'pending_received');
    });
    var folRes = await _sb.from('follows').select('following_id').eq('follower_id', _myId);
    (folRes.data||[]).forEach(function(f){ followSet.add(f.following_id); });
  }

  results.forEach(function(a) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2);';

    var avWrap = document.createElement('div');
    avWrap.style.cssText = 'width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff7a45);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;flex-shrink:0;cursor:pointer;overflow:hidden;';
    avWrap.addEventListener('click', function(){ openAthleteProfile(a.id); });
    if (a.avatar_url) {
      var img = document.createElement('img'); img.src=a.avatar_url; img.style.cssText='width:100%;height:100%;object-fit:cover;'; img.onerror=function(){this.style.opacity=0;}; avWrap.appendChild(img);
    } else {
      avWrap.textContent = (a.full_name||'?').split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);
    }

    var info = document.createElement('div');
    info.style.cssText = 'flex:1;min-width:0;cursor:pointer;';
    info.addEventListener('click', function(){ openAthleteProfile(a.id); });
    var nm = document.createElement('div'); nm.style.cssText='font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'; nm.textContent=a.full_name||'Biegacz'; info.appendChild(nm);
    if (a.goal) { var g=document.createElement('div'); g.style.cssText='font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'; g.textContent=a.goal; info.appendChild(g); }

    var btns = document.createElement('div');
    btns.style.cssText = 'display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0;';
    var fs = myStatuses[a.id]; var isF = followSet.has(a.id);
    if (_myId) {
      var fb = document.createElement('button');
      if (fs==='accepted') { fb.style.cssText='font-size:9px;color:var(--green);padding:4px 8px;background:none;border:none;'; fb.textContent='✓ Znajomi'; }
      else if (fs==='pending_sent') { fb.style.cssText='font-size:9px;color:var(--accent);background:none;border:none;'; fb.textContent='⏳ Wysłano'; }
      else { fb.style.cssText='background:rgba(232,86,30,0.12);border:1px solid rgba(232,86,30,0.35);color:var(--accent);font-size:9px;padding:4px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;'; fb.textContent='+ Znajomy'; fb.addEventListener('click',function(){quickAddFriend(a.id,fb);}); }
      var flb = document.createElement('button');
      flb.style.cssText='background:'+(isF?'transparent':'rgba(91,140,255,0.1)')+';border:1px solid '+(isF?'var(--border)':'rgba(91,140,255,0.35)')+';color:'+(isF?'var(--muted)':'#5b8cff')+';font-size:9px;padding:4px 8px;border-radius:6px;cursor:pointer;';
      flb.textContent = isF ? '✓ Obserwujesz' : '+ Obserwuj';
      flb.addEventListener('click', function(){ quickFollow(a.id, flb, isF); });
      btns.appendChild(fb); btns.appendChild(flb);
    }

    row.appendChild(avWrap); row.appendChild(info); row.appendChild(btns);
    el.appendChild(row);
  });
}

async function quickAddFriend(targetId, btn) {
  if (!_myId) { showToast('Zaloguj się'); return; }
  var res = await _sb.from('friendships').insert({requester_id:_myId, addressee_id:targetId});
  if (res.error) { showToast('Błąd: ' + res.error.message); return; }
  btn.textContent = '⏳ Wysłano'; btn.disabled = true; btn.style.opacity = '0.6';
  showToast('Zaproszenie wysłane ✓');
  // Powiadomienie
  var me = await _sb.from('athletes').select('full_name').eq('id',_myId).maybeSingle();
  var myName = me.data?.full_name || 'Ktoś';
  _sb.from('notifications').insert({athlete_id:targetId,type:'friend_request',from_athlete_id:_myId,message:myName+' chce zostać Twoim znajomym',read:false,created_at:new Date().toISOString()}).then(function(){});
}

async function quickAccept(requesterId, btn) {
  if (!_myId) return;
  var res = await _sb.from('friendships').update({status:'accepted',updated_at:new Date().toISOString()})
    .eq('requester_id',requesterId).eq('addressee_id',_myId);
  if (res.error) { showToast('Błąd: ' + res.error.message); return; }
  btn.outerHTML = '<span style="font-size:10px;color:var(--green);">✓ Znajomi</span>';
  showToast('Jesteście znajomymi! 🎉');
  document.getElementById('ps-friends').textContent = parseInt(document.getElementById('ps-friends').textContent||0)+1;
}

async function quickFollow(targetId, btn, isFollowing) {
  if (!_myId) return;
  if (isFollowing) {
    await _sb.from('follows').delete().eq('follower_id',_myId).eq('following_id',targetId);
    btn.textContent='+ Obserwuj'; btn.style.color='#5b8cff'; btn.onclick=function(){quickFollow(targetId,btn,false);};
  } else {
    await _sb.from('follows').insert({follower_id:_myId, following_id:targetId});
    btn.textContent='✓ Obserwujesz'; btn.style.color='var(--muted)'; btn.onclick=function(){quickFollow(targetId,btn,true);};
  }
}

];

function _pHeroShow(i) {
  const bg = document.getElementById('p-hero-bg');

async function addGoalPrompt() {

    .select('id,name,date,city,distance_km,url_regulamin,url_organizer,signup_count')
    .ilike('name', '%' + raceName + '%')
    .limit(1);

  // Pobierz uczestników (przez race_signups lub przez race_goals zawodników)
  let participants = [];
  if (race) {
    const { data: signups } = await _sb.from('race_signups')
      .select('athlete_id')
      .eq('race_id', race.id)
      .limit(50);
    if (signups?.length) {

      const { data: aths } = await _sb.from('athletes')
        .select('id,full_name,avatar_url,is_public')

        + '<div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff7a45);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden;">' + av + '</div>'
        + '<div style="flex:1;font-size:13px;font-weight:500;">' + (a.full_name||'Biegacz').replace(/</g,'&lt;') + (isMe ? ' <span style="font-size:10px;color:var(--accent);">(Ty)</span>' : '') + '</div>'
        + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>'
        + '</div>';
    }).join('');
  }

  html += '</div></div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
}

function openAthleteProfile(id) { if(id) location.href = 'profil.html?id=' + id; }
// ── HELPERS ─────────────────────────────────────────────────────────────
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return (s||'').replace(/"/g,'&quot;'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function _pcLoad(t){
  if(!_myId)return;var el=document.getElementById('pc-thread');if(!el)return;
  var r=await _sb.from('peer_messages').select('from_id,body,sent_at').or('and(from_id.eq.'+_myId+',to_id.eq.'+t+'),and(from_id.eq.'+t+',to_id.eq.'+_myId+')').order('sent_at',{ascending:true}).limit(100);
  var msgs=r.data||[];
  if(!msgs.length){el.innerHTML='<div style="text-align:center;padding:32px;color:var(--muted);font-size:13px;">Napisz pierwszą wiadomość! 👋</div>';return;}
  el.innerHTML=msgs.map(function(m){var me=m.from_id===_myId;var t2=new Date(m.sent_at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});return '<div style="display:flex;justify-content:'+(me?'flex-end':'flex-start')+'"><div style="max-width:75%;background:'+(me?'var(--accent)':'rgba(255,255,255,0.08)')+';color:'+(me?'#fff':'var(--fg)')+';border-radius:'+(me?'14px 14px 4px 14px':'14px 14px 14px 4px')+';padding:9px 13px;font-size:13px;line-height:1.5;">'+escHtml(m.body)+'<div style="font-size:9px;opacity:0.6;margin-top:3px;text-align:right;">'+t2+'</div></div></div>';}).join('');
  el.scrollTop=el.scrollHeight;
}
async function _pcSend(t){
  if(!_myId)return;var inp=document.getElementById('pc-inp');if(!inp)return;var b=inp.value.trim();if(!b)return;inp.value='';
  await _sb.from('peer_messages').insert({from_id:_myId,to_id:t,body:b,sent_at:new Date().toISOString(),read:false});await _pcLoad(t);
}

var _allTr=[];
async function openTrainingsList(){
  if(document.getElementById('tr-ov')){document.getElementById('tr-ov').remove();return;}
  var ov=document.createElement('div');ov.id='tr-ov';ov.style.cssText='position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;';ov.onclick=function(e){if(e.target===ov)ov.remove();};
  var sh=document.createElement('div');sh.style.cssText='width:100%;max-width:480px;height:85vh;background:#0f0d18;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;';
  var hd=document.createElement('div');hd.style.cssText='padding:14px 20px 10px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;';hd.innerHTML='<div style="font-family:Bebas Neue,sans-serif;font-size:20px;">Historia <span style="color:var(--accent);">Treningów</span></div>';
  var xb=document.createElement('button');xb.textContent='✕';xb.style.cssText='background:rgba(255,255,255,0.08);border:none;color:var(--fg2);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;';xb.onclick=function(){ov.remove();};hd.appendChild(xb);
  var TYPES=['Wszystkie','Spokojny','Tempo','Interwały','Długi','Odpoczynek'];
  var fb=document.createElement('div');fb.style.cssText='display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.05);';
  fb.innerHTML=TYPES.map(function(t,i){return '<button data-type="'+(t==='Wszystkie'?'':t)+'" onclick="filterTr(this)" style="flex-shrink:0;background:'+(i===0?'rgba(232,86,30,0.15)':'rgba(255,255,255,0.05)')+';border:1px solid '+(i===0?'rgba(232,86,30,0.4)':'rgba(255,255,255,0.1)')+';color:'+(i===0?'var(--accent)':'var(--muted)')+';border-radius:20px;padding:5px 12px;font-size:10px;cursor:pointer;white-space:nowrap;">'+t+'</button>';}).join('');
  var li=document.createElement('div');li.id='tr-list';li.style.cssText='flex:1;overflow-y:auto;padding:4px 16px 24px;';li.innerHTML='<div style="text-align:center;padding:24px;color:var(--muted);font-size:12px;">Ładowanie...</div>';
  sh.appendChild(hd);sh.appendChild(fb);sh.appendChild(li);ov.appendChild(sh);document.body.appendChild(ov);
  var r=await _sb.from('training_logs').select('training_type,distance_km,pace,heart_rate,logged_at,comment,feel,attachment_url').eq('athlete_id',_targetId).not('training_type','like','__badge__%').order('logged_at',{ascending:false}).limit(300);
  _allTr=r.data||[];renderTr('');
}
function filterTr(btn){document.querySelectorAll('#tr-ov button[data-type]').forEach(function(b){b.style.background='rgba(255,255,255,0.05)';b.style.borderColor='rgba(255,255,255,0.1)';b.style.color='var(--muted)';});btn.style.background='rgba(232,86,30,0.15)';btn.style.borderColor='rgba(232,86,30,0.4)';btn.style.color='var(--accent)';renderTr(btn.dataset.type||'');}
function renderTr(filter){
  var li=document.getElementById('tr-list');if(!li)return;
  var logs=filter?_allTr.filter(function(l){return l.training_type===filter;}):_allTr;
  if(!logs.length){li.innerHTML='<div style="text-align:center;padding:32px;color:var(--muted);font-size:13px;">Brak treningów'+(filter?' — '+filter:'')+'</div>';return;}
  var TC={Spokojny:'#3db870',Tempo:'#e8561e','Interwały':'#e8b840',Długi:'#5b8cff',Odpoczynek:'#9a6fe8'};var FL={good:'😊',mid:'😐',bad:'😓'};
  var months={},mk=[];
  logs.forEach(function(l){var d=new Date(l.logged_at);var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(!months[k]){months[k]={label:d.toLocaleDateString('pl-PL',{month:'long',year:'numeric'}),items:[],km:0};mk.push(k);}months[k].items.push(l);months[k].km+=parseFloat(l.distance_km)||0;});
  var html='';
  mk.forEach(function(k){var m=months[k];html+='<div style="font-size:9px;text-transform:uppercase;color:var(--muted);padding:12px 0 6px;display:flex;justify-content:space-between;"><span>'+m.label+'</span>'+(m.km>0?'<span style="color:var(--accent);">'+m.km.toFixed(1)+' km</span>':'')+'</div>';
    m.items.forEach(function(l){var d=new Date(l.logged_at);var day=d.toLocaleDateString('pl-PL',{day:'numeric',month:'short'});var km=parseFloat(l.distance_km)||0;var col=TC[l.training_type]||'#66636e';var imgs=l.attachment_url?l.attachment_url.split(',').filter(Boolean):[];
      html+='<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-left:3px solid '+col+';border-radius:10px;padding:11px 13px;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:'+(km||l.comment||imgs.length?'5':'0')+'px;"><span style="font-size:9px;text-transform:uppercase;color:'+col+';font-weight:600;">'+escHtml(l.training_type||'Trening')+'</span>'+(FL[l.feel]||'')+'<span style="font-size:10px;color:var(--muted);margin-left:auto;">'+day+'</span></div>';
      if(km>0)html+='<div style="font-family:Bebas Neue,sans-serif;font-size:24px;line-height:1;color:var(--fg);">'+km.toFixed(1)+' km'+(l.pace?'<span style="font-size:12px;color:var(--muted);margin-left:8px;">'+l.pace+'/km</span>':'')+(l.heart_rate?'<span style="font-size:12px;color:#e05050;margin-left:8px;">♥ '+l.heart_rate+'</span>':'')+'</div>';
      if(l.comment)html+='<div style="font-size:12px;color:var(--fg2);margin-top:5px;line-height:1.5;">'+escHtml(l.comment)+'</div>';
      if(imgs.length){html+='<div style="display:flex;gap:4px;margin-top:8px;">';imgs.forEach(function(u){html+='<img src="'+u+'" data-lburl="'+u+'" onclick="openLightbox(this.dataset.lburl)" style="height:60px;width:60px;object-fit:cover;border-radius:6px;cursor:pointer;" onerror="this.style.opacity=0">';});html+='</div>';}
      html+='</div>';});});
  li.innerHTML=html;
}
