# supabase/config.toml — JEDYNE wersjonowane źródło `verify_jwt` dla Edge Functions.
#
# Do 06.10.2026 ten plik nie istniał: `verify_jwt` żyło wyłącznie w Dashboardzie, a jedyny
# zapis stanu to tabela z 13.07 w `.security-audit/2026-07-13/diagnoza-push.md:17-20`
# (po której część EF-ów zmieniła wartość — np. detect-moment). Skutek 06.10: `auto-reports-cron`
# miał na bramce ON, choć job cron woła go wyłącznie z `x-push-secret`, bez JWT — i odbijał się
# o bramkę ZANIM doszedł do kodu (patrz LEKCJE #20, objaw ostrzegawczy).
#
# ⚠️ `supabase functions deploy <nazwa>` czyta ten plik i USTAWIA verify_jwt na prod.
#    Wartość tutaj jest intencją; stan prod po deployu = ta wartość. Zmiana wiersza = zmiana bramki.
#
# REGUŁA DOBORU (6.10.2026):
#   true  — EF wołany WYŁĄCZNIE z przeglądarki z JWT sesji (bramka na brzegu + własna
#           `wymagajUsera`/getUser w kodzie: dwie warstwy).
#   false — EF wołany bez JWT usera: pg_cron / trigger pg_net (nagłówek `x-push-secret`),
#           webhook obcej usługi (sekret w ciele), albo inny EF z kluczem serwisowym.
#           Wtedy JEDYNĄ bramką jest własny guard EF — musi być ścisły (odrzucać przy pustym env).
#
# Tabela uzasadnień (kto woła, plik:linia) — w `.ai/zwiad-2026-10-06.md` i w komunikacie
# paczki 1b. Tu tylko decyzja per EF, żeby plik był czytelny.

