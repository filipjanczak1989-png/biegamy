<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BiegaMy — Panel Trenera</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--card:#16161a;--card2:#1e1e24;--border:#2a2a32;--accent:#d4501a;--accent2:#f06030;--fg:#f0ede8;--muted:#66636e;--muted2:#44424a;--green:#3db870;--yellow:#e8b840;--red:#e05050;--blue:#5090e0;--purple:#9a6fe8;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:80px;overflow-x:hidden;}
.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:52px 20px 12px;}
.topbar-greeting{font-size:12px;color:var(--muted);font-weight:300;}
.topbar-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.04em;line-height:1;}
.topbar-name span{color:var(--accent);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-av{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--card2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--accent);}
.notif-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.ndot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);}
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px;margin-bottom:20px;}
.qs-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center;}
.qs-val{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;}
.qs-val.a{color:var(--accent);}
.qs-val.g{color:var(--green);}
.qs-lbl{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;margin-top:4px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:10px;}
.sec-title{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;}
.sec-action{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);font-family:'DM Mono',monospace;background:none;border:none;cursor:pointer;padding:0;}
.ath-list{padding:0 20px;display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.ath-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;}
.ath-card:active{transform:scale(0.98);}
.ath-card.sel{border-color:var(--accent);background:rgba(212,80,26,0.06);}
.ath-stripe{position:absolute;left:0;top:0;bottom:0;width:3px;}
.ath-av{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;flex-shrink:0;}
.ath-info{flex:1;min-width:0;}
.ath-name{font-size:14px;font-weight:500;margin-bottom:2px;}
.ath-goal{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ath-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.ath-km{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;}
.ath-km-lbl{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;}
.ath-dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
.ath-dot.off{background:var(--muted2);}
.ath-badge{font-size:9px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:20px;}
.ath-badge.nl{background:rgba(61,184,112,0.15);color:var(--green);border:1px solid rgba(61,184,112,0.3);}
.ath-badge.pd{background:rgba(232,184,64,0.15);color:var(--yellow);border:1px solid rgba(232,184,64,0.3);}
.panel{margin:0 20px 20px;background:var(--card);border:1px solid var(--accent);border-radius:16px;overflow:hidden;display:none;}
.panel.on{display:block;}
.panel-hdr{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.panel-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--fg);flex-shrink:0;}
.panel-name{font-family:'Bebas Neue',sans-serif;font-size:22px;}
.panel-meta{font-size:11px;color:var(--muted);margin-top:1px;}
.panel-close{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;}
.panel-tabs{display:flex;border-bottom:1px solid var(--border);}
.ptab{flex:1;padding:10px 8px;text-align:center;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all 0.15s;}
.ptab.on{color:var(--fg);border-bottom-color:var(--accent);}
.panel-body{padding:16px 18px;}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.ms{background:var(--card2);border-radius:8px;padding:10px;text-align:center;}
.ms-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);line-height:1;}
.ms-lbl{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;}
.week-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;}
.wm{background:var(--card2);border-radius:6px;padding:6px 4px;text-align:center;}
.wm.today{background:rgba(212,80,26,0.15);border:1px solid rgba(212,80,26,0.3);}
.wm.done{background:rgba(61,184,112,0.12);}
.wm-n{font-size:8px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:2px;}
.wm-d{width:6px;height:6px;border-radius:50%;margin:0 auto 2px;}
.wm-k{font-size:9px;color:var(--muted);}
.plog{background:var(--card2);border-radius:8px;padding:12px;margin-bottom:8px;}
.pl-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.pl-type{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);font-family:'DM Mono',monospace;}
.pl-date{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;}
.pl-det{font-size:12px;margin-bottom:4px;}
.pl-cmt{font-size:11px;color:var(--muted);font-style:italic;}
.add-form{display:flex;flex-direction:column;gap:12px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;}
.field input,.field select,.field textarea{background:var(--card2);border:1px solid var(--border);color:var(--fg);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 12px;border-radius:8px;outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field select{cursor:pointer;}
.field select option{background:var(--card);}
.field textarea{resize:none;height:72px;line-height:1.6;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.type-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.tp{font-size:10px;font-family:'DM Mono',monospace;padding:6px 12px;border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all 0.15s;color:var(--muted);background:transparent;}
.tp.on{background:var(--accent);border-color:var(--accent);color:var(--fg);}
.btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:12px 20px;border:none;border-radius:10px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;}
.btn-p{background:var(--accent);color:var(--fg);}
.btn-p:hover{background:var(--accent2);}
.btn-g{background:rgba(61,184,112,0.15);color:var(--green);border:1px solid rgba(61,184,112,0.3);margin-top:8px;}
.pace-zones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;}
.pz{background:var(--card2);border-radius:8px;padding:8px 4px;text-align:center;}
.pz-v{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);line-height:1;}
.pz-n{font-size:8px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(22,22,26,0.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 0 20px;z-index:50;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer;text-decoration:none;}
.nl2{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;}
.ni.on .nl2{color:var(--accent);}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#0a1a0f;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;padding:12px 20px;border-radius:24px;white-space:nowrap;opacity:0;transition:all 0.3s;z-index:200;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.fi{animation:fi 0.35s ease forwards;opacity:0;}
@keyframes fi{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-greeting" id="greet">Dzien dobry,</div>

function calcP(){
  const ts=document.getElementById('ctime').value.trim();
  const dist=parseFloat(document.getElementById('cdist').value);
  if(!ts){showToast('Podaj wynik');return;}
  const p=ts.split(':').map(Number);
  let sec=p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60;
  const pps=sec/dist;
  const zn=[{n:'Z1 Reg.',m:1.30},{n:'Z2 Aerob.',m:1.18},{n:'Z3 Prog',m:1.08},{n:'Z4 Wyscig.',m:1.00},{n:'Z5 VO2',m:0.92}];
  const el=document.getElementById('pzones');
  el.style.display='grid';
  el.innerHTML=zn.map(z=>{const s=Math.round(pps*z.m);const m=Math.floor(s/60);const ss=String(s%60).padStart(2,'0');return`<div class="pz"><div class="pz-v">${m}:${ss}</div><div class="pz-n">${z.n}</div></div>`;}).join('');
}

async function initAuth() {
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) {
    // Try once more after short delay
    await new Promise(r => setTimeout(r, 800));

    if (!s2) return; // No redirect - just don't load data
    _coachId = s2.user.id;
    const name2 = s2.user.user_metadata?.full_name || 'Trener';
    const initials2 = name2.split(' ').map(x=>x[0]).toUpperCase().join('').slice(0,2);
    document.getElementById('av-btn').textContent = initials2;
    document.getElementById('menu-email').textContent = s2.user.email;
    document.querySelector('.topbar-name').innerHTML = 'Trener <span>' + name2.split(' ')[0] + '</span>';
    await loadAthletes();
    return;
  }
  _coachId = session.user.id;

async function loadAthletes() {

  if (!confirm('Usunąć zawodnika: ' + name + '?\nTa operacja jest nieodwracalna.')) return;

// Auto colon for time fields h:mm:ss
function autoColon(el) {
  let v = el.value.replace(/[^0-9]/g, '');
  if (v.length >= 2) v = v.slice(0,1) + ':' + v.slice(1);
  if (v.length >= 5) v = v.slice(0,4) + ':' + v.slice(4);
  el.value = v.slice(0,7);
}
// Auto colon for mm:ss
function autoColonShort(el) {
  let v = el.value.replace(/[^0-9]/g, '');
  if (v.length >= 3) v = v.slice(0,2) + ':' + v.slice(2);
  el.value = v.slice(0,5);
}
